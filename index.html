<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#601828">
<title>Punto y Coma · Facturación</title>
<style>
:root{--wine:#601828;--wine2:#42101c;--paper:#faf8f3;--ink:#282125;--muted:#786d71;--line:#e1d9d4;--white:#fff;--ok:#2f6f4e;--warn:#996a24}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;padding-bottom:80px}.head{background:var(--wine);color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font-family:Georgia,serif;letter-spacing:.12em;font-size:18px;line-height:1.12}.brand small{display:block;font:11px -apple-system,sans-serif;letter-spacing:.16em;opacity:.72;margin-top:8px}.hero{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.hero h1{font:400 30px Georgia,serif;margin:0}.mark{font:700 64px Georgia,serif;opacity:.16;line-height:.6}.wrap{padding:18px;max-width:980px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:600}.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}.btn.ghost{background:transparent}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.card{padding:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric{font:600 25px Georgia,serif;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}.panel-head h2{font:500 20px Georgia,serif;margin:0}.list{padding:0 16px}.row{padding:14px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:14px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{color:var(--muted)}.status{display:inline-block;font-size:11px;border-radius:999px;padding:4px 7px;background:#eee}.status.ok{background:#e3f2ea;color:var(--ok)}.status.warn{background:#f7eadf;color:var(--warn)}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px}.nav button.active{color:var(--wine);font-weight:700}.view{display:none}.view.active{display:block}.empty{text-align:center;color:var(--muted);padding:30px 14px}.modal{position:fixed;inset:0;background:rgba(28,15,20,.5);z-index:40;display:flex;align-items:flex-end}.sheet{background:var(--paper);width:100%;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet-head{position:sticky;top:0;background:rgba(250,248,243,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}.sheet-head h3{font:500 23px Georgia,serif;margin:0}.sheet-body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white}.field textarea{min-height:72px}.line{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.line-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.line .desc{grid-column:1/-1}.line button{float:right}.totals{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.totals .grand{font-size:20px;color:var(--wine);font-weight:700;border-top:1px solid var(--line);margin-top:5px;padding-top:11px}.sheet-actions{display:flex;gap:9px;padding-top:14px}.sheet-actions .btn{flex:1}.danger{color:#a12f3e}.invoice{background:white;padding:22px;border-radius:14px}.invoice .logo{font:600 16px Georgia,serif;letter-spacing:.12em;color:var(--wine)}.invoice h2{font:500 28px Georgia,serif;color:var(--wine);margin:24px 0 5px}.invoice table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}.invoice th,.invoice td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left}.toast{position:fixed;left:18px;right:18px;bottom:90px;background:#261f22;color:#fff;padding:12px 14px;border-radius:12px;z-index:60;text-align:center}@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:760px;border-radius:22px}.nav{left:50%;transform:translateX(-50%);max-width:600px;border:1px solid var(--line);border-radius:16px 16px 0 0}.wrap{padding:24px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="brand">PUNTO Y<br>COMA LEGAL<small>FACTURACIÓN · DEMO</small></div><div class="hero"><h1 id="title">Inicio</h1><div class="mark">;</div></div></header>
<main class="wrap">
<section id="home" class="view active"><div class="actions"><button class="btn primary" onclick="openDocument('factura')">Nueva factura</button><button class="btn" onclick="openDocument('proforma')">Nueva proforma</button></div><div class="cards" id="metrics"></div><div class="panel"><div class="panel-head"><h2>Últimos documentos</h2></div><div class="list" id="recent"></div></div></section>
<section id="documents" class="view"><div class="actions"><button class="btn primary" onclick="openDocument('factura')">Nueva factura</button><button class="btn" onclick="openDocument('rectificativa')">Rectificativa</button></div><div class="panel"><div class="panel-head"><h2>Documentos</h2></div><div class="list" id="docList"></div></div></section>
<section id="clients" class="view"><button class="btn primary" style="width:100%" onclick="openClient()">Nuevo cliente</button><div class="panel"><div class="panel-head"><h2>Clientes</h2></div><div class="list" id="clientList"></div></div></section>
<section id="settings" class="view"><div class="panel"><div class="panel-head"><h2>Configuración</h2></div><div class="sheet-body"><div class="field"><label>Nombre fiscal</label><input id="sName" placeholder="Julia Rico"></div><div class="field"><label>NIF</label><input id="sTax"></div><div class="field"><label>Dirección fiscal</label><input id="sAddress"></div><div class="grid"><div class="field"><label>IVA por defecto</label><input id="sVat" type="number" value="21"></div><div class="field"><label>IRPF por defecto</label><input id="sIrpf" type="number" value="15"></div></div><div class="field"><label>IBAN opcional</label><input id="sIban"></div><button class="btn primary" style="width:100%" onclick="saveSettings()">Guardar configuración</button></div></div></section>
</main>
<nav class="nav"><button class="active" data-view="home" onclick="showView('home',this)">Inicio</button><button data-view="documents" onclick="showView('documents',this)">Documentos</button><button data-view="clients" onclick="showView('clients',this)">Clientes</button><button data-view="settings" onclick="showView('settings',this)">Ajustes</button></nav>
</div><div id="modal"></div>
<script>
const KEY='pyc_demo_v01';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{name:'Julia Rico',tax:'',address:'',vat:21,irpf:15,iban:'',next:1},clients:[],documents:[]};let draft=null;
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(+n||0),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function showView(v,b){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));title.textContent={home:'Inicio',documents:'Documentos',clients:'Clientes',settings:'Configuración'}[v]}
function totals(d){let base=0,vat=0,irpf=0;(d.lines||[]).forEach(l=>{const b=(+l.qty||0)*(+l.price||0);base+=b;vat+=b*(+l.vat||0)/100;irpf+=b*(+l.irpf||0)/100});return{base,vat,irpf,total:base+vat-irpf}}
function render(){const invo=state.documents.filter(d=>d.type==='factura'),sum=invo.reduce((a,d)=>a+totals(d).total,0),pending=invo.filter(d=>d.status!=='cobrada').length;metrics.innerHTML=`<div class="card"><div class="label">Facturado</div><div class="metric">${money(sum)}</div></div><div class="card"><div class="label">Pendientes</div><div class="metric">${pending}</div></div><div class="card"><div class="label">Clientes</div><div class="metric">${state.clients.length}</div></div><div class="card"><div class="label">Documentos</div><div class="metric">${state.documents.length}</div></div>`;const rows=state.documents.slice().reverse().map(docRow).join('');recent.innerHTML=rows||'<div class="empty">Todavía no hay documentos.</div>';docList.innerHTML=rows||'<div class="empty">Crea la primera factura o proforma.</div>';clientList.innerHTML=state.clients.map(c=>`<div class="row" onclick="openClient('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.tax||'Sin NIF')} · ${esc(c.email||'')}</small></div><span>›</span></div>`).join('')||'<div class="empty">Añade el primer cliente.</div>';sName.value=state.settings.name||'';sTax.value=state.settings.tax||'';sAddress.value=state.settings.address||'';sVat.value=state.settings.vat??21;sIrpf.value=state.settings.irpf??15;sIban.value=state.settings.iban||''}
function docRow(d){const t=totals(d),c=state.clients.find(x=>x.id===d.clientId);return `<div class="row" onclick="preview('${d.id}')"><div><strong>${esc(d.number)} · ${esc(c?.name||'Sin cliente')}</strong><small>${esc(d.date)} · ${d.type}</small></div><div style="text-align:right"><strong>${money(t.total)}</strong><span class="status ${d.status==='cobrada'?'ok':'warn'}">${d.status}</span></div></div>`}
function closeModal(){modal.innerHTML=''}
function openClient(cid){const c=state.clients.find(x=>x.id===cid)||{id:id(),name:'',tax:'',address:'',email:'',phone:'',vat:state.settings.vat,irpf:state.settings.irpf};modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${cid?'Editar':'Nuevo'} cliente</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="field"><label>Nombre o razón social</label><input id="cName" value="${esc(c.name)}"></div><div class="grid"><div class="field"><label>NIF/CIF/NIE</label><input id="cTax" value="${esc(c.tax)}"></div><div class="field"><label>Email</label><input id="cEmail" value="${esc(c.email)}"></div></div><div class="field"><label>Dirección fiscal</label><input id="cAddress" value="${esc(c.address)}"></div><div class="grid"><div class="field"><label>IVA habitual</label><input id="cVat" type="number" value="${c.vat}"></div><div class="field"><label>IRPF habitual</label><input id="cIrpf" type="number" value="${c.irpf}"></div></div><div class="sheet-actions"><button class="btn primary" onclick="saveClient('${c.id}')">Guardar</button>${cid?`<button class="btn danger" onclick="deleteClient('${c.id}')">Eliminar</button>`:''}</div></div></div></div>`}
function saveClient(cid){const c={id:cid,name:cName.value.trim(),tax:cTax.value.trim(),email:cEmail.value.trim(),address:cAddress.value.trim(),vat:+cVat.value,irpf:+cIrpf.value};if(!c.name)return alert('Indica el nombre del cliente.');const i=state.clients.findIndex(x=>x.id===cid);i<0?state.clients.push(c):state.clients[i]=c;persist();closeModal();toast('Cliente guardado')}
function deleteClient(cid){if(confirm('¿Eliminar este cliente?')){state.clients=state.clients.filter(x=>x.id!==cid);persist();closeModal()}}
function openDocument(type,did){const old=state.documents.find(x=>x.id===did);draft=old?JSON.parse(JSON.stringify(old)):{id:id(),type,date:today(),number:type==='factura'?String(state.settings.next).padStart(3,'0'):type==='proforma'?'PRO-'+String(state.settings.next).padStart(3,'0'):'R-'+String(state.settings.next).padStart(3,'0'),clientId:'',status:'pendiente',lines:[{id:id(),desc:'Asesoramiento jurídico',qty:1,price:0,vat:state.settings.vat,irpf:state.settings.irpf}],notes:''};documentModal()}
function documentModal(){modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${draft.type==='proforma'?'Proforma':draft.type==='rectificativa'?'Rectificativa':'Factura'}</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="grid"><div class="field"><label>Número</label><input id="dNumber" value="${esc(draft.number)}"></div><div class="field"><label>Fecha</label><input id="dDate" type="date" value="${draft.date}"></div><div class="field full"><label>Cliente</label><select id="dClient" onchange="clientDefaults()"><option value="">Seleccionar cliente</option>${state.clients.map(c=>`<option value="${c.id}" ${draft.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div id="lines"></div><button class="btn" style="width:100%" onclick="addLine()">+ Añadir línea</button><div class="totals" id="docTotals"></div><div class="field" style="margin-top:14px"><label>Estado</label><select id="dStatus"><option value="pendiente" ${draft.status==='pendiente'?'selected':''}>Pendiente</option><option value="cobrada" ${draft.status==='cobrada'?'selected':''}>Cobrada</option><option value="borrador" ${draft.status==='borrador'?'selected':''}>Borrador</option></select></div><div class="field"><label>Notas</label><textarea id="dNotes">${esc(draft.notes)}</textarea></div><div class="sheet-actions"><button class="btn primary" onclick="saveDocument()">Guardar</button><button class="btn" onclick="previewDraft()">Vista previa</button>${state.documents.some(x=>x.id===draft.id)?'<button class="btn danger" onclick="deleteDocument()">Eliminar</button>':''}</div></div></div></div>`;renderLines()}
function capture(){draft.number=dNumber.value;draft.date=dDate.value;draft.clientId=dClient.value;draft.status=dStatus.value;draft.notes=dNotes.value;draft.lines=[...document.querySelectorAll('.line')].map(r=>({id:r.dataset.id,desc:r.querySelector('.desc input').value,qty:+r.querySelector('.qty').value,price:+r.querySelector('.price').value,vat:+r.querySelector('.vat').value,irpf:+r.querySelector('.irpf').value}))}
function renderLines(){lines.innerHTML=draft.lines.map(l=>`<div class="line" data-id="${l.id}"><button class="btn ghost danger" onclick="removeLine('${l.id}')">×</button><div class="line-grid"><div class="field desc"><label>Descripción</label><input value="${esc(l.desc)}" oninput="calc()"></div><div class="field"><label>Cantidad</label><input class="qty" type="number" step=".01" value="${l.qty}" oninput="calc()"></div><div class="field"><label>Precio</label><input class="price" type="number" step=".01" value="${l.price}" oninput="calc()"></div><div class="field"><label>IVA %</label><input class="vat" type="number" value="${l.vat}" oninput="calc()"></div><div class="field"><label>IRPF %</label><input class="irpf" type="number" value="${l.irpf}" oninput="calc()"></div></div></div>`).join('');calc()}
function calc(){capture();const t=totals(draft);docTotals.innerHTML=`<div><span>Base imponible</span><strong>${money(t.base)}</strong></div><div><span>IVA</span><strong>${money(t.vat)}</strong></div><div><span>IRPF</span><strong>− ${money(t.irpf)}</strong></div><div class="grand"><span>Total</span><strong>${money(t.total)}</strong></div>`}
function addLine(){capture();draft.lines.push({id:id(),desc:'',qty:1,price:0,vat:state.settings.vat,irpf:state.settings.irpf});renderLines()}
function removeLine(lid){capture();draft.lines=draft.lines.filter(x=>x.id!==lid);renderLines()}
function clientDefaults(){const c=state.clients.find(x=>x.id===dClient.value);if(!c)return;document.querySelectorAll('.vat').forEach(x=>x.value=c.vat);document.querySelectorAll('.irpf').forEach(x=>x.value=c.irpf);calc()}
function saveDocument(){capture();if(!draft.clientId)return alert('Selecciona un cliente.');if(!draft.number)return alert('Indica el número.');const i=state.documents.findIndex(x=>x.id===draft.id);i<0?state.documents.push(draft):state.documents[i]=draft;if(i<0&&draft.type==='factura')state.settings.next++;persist();closeModal();toast('Documento guardado')}
function deleteDocument(){if(confirm('¿Eliminar este documento?')){state.documents=state.documents.filter(x=>x.id!==draft.id);persist();closeModal()}}
function preview(did){draft=JSON.parse(JSON.stringify(state.documents.find(x=>x.id===did)));previewDraft()}
function previewDraft(){if(document.getElementById('dNumber'))capture();const c=state.clients.find(x=>x.id===draft.clientId)||{},t=totals(draft);modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>Vista previa</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="invoice"><div class="logo">PUNTO Y COMA LEGAL</div><h2>${draft.type.toUpperCase()}</h2><strong>${esc(draft.number)}</strong><p>${esc(draft.date)}</p><hr><p><strong>${esc(c.name||'Cliente')}</strong><br>${esc(c.tax||'')}<br>${esc(c.address||'')}</p><table><thead><tr><th>Concepto</th><th>Cant.</th><th>Precio</th></tr></thead><tbody>${draft.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td>${l.qty}</td><td>${money(l.price)}</td></tr>`).join('')}</tbody></table><div class="totals"><div><span>Base</span><strong>${money(t.base)}</strong></div><div><span>IVA</span><strong>${money(t.vat)}</strong></div><div><span>IRPF</span><strong>− ${money(t.irpf)}</strong></div><div class="grand"><span>Total</span><strong>${money(t.total)}</strong></div></div></div><div class="sheet-actions"><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn primary" onclick="openDocument('${draft.type}','${draft.id}')">Editar</button></div></div></div></div>`}
function saveSettings(){state.settings={...state.settings,name:sName.value,tax:sTax.value,address:sAddress.value,vat:+sVat.value,irpf:+sIrpf.value,iban:sIban.value};persist();toast('Configuración guardada')}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}render();
</script>
</body>
</html>
