<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#601828"><title>Punto y Coma Office</title><style>
:root{--w:#601828;--wd:#481020;--iv:#faf8f3;--ink:#282125;--muted:#796e72;--line:#dfd7d2;--soft:#f1ebe6;--gold:#a88f78;--ok:#2f6f4e;--warn:#9b6d28}*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;padding-bottom:82px}.top{background:var(--w);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 19px Georgia,serif;letter-spacing:.12em;line-height:1.05}.brand small{display:block;font:10px -apple-system,sans-serif;letter-spacing:.18em;opacity:.68;margin-top:8px}.hero{display:flex;justify-content:space-between;align-items:end;margin-top:26px}.hero h1{font:400 30px Georgia,serif;margin:0}.mark{font:700 66px Georgia,serif;opacity:.14;line-height:.7}.wrap{padding:18px;max-width:1050px;margin:auto}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:650}.btn.primary{background:var(--w);border-color:var(--w);color:#fff}.btn.ghost{background:transparent}.btn.danger{color:#a22c3d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.card{padding:16px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.metric{font:600 25px Georgia,serif;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:500 20px Georgia,serif}.list{padding:0 16px}.row{padding:14px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:#eee}.pill.ok{background:#e4f2ea;color:var(--ok)}.pill.warn{background:#f7ebdf;color:var(--warn)}.empty{text-align:center;padding:30px;color:var(--muted)}.backup-status{margin-top:10px;padding:12px;border-radius:12px;background:#f6f2ee;font-size:12px;line-height:1.5}.backup-status.ok{background:#e7f3eb;color:#2f6f4e}.backup-status.warn{background:#f7ebdf;color:#8a5f23}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.backup-actions .btn{width:100%}.view{display:none}.view.active{display:block}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:none;color:var(--muted);font-size:10px;padding:8px 2px}.nav button.active{color:var(--w);font-weight:750}.modal{position:fixed;inset:0;background:rgba(28,15,20,.55);z-index:50;display:flex;align-items:flex-end}.sheet{background:var(--iv);width:100%;max-height:96vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet-head{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:rgba(250,248,243,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.sheet-head h3{margin:0;font:500 23px Georgia,serif}.sheet-body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:92px}.sheet-actions{display:flex;gap:9px;padding-top:10px}.sheet-actions .btn{flex:1}.timeline{padding-left:10px}.event{position:relative;padding:0 0 18px 20px;border-left:1px solid var(--line)}.event:before{content:"";position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--w)}.event strong{display:block}.event small{color:var(--muted)}.doc-type{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.invoice-stage{background:#e9e4df;padding:10px;border-radius:16px;overflow:auto}.invoice-page{width:210mm;min-height:297mm;margin:auto;background:#fff;padding:20mm 18mm 15mm;color:#211d20;font-family:Arial,Helvetica,sans-serif;box-shadow:0 18px 45px rgba(45,25,32,.14);position:relative;overflow:hidden}.invoice-page:before{content:";";position:absolute;right:11mm;top:4mm;font:180px Georgia,serif;color:rgba(96,24,40,.035);line-height:1}.inv-top{display:grid;grid-template-columns:1.15fr .85fr;gap:22mm}.inv-brand{font:500 23px Georgia,serif;letter-spacing:.1em}.inv-sub{font-size:9px;letter-spacing:.38em;color:var(--gold);margin-top:8px}.inv-title{text-align:right}.inv-title h1{font:500 25px Georgia,serif;letter-spacing:.22em;margin:0}.inv-number{font-size:11px;color:var(--gold);letter-spacing:.15em;margin-top:10px}.inv-rule{border:0;border-top:1px solid var(--line);margin:12mm 0 9mm}.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:22mm}.inv-kicker{font-size:8px;letter-spacing:.24em;color:var(--gold);font-weight:700;margin-bottom:12px}.inv-party{font-size:10px;line-height:1.65}.inv-table{width:100%;border-collapse:collapse;margin-top:12mm;font-size:9.5px}.inv-table thead{background:#f6f2ee}.inv-table th{padding:11px 10px;text-transform:uppercase;letter-spacing:.18em;font-size:7.5px;text-align:left;color:#5c5055}.inv-table td{padding:13px 10px;border-bottom:1px solid #e7e0dc}.num{text-align:right!important}.inv-summary{width:42%;margin:10mm 0 0 auto;font-size:10px}.sumrow{display:flex;justify-content:space-between;padding:7px 12px}.sumtotal{display:flex;justify-content:space-between;background:#f3ede8;color:var(--w);padding:15px 13px;font:700 18px Georgia,serif;margin-top:7px}.inv-note{margin-top:11mm;border-left:1px solid #b7a08d;padding-left:12px;font-size:9.5px;line-height:1.55}.inv-bottom{margin-top:11mm;background:#f7f4f1;padding:14px 18px;display:grid;grid-template-columns:26px 1fr 150px;gap:18px;align-items:center}.inv-symbol{font:42px Georgia,serif;color:var(--gold)}.inv-bank{font-size:9px;line-height:1.5}.inv-sign{text-align:center}.inv-sign strong{display:block;font:600 18px Georgia,serif}.inv-sign small{display:block;margin-top:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.inv-footer{text-align:center;color:var(--gold);font-size:8px;letter-spacing:.24em;margin-top:9mm;font-weight:700}

</style></head><body><div class="app"><header class="top"><div class="brand">PUNTO Y COMA<small>OFFICE</small></div><div class="hero"><h1 id="pageTitle">Inicio</h1><div class="mark">;</div></div></header><main class="wrap">
<section id="home" class="view active"><div class="actions"><button class="btn primary" onclick="openClient()">Nuevo cliente</button><button class="btn" onclick="openCase()">Nuevo expediente</button></div><div id="metrics" class="cards"></div><div class="panel"><div class="panel-head"><h2>Actividad reciente</h2></div><div id="activity" class="list"></div></div></section>
<section id="clients" class="view"><button class="btn primary" style="width:100%" onclick="openClient()">Nuevo cliente</button><div class="panel"><div class="panel-head"><h2>Clientes</h2></div><div id="clientList" class="list"></div></div></section>
<section id="cases" class="view"><button class="btn primary" style="width:100%" onclick="openCase()">Nuevo expediente</button><div class="panel"><div class="panel-head"><h2>Expedientes</h2></div><div id="caseList" class="list"></div></div></section>
<section id="documents" class="view"><button class="btn primary" style="width:100%" onclick="openDocument()">Nuevo documento</button><div class="panel"><div class="panel-head"><h2>Documentos</h2></div><div id="docList" class="list"></div></div></section>
<section id="settings" class="view"><div class="panel"><div class="panel-head"><h2>Configuración</h2></div><div class="sheet-body"><div class="field"><label>Nombre fiscal</label><input id="sName"></div><div class="field"><label>NIF</label><input id="sTax"></div><div class="field"><label>Dirección</label><input id="sAddress"></div><div class="field"><label>Email</label><input id="sEmail"></div><div class="field"><label>IBAN</label><input id="sIban"></div><button class="btn primary" style="width:100%" onclick="saveSettings()">Guardar</button><div class="panel" style="margin-top:18px"><div class="panel-head"><h2>Copias de seguridad</h2></div><div class="sheet-body"><div class="field"><label><input id="autoBackupEnabled" type="checkbox" onchange="setAutoBackup(this.checked)" style="width:auto;margin-right:8px">Copia automática diaria al abrir</label></div><div id="backupStatus" class="backup-status warn">No se ha configurado una carpeta de copias.</div><div class="backup-actions"><button class="btn" onclick="chooseBackupFolder()">Elegir carpeta</button><button class="btn" onclick="createBackupNow()">Crear copia ahora</button><button class="btn" onclick="exportBackup()">Exportar JSON</button><button class="btn" onclick="document.getElementById('backupImport').click()">Importar copia</button></div><input id="backupImport" type="file" accept="application/json" hidden onchange="importBackup(event)"></div></div></div></div></section>
</main><nav class="nav"><button class="active" data-v="home" onclick="showView('home')">Inicio</button><button data-v="clients" onclick="showView('clients')">Clientes</button><button data-v="cases" onclick="showView('cases')">Expedientes</button><button data-v="documents" onclick="showView('documents')">Documentos</button><button data-v="settings" onclick="showView('settings')">Ajustes</button></nav></div><div id="modal"></div><script>
const KEY='pyc_office_v01',BACKUP_META_KEY='pyc_backup_meta_v01';let backupDirHandle=null;let state=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{name:'Julia María Rico López',signature:'Julia Rico',tax:'74011732D',address:'c/ Camí Can Dori 32, 08811 Canyelles, Barcelona',email:'info@pyc.legal',iban:'ES73 1465 0120 37 1773656323',vat:21,irpf:15,prefix:'F-2026-',next:1},clients:[],cases:[],documents:[],activity:[]};let draft=null;const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(+n||0),fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES'):'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}function backupPayload(){return{app:'Punto y Coma Office',version:1,exportedAt:new Date().toISOString(),data:state}}function backupFilename(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return`PYC_Backup_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`}function downloadJson(payload,name){const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportBackup(){downloadJson(backupPayload(),backupFilename());setBackupMeta({lastBackup:new Date().toISOString(),mode:'download'});updateBackupUI()}function setBackupMeta(patch){const meta={...JSON.parse(localStorage.getItem(BACKUP_META_KEY)||'{}'),...patch};localStorage.setItem(BACKUP_META_KEY,JSON.stringify(meta));return meta}function getBackupMeta(){return JSON.parse(localStorage.getItem(BACKUP_META_KEY)||'{}')}function setAutoBackup(enabled){setBackupMeta({enabled});updateBackupUI()}async function chooseBackupFolder(){if(!window.showDirectoryPicker){alert('La selección automática de carpeta requiere Chrome o Edge en PC/Mac. Puedes usar Exportar JSON en otros navegadores.');return}try{backupDirHandle=await window.showDirectoryPicker({mode:'readwrite'});setBackupMeta({folderName:backupDirHandle.name,enabled:true});await createBackupNow();}catch(e){if(e.name!=='AbortError')alert('No se pudo acceder a la carpeta: '+e.message)}updateBackupUI()}async function createBackupNow(){const payload=backupPayload(),name=backupFilename();if(backupDirHandle){try{const permission=await backupDirHandle.requestPermission({mode:'readwrite'});if(permission!=='granted')throw new Error('Permiso no concedido');const file=await backupDirHandle.getFileHandle(name,{create:true}),writer=await file.createWritable();await writer.write(JSON.stringify(payload,null,2));await writer.close();setBackupMeta({lastBackup:new Date().toISOString(),lastDate:new Date().toISOString().slice(0,10),folderName:backupDirHandle.name,enabled:true,mode:'folder'});updateBackupUI();return}catch(e){alert('No se pudo guardar en la carpeta seleccionada. Se descargará una copia manual.')}}downloadJson(payload,name);setBackupMeta({lastBackup:new Date().toISOString(),lastDate:new Date().toISOString().slice(0,10),mode:'download'});updateBackupUI()}async function maybeDailyBackup(){const meta=getBackupMeta();if(!meta.enabled)return;const todayKey=new Date().toISOString().slice(0,10);if(meta.lastDate===todayKey)return;if(backupDirHandle)await createBackupNow();else updateBackupUI()}function importBackup(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),data=parsed.data||parsed;if(!data||!Array.isArray(data.clients)||!Array.isArray(data.cases)||!Array.isArray(data.documents))throw new Error('Formato no válido');if(!confirm('Esta acción sustituirá los datos actuales. ¿Continuar?'))return;state=data;localStorage.setItem(KEY,JSON.stringify(state));log('Copia de seguridad restaurada',file.name);persist();alert('Copia restaurada correctamente.')}catch(e){alert('No se pudo importar la copia: '+e.message)}finally{event.target.value=''}};reader.readAsText(file)}function updateBackupUI(){const box=document.getElementById('backupStatus'),check=document.getElementById('autoBackupEnabled');if(!box||!check)return;const meta=getBackupMeta();check.checked=!!meta.enabled;let text=meta.folderName?`Carpeta: ${meta.folderName}. `:'Carpeta no vinculada en esta sesión. ';text+=meta.lastBackup?`Última copia: ${new Date(meta.lastBackup).toLocaleString('es-ES')}.`:'Todavía no hay copias.';box.textContent=text;box.className='backup-status '+(meta.lastBackup?'ok':'warn')}function log(text,meta=''){state.activity.unshift({id:uid(),date:today(),text,meta});state.activity=state.activity.slice(0,30)}function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('pageTitle').textContent={home:'Inicio',clients:'Clientes',cases:'Expedientes',documents:'Documentos',settings:'Configuración'}[v]}function closeModal(){$('modal').innerHTML=''}
function render(){const openCases=state.cases.filter(x=>x.status!=='cerrado').length,pending=state.documents.filter(x=>['factura','provision'].includes(x.type)&&x.status!=='cobrada').length,invoiceTotal=state.documents.filter(x=>x.type==='factura').reduce((a,d)=>a+(+d.total||0),0);$('metrics').innerHTML=`<div class="card"><div class="label">Clientes</div><div class="metric">${state.clients.length}</div></div><div class="card"><div class="label">Expedientes abiertos</div><div class="metric">${openCases}</div></div><div class="card"><div class="label">Pendientes</div><div class="metric">${pending}</div></div><div class="card"><div class="label">Facturado</div><div class="metric">${money(invoiceTotal)}</div></div>`;$('activity').innerHTML=state.activity.map(a=>`<div class="row"><div><strong>${esc(a.text)}</strong><small>${fmt(a.date)}${a.meta?' · '+esc(a.meta):''}</small></div></div>`).join('')||'<div class="empty">Sin actividad todavía.</div>';$('clientList').innerHTML=state.clients.map(c=>`<div class="row" onclick="openClientDetail('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.tax||'Sin NIF')} · ${state.cases.filter(x=>x.clientId===c.id).length} expedientes</small></div><span>›</span></div>`).join('')||'<div class="empty">Añade el primer cliente.</div>';$('caseList').innerHTML=state.cases.map(c=>{const cl=state.clients.find(x=>x.id===c.clientId);return `<div class="row" onclick="openCaseDetail('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(cl?.name||'Sin cliente')} · ${esc(c.code||'')} · ${state.documents.filter(x=>x.caseId===c.id).length} documentos</small></div><span class="pill ${c.status==='cerrado'?'':'ok'}">${esc(c.status)}</span></div>`}).join('')||'<div class="empty">No hay expedientes.</div>';$('docList').innerHTML=state.documents.slice().reverse().map(d=>{const c=state.clients.find(x=>x.id===d.clientId),ca=state.cases.find(x=>x.id===d.caseId);return `<div class="row" onclick="previewDocument('${d.id}')"><div><span class="doc-type">${labelType(d.type)}</span><strong>${esc(d.title||d.number||'Documento')}</strong><small>${esc(c?.name||'')} · ${esc(ca?.name||'Sin expediente')}</small></div><span>›</span></div>`}).join('')||'<div class="empty">No hay documentos.</div>';for(const [id,key] of Object.entries({sName:'name',sTax:'tax',sAddress:'address',sEmail:'email',sIban:'iban'}))$(id).value=state.settings[key]||''}
function openClient(cid=''){const c=state.clients.find(x=>x.id===cid)||{id:uid(),name:'',tax:'',address:'',email:'',phone:'',notes:''};$('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${cid?'Editar':'Nuevo'} cliente</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="field"><label>Nombre o razón social</label><input id="cName" value="${esc(c.name)}"></div><div class="grid"><div class="field"><label>NIF/CIF/NIE</label><input id="cTax" value="${esc(c.tax)}"></div><div class="field"><label>Email</label><input id="cEmail" value="${esc(c.email)}"></div></div><div class="field"><label>Dirección</label><input id="cAddress" value="${esc(c.address)}"></div><div class="field"><label>Notas</label><textarea id="cNotes">${esc(c.notes)}</textarea></div><div class="sheet-actions"><button class="btn primary" onclick="saveClient('${c.id}')">Guardar</button></div></div></div></div>`}function saveClient(id){const c={id,name:$('cName').value.trim(),tax:$('cTax').value.trim(),email:$('cEmail').value.trim(),address:$('cAddress').value.trim(),notes:$('cNotes').value.trim()};if(!c.name)return alert('Indica el nombre.');const i=state.clients.findIndex(x=>x.id===id);if(i<0){state.clients.push(c);log('Cliente creado',c.name)}else{state.clients[i]=c;log('Cliente actualizado',c.name)}persist();closeModal()}
function openCase(caseId='',clientId=''){if(!state.clients.length)return alert('Primero crea un cliente.');const c=state.cases.find(x=>x.id===caseId)||{id:uid(),clientId,name:'',code:'EXP-'+new Date().getFullYear()+'-'+String(state.cases.length+1).padStart(3,'0'),status:'abierto',opened:today(),notes:''};$('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${caseId?'Editar':'Nuevo'} expediente</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="field"><label>Cliente</label><select id="eClient">${state.clients.map(x=>`<option value="${x.id}" ${x.id===c.clientId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Nombre del caso</label><input id="eName" value="${esc(c.name)}" placeholder="Divorcio mutuo acuerdo"></div><div class="grid"><div class="field"><label>Código</label><input id="eCode" value="${esc(c.code)}"></div><div class="field"><label>Estado</label><select id="eStatus"><option ${c.status==='abierto'?'selected':''}>abierto</option><option ${c.status==='en espera'?'selected':''}>en espera</option><option ${c.status==='cerrado'?'selected':''}>cerrado</option></select></div></div><div class="field"><label>Notas</label><textarea id="eNotes">${esc(c.notes)}</textarea></div><div class="sheet-actions"><button class="btn primary" onclick="saveCase('${c.id}')">Guardar expediente</button></div></div></div></div>`}function saveCase(id){const c={id,clientId:$('eClient').value,name:$('eName').value.trim(),code:$('eCode').value.trim(),status:$('eStatus').value,opened:today(),notes:$('eNotes').value.trim()};if(!c.name)return alert('Indica el nombre del expediente.');const i=state.cases.findIndex(x=>x.id===id);if(i<0){state.cases.push(c);log('Expediente abierto',c.name)}else{state.cases[i]={...state.cases[i],...c};log('Expediente actualizado',c.name)}persist();closeModal()}
function openClientDetail(id){const c=state.clients.find(x=>x.id===id),cases=state.cases.filter(x=>x.clientId===id);$('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${esc(c.name)}</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="actions"><button class="btn primary" onclick="openCase('','${id}')">Nuevo expediente</button><button class="btn" onclick="openClient('${id}')">Editar cliente</button></div><div class="panel"><div class="panel-head"><h2>Expedientes</h2></div><div class="list">${cases.map(x=>`<div class="row" onclick="openCaseDetail('${x.id}')"><div><strong>${esc(x.name)}</strong><small>${esc(x.code)}</small></div><span>›</span></div>`).join('')||'<div class="empty">Sin expedientes.</div>'}</div></div></div></div></div>`}
function openCaseDetail(id){const c=state.cases.find(x=>x.id===id),cl=state.clients.find(x=>x.id===c.clientId),docs=state.documents.filter(x=>x.caseId===id);$('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${esc(c.name)}</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="label">${esc(c.code)} · ${esc(cl?.name||'')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="openDocument('','${c.clientId}','${c.id}')">Nuevo documento</button><button class="btn" onclick="openCase('${c.id}')">Editar expediente</button></div><div class="panel"><div class="panel-head"><h2>Cronología</h2></div><div class="sheet-body timeline">${docs.slice().reverse().map(d=>`<div class="event" onclick="previewDocument('${d.id}')"><strong>${esc(d.title||d.number)}</strong><small>${fmt(d.date)} · ${labelType(d.type)}</small></div>`).join('')||'<div class="empty">Sin documentos.</div>'}</div></div></div></div></div>`}
function labelType(t){return({factura:'Factura',rectificativa:'Factura rectificativa',proforma:'Proforma',provision:'Provisión de fondos',presupuesto:'Presupuesto',encargo:'Hoja de encargo',informativo:'Documento informativo',carta:'Carta al cliente',informe:'Informe',recibo:'Recibo',libre:'Documento libre'})[t]||t}
function openDocument(docId='',clientId='',caseId=''){if(!state.clients.length)return alert('Primero crea un cliente.');const d=state.documents.find(x=>x.id===docId)||{id:uid(),type:'factura',clientId,caseId,date:today(),number:state.settings.prefix+String(state.settings.next).padStart(3,'0'),title:'',body:'',status:'borrador',base:0,vat:21,irpf:15,total:0};$('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>Nuevo documento</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="field"><label>Tipo</label><select id="dType" onchange="toggleMoney()">${['factura','rectificativa','proforma','provision','presupuesto','encargo','informativo','carta','informe','recibo','libre'].map(t=>`<option value="${t}" ${d.type===t?'selected':''}>${labelType(t)}</option>`).join('')}</select></div><div class="field"><label>Cliente</label><select id="dClient" onchange="refreshCaseOptions()">${state.clients.map(x=>`<option value="${x.id}" ${x.id===d.clientId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Expediente</label><select id="dCase"></select></div><div class="grid"><div class="field"><label>Fecha</label><input id="dDate" type="date" value="${d.date}"></div><div class="field"><label>Número / referencia</label><input id="dNumber" value="${esc(d.number)}"></div></div><div class="field"><label>Título</label><input id="dTitle" value="${esc(d.title)}" placeholder="Asunto del documento"></div><div id="moneyBlock" class="grid"><div class="field"><label>Base</label><input id="dBase" type="number" value="${d.base||0}" oninput="calcDoc()"></div><div class="field"><label>IVA %</label><input id="dVat" type="number" value="${d.vat||0}" oninput="calcDoc()"></div><div class="field"><label>IRPF %</label><input id="dIrpf" type="number" value="${d.irpf||0}" oninput="calcDoc()"></div><div class="field"><label>Total</label><input id="dTotal" readonly value="${d.total||0}"></div></div><div class="field"><label>Contenido / notas</label><textarea id="dBody">${esc(d.body)}</textarea></div><div class="sheet-actions"><button class="btn primary" onclick="saveDocument('${d.id}')">Guardar</button><button class="btn" onclick="previewDraft('${d.id}')">Vista previa</button></div></div></div></div>`;refreshCaseOptions(d.caseId);toggleMoney();calcDoc()}
function refreshCaseOptions(selected=''){const cid=$('dClient').value,cases=state.cases.filter(x=>x.clientId===cid);$('dCase').innerHTML='<option value="">Sin expediente</option>'+cases.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function toggleMoney(){const t=$('dType').value;$('moneyBlock').style.display=['factura','rectificativa','proforma','provision','presupuesto','recibo'].includes(t)?'grid':'none'}function calcDoc(){const b=+$('dBase').value||0,v=+$('dVat').value||0,i=+$('dIrpf').value||0;$('dTotal').value=(b+b*v/100-b*i/100).toFixed(2)}function saveDocument(id){const d={id,type:$('dType').value,clientId:$('dClient').value,caseId:$('dCase').value,date:$('dDate').value,number:$('dNumber').value.trim(),title:$('dTitle').value.trim(),body:$('dBody').value.trim(),status:'borrador',base:+$('dBase')?.value||0,vat:+$('dVat')?.value||0,irpf:+$('dIrpf')?.value||0,total:+$('dTotal')?.value||0};const i=state.documents.findIndex(x=>x.id===id);if(i<0){state.documents.push(d);if(d.type==='factura')state.settings.next++;log('Documento creado',labelType(d.type))}else{state.documents[i]=d;log('Documento actualizado',labelType(d.type))}persist();closeModal()}
function previewDraft(id){saveDocument(id);previewDocument(id)}function previewDocument(id){const d=state.documents.find(x=>x.id===id),c=state.clients.find(x=>x.id===d.clientId),ca=state.cases.find(x=>x.id===d.caseId),s=state.settings;const hasMoney=['factura','rectificativa','proforma','provision','presupuesto','recibo'].includes(d.type);$('modal').innerHTML=`<div class="modal"><div class="sheet" style="max-width:1100px"><div class="sheet-head"><h3>Vista previa</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="invoice-stage"><article class="invoice-page"><div class="inv-top"><div><div class="inv-brand">PUNTO Y COMA</div><div class="inv-sub">LEGAL</div></div><div class="inv-title"><h1>${labelType(d.type).toUpperCase()}</h1><div class="inv-number">${esc(d.number||'')}</div></div></div><hr class="inv-rule"><div class="inv-parties"><div><div class="inv-kicker">EMISOR</div><div class="inv-party"><strong>${esc(s.name)}</strong><br>NIF: ${esc(s.tax)}<br>${esc(s.address)}<br>${esc(s.email)}</div></div><div><div class="inv-kicker">CLIENTE</div><div class="inv-party"><strong>${esc(c?.name||'')}</strong><br>${c?.tax?'NIF: '+esc(c.tax)+'<br>':''}${esc(c?.address||'')}<br>${esc(ca?.name||'')}</div></div></div>${d.title?`<h2 style="font:500 21px Georgia,serif;margin-top:14mm">${esc(d.title)}</h2>`:''}${d.body?`<div style="font-size:10px;line-height:1.7;white-space:pre-wrap;margin-top:6mm">${esc(d.body)}</div>`:''}${hasMoney?`<div class="inv-summary"><div class="sumrow"><span>Base imponible</span><strong>${money(d.base)}</strong></div>${d.vat?`<div class="sumrow"><span>IVA (${d.vat}%)</span><strong>${money(d.base*d.vat/100)}</strong></div>`:''}${d.irpf?`<div class="sumrow"><span>IRPF (${d.irpf}%)</span><strong>− ${money(d.base*d.irpf/100)}</strong></div>`:''}<div class="sumtotal"><span>TOTAL</span><span>${money(d.total)}</span></div></div>`:''}<div class="inv-bottom"><div class="inv-symbol">;</div><div class="inv-bank"><b>DATOS BANCARIOS</b><br>${esc(s.iban)}</div><div class="inv-sign"><strong>Julia Rico</strong><small>Abogada</small></div></div><div class="inv-footer">PUNTOYCOMA.LEGAL</div></article></div><div class="sheet-actions"><button class="btn primary" onclick="printDocument()">Generar PDF / Imprimir</button><button class="btn" onclick="openDocument('${d.id}')">Editar</button></div></div></div></div>`;fitInvoice()}function fitInvoice(){setTimeout(()=>{const stage=document.querySelector('.invoice-stage'),page=document.querySelector('.invoice-page');if(!stage||!page)return;const sc=Math.min(1,(stage.clientWidth-8)/page.offsetWidth);page.style.transform=`scale(${sc})`;page.style.transformOrigin='top left';page.style.marginBottom=`${page.offsetHeight*(sc-1)}px`},20)}function printDocument(){const page=document.querySelector('.invoice-page').cloneNode(true);page.removeAttribute('style');const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');const w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir.');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><style>${css}@page{size:A4;margin:0}html,body{margin:0;background:#fff}.invoice-page{transform:none!important;box-shadow:none!important;margin:0!important}</style></head><body>${page.outerHTML}<script>onload=()=>setTimeout(()=>print(),250)<\/script></body></html>`);w.document.close()}function saveSettings(){state.settings={...state.settings,name:$('sName').value,tax:$('sTax').value,address:$('sAddress').value,email:$('sEmail').value,iban:$('sIban').value};log('Configuración actualizada');persist()}render();updateBackupUI();maybeDailyBackup();
</script></body></html>
