<style>
:root{--wine:#601828;--wine2:#481020;--paper:#faf8f3;--ink:#282125;--muted:#786d71;--line:#ded6d1;--beige:#ede5dc;--gold:#bca47b;--white:#fff;--ok:#2f6f4e;--warn:#996a24}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;padding-bottom:80px}.head{background:var(--wine);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font-family:Georgia,serif;letter-spacing:.12em;font-size:18px;line-height:1.12}.brand small{display:block;font:11px -apple-system,sans-serif;letter-spacing:.16em;opacity:.72;margin-top:8px}.hero{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.hero h1{font:400 30px Georgia,serif;margin:0}.mark{font:700 64px Georgia,serif;opacity:.16;line-height:.6}.wrap{padding:18px;max-width:980px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:600}.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}.btn.ghost{background:transparent}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.card{padding:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.metric{font:600 25px Georgia,serif;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}.panel-head h2{font:500 20px Georgia,serif;margin:0}.list{padding:0 16px}.row{padding:14px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:14px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{color:var(--muted)}.status{display:inline-block;font-size:11px;border-radius:999px;padding:4px 7px;background:#eee}.status.ok{background:#e3f2ea;color:var(--ok)}.status.warn{background:#f7eadf;color:var(--warn)}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px}.nav button.active{color:var(--wine);font-weight:700}.view{display:none}.view.active{display:block}.empty{text-align:center;color:var(--muted);padding:30px 14px}.modal{position:fixed;inset:0;background:rgba(28,15,20,.55);z-index:40;display:flex;align-items:flex-end}.sheet{background:var(--paper);width:100%;max-height:96vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet.preview-sheet{max-width:1100px}.sheet-head{position:sticky;top:0;background:rgba(250,248,243,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);z-index:5}.sheet-head h3{font:500 23px Georgia,serif;margin:0}.sheet-body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.field textarea{min-height:72px}.line{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.line-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.line .desc{grid-column:1/-1}.line button{float:right}.totals{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.totals .grand{font-size:20px;color:var(--wine);font-weight:700;border-top:1px solid var(--line);margin-top:5px;padding-top:11px}.sheet-actions{display:flex;gap:9px;padding-top:14px}.sheet-actions .btn{flex:1}.danger{color:#a12f3e}.toast{position:fixed;left:18px;right:18px;bottom:90px;background:#261f22;color:#fff;padding:12px 14px;border-radius:12px;z-index:60;text-align:center}
.invoice-stage{background:#e9e4df;padding:14px;border-radius:16px;overflow:auto}.invoice-page{width:210mm;min-height:297mm;margin:auto;background:#fff;padding:18mm 18mm 14mm;color:#242024;font-family:Arial,Helvetica,sans-serif;box-shadow:0 18px 45px rgba(45,25,32,.18);position:relative}.inv-top{display:grid;grid-template-columns:1.2fr .8fr;gap:25mm;align-items:start}.inv-brand{font-family:Georgia,serif;font-size:25px;letter-spacing:.08em;line-height:1.05}.inv-brand-sub{margin-top:8px;font-size:10px;letter-spacing:.34em;color:var(--gold)}.inv-symbol{font:64px Georgia,serif;color:var(--gold);line-height:.7;margin-left:8px}.inv-brand-row{display:flex;align-items:flex-start}.inv-title{text-align:right}.inv-title h1{margin:0;font-size:24px;letter-spacing:.32em;font-weight:500}.inv-title .number{color:var(--gold);font-size:12px;letter-spacing:.12em;margin:10px 0 22px}.inv-meta{display:grid;grid-template-columns:auto auto;gap:8px 20px;font-size:10px;text-align:left}.inv-meta b{text-align:right;font-weight:500}.inv-rule{border:0;border-top:1px solid var(--line);margin:12mm 0 9mm}.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:24mm}.inv-kicker{font-size:9px;letter-spacing:.22em;color:var(--gold);font-weight:700;margin-bottom:13px}.inv-party{font-size:10px;line-height:1.65}.inv-party strong{font-size:11px}.inv-table{width:100%;border-collapse:collapse;margin-top:12mm;font-size:9.5px}.inv-table thead{background:#f3efeb}.inv-table th{padding:12px 10px;text-transform:uppercase;letter-spacing:.16em;font-size:8px;text-align:left}.inv-table th.num,.inv-table td.num{text-align:right}.inv-table td{padding:13px 10px;border-bottom:1px solid #e7e0dc;vertical-align:top}.inv-desc{font-weight:600}.inv-summary{width:46%;margin:9mm 0 0 auto;font-size:10px}.inv-summary-row{display:flex;justify-content:space-between;padding:7px 12px}.inv-summary-total{background:#f1ebe6;margin-top:5px;padding:13px 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between}.inv-note{margin-top:10mm;border-left:2px solid var(--gold);padding-left:12px;font-size:9.5px;line-height:1.5}.inv-note b{display:block;font-size:8px;letter-spacing:.16em;margin-bottom:5px}.inv-bottom{margin-top:10mm;background:#f4f0ec;padding:14px 18px;display:grid;grid-template-columns:34px 1fr 170px;gap:18px;align-items:center;break-inside:avoid}.inv-bottom-symbol{font:48px Georgia,serif;color:var(--gold)}.inv-bank{font-size:9px;line-height:1.5}.inv-bank b{display:block;font-size:8px;letter-spacing:.16em;margin-bottom:6px}.inv-sign{text-align:center}.inv-sign .thanks{font:italic 29px Georgia,serif}.inv-sign strong{display:block;margin-top:4px}.inv-sign small{display:block;margin-top:4px}.inv-footer{text-align:center;color:var(--gold);font-size:9px;letter-spacing:.22em;margin-top:8mm;font-weight:700}.proforma-flag{display:inline-block;margin-top:8px;font-size:8px;letter-spacing:.16em;color:var(--wine);border:1px solid var(--wine);padding:5px 7px}.rect-box{margin-top:7mm;background:#f8f4f1;border-left:2px solid var(--wine);padding:9px 12px;font-size:9px;line-height:1.5}
@media(max-width:760px){.invoice-stage{padding:6px}.preview-sheet .sheet-body{padding:8px}.cards{grid-template-columns:repeat(2,1fr)}}@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:760px;border-radius:22px}.nav{left:50%;transform:translateX(-50%);max-width:600px;border:1px solid var(--line);border-radius:16px 16px 0 0}.wrap{padding:24px}}

<body><div class="app"><header class="head"><div class="brand">PUNTO Y<br>COMA LEGAL<small>FACTURACIÓN · DEMO</small></div><div class="hero"><h1 id="title">Inicio</h1><div class="mark">;</div></div></header><main class="wrap">
<section id="home" class="view active"><div class="actions"><button class="btn primary" onclick="openDocument('factura')">Nueva factura</button><button class="btn" onclick="openDocument('proforma')">Nueva proforma</button></div><div class="cards" id="metrics"></div><div class="panel"><div class="panel-head"><h2>Últimos documentos</h2></div><div class="list" id="recent"></div></div></section>
<section id="documents" class="view"><div class="actions"><button class="btn primary" onclick="openDocument('factura')">Nueva factura</button><button class="btn" onclick="openDocument('rectificativa')">Rectificativa</button></div><div class="panel"><div class="panel-head"><h2>Documentos</h2></div><div class="list" id="docList"></div></div></section>
<section id="clients" class="view"><button class="btn primary" style="width:100%" onclick="openClient()">Nuevo cliente</button><div class="panel"><div class="panel-head"><h2>Clientes</h2></div><div class="list" id="clientList"></div></div></section>
<section id="settings" class="view"><div class="panel"><div class="panel-head"><h2>Configuración</h2></div><div class="sheet-body"><div class="field"><label>Nombre fiscal</label><input id="sName"></div><div class="field"><label>NIF</label><input id="sTax"></div><div class="field"><label>Dirección fiscal</label><input id="sAddress"></div><div class="grid"><div class="field"><label>Email</label><input id="sEmail"></div><div class="field"><label>Teléfono</label><input id="sPhone"></div></div><div class="field"><label>Web</label><input id="sWeb"></div><div class="field"><label>Prefijo de factura</label><input id="sPrefix" placeholder="F-2026-"></div><div class="grid"><div class="field"><label>IVA por defecto</label><input id="sVat" type="number"></div><div class="field"><label>IRPF por defecto</label><input id="sIrpf" type="number"></div></div><div class="field"><label>IBAN opcional</label><input id="sIban"></div><button class="btn primary" style="width:100%" onclick="saveSettings()">Guardar configuración</button></div></div></section>
</main><nav class="nav"><button class="active" data-view="home" onclick="showView('home')">Inicio</button><button data-view="documents" onclick="showView('documents')">Documentos</button><button data-view="clients" onclick="showView('clients')">Clientes</button><button data-view="settings" onclick="showView('settings')">Ajustes</button></nav></div><div id="modal"></div>
<script>
const KEY='pyc_demo_v03';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{name:'Julia María Rico López',tax:'74011732D',address:'c/ Camí Can Dori 32, 08811 Canyelles, Barcelona',email:'info@pyc.legal',phone:'',web:'www.puntoycoma.legal',vat:21,irpf:15,iban:'ES73 1465 0120 37 1773656323',prefix:'F-2026-',next:1},clients:[],documents:[]};let draft=null;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(+n||0),dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES'):'',today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));title.textContent={home:'Inicio',documents:'Documentos',clients:'Clientes',settings:'Configuración'}[v]}function totals(d){let base=0,vat=0,irpf=0;(d.lines||[]).forEach(l=>{const b=(+l.qty||0)*(+l.price||0);base+=b;vat+=b*(+l.vat||0)/100;irpf+=b*(+l.irpf||0)/100});return{base,vat,irpf,total:base+vat-irpf}}
function render(){const invo=state.documents.filter(d=>d.type==='factura'),sum=invo.reduce((a,d)=>a+totals(d).total,0),pending=invo.filter(d=>d.status!=='cobrada').length;metrics.innerHTML=`<div class="card"><div class="label">Facturado</div><div class="metric">${money(sum)}</div></div><div class="card"><div class="label">Pendientes</div><div class="metric">${pending}</div></div><div class="card"><div class="label">Clientes</div><div class="metric">${state.clients.length}</div></div><div class="card"><div class="label">Documentos</div><div class="metric">${state.documents.length}</div></div>`;const rows=state.documents.slice().reverse().map(docRow).join('');recent.innerHTML=rows||'<div class="empty">Todavía no hay documentos.</div>';docList.innerHTML=rows||'<div class="empty">Crea la primera factura o proforma.</div>';clientList.innerHTML=state.clients.map(c=>`<div class="row" onclick="openClient('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.tax||'Sin NIF')} · ${esc(c.email||'')}</small></div><span>›</span></div>`).join('')||'<div class="empty">Añade el primer cliente.</div>';for(const [k,v] of Object.entries({sName:'name',sTax:'tax',sAddress:'address',sEmail:'email',sPhone:'phone',sWeb:'web',sPrefix:'prefix',sVat:'vat',sIrpf:'irpf',sIban:'iban'}))document.getElementById(k).value=state.settings[v]??''}function docRow(d){const t=totals(d),c=state.clients.find(x=>x.id===d.clientId);return `<div class="row" onclick="preview('${d.id}')"><div><strong>${esc(d.number)} · ${esc(c?.name||'Sin cliente')}</strong><small>${dateFmt(d.date)} · ${d.type}</small></div><div style="text-align:right"><strong>${money(t.total)}</strong><span class="status ${d.status==='cobrada'?'ok':'warn'}">${d.status}</span></div></div>`}function closeModal(){modal.innerHTML=''}
function openClient(cid){const c=state.clients.find(x=>x.id===cid)||{id:id(),name:'',tax:'',address:'',email:'',phone:'',vat:state.settings.vat,irpf:state.settings.irpf};modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${cid?'Editar':'Nuevo'} cliente</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="field"><label>Nombre o razón social</label><input id="cName" value="${esc(c.name)}"></div><div class="grid"><div class="field"><label>NIF/CIF/NIE</label><input id="cTax" value="${esc(c.tax)}"></div><div class="field"><label>Email</label><input id="cEmail" value="${esc(c.email)}"></div></div><div class="field"><label>Dirección fiscal</label><input id="cAddress" value="${esc(c.address)}"></div><div class="grid"><div class="field"><label>IVA habitual</label><input id="cVat" type="number" value="${c.vat}"></div><div class="field"><label>IRPF habitual</label><input id="cIrpf" type="number" value="${c.irpf}"></div></div><div class="sheet-actions"><button class="btn primary" onclick="saveClient('${c.id}')">Guardar</button>${cid?`<button class="btn danger" onclick="deleteClient('${c.id}')">Eliminar</button>`:''}</div></div></div></div>`}function saveClient(cid){const c={id:cid,name:cName.value.trim(),tax:cTax.value.trim(),email:cEmail.value.trim(),address:cAddress.value.trim(),vat:+cVat.value,irpf:+cIrpf.value};if(!c.name)return alert('Indica el nombre del cliente.');const i=state.clients.findIndex(x=>x.id===cid);i<0?state.clients.push(c):state.clients[i]=c;persist();closeModal();toast('Cliente guardado')}function deleteClient(cid){if(confirm('¿Eliminar este cliente?')){state.clients=state.clients.filter(x=>x.id!==cid);persist();closeModal()}}
function openDocument(type,did){const old=state.documents.find(x=>x.id===did),s=state.settings;draft=old?JSON.parse(JSON.stringify(old)):{id:id(),type,date:today(),due:'',payment:'Transferencia bancaria',number:type==='factura'?(s.prefix||'F-2026-')+String(s.next).padStart(3,'0'):type==='proforma'?'PRO-2026-'+String(s.next).padStart(3,'0'):'R-2026-'+String(s.next).padStart(3,'0'),clientId:'',status:'pendiente',lines:[{id:id(),desc:'Asesoramiento jurídico',detail:'',qty:1,price:0,vat:s.vat,irpf:s.irpf}],notes:'Gracias por confiar en nuestros servicios. Quedamos a su disposición para cualquier consulta.'};documentModal()}function documentModal(){modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${draft.type==='proforma'?'Proforma':draft.type==='rectificativa'?'Rectificativa':'Factura'}</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="grid"><div class="field"><label>Número</label><input id="dNumber" value="${esc(draft.number)}"></div><div class="field"><label>Fecha</label><input id="dDate" type="date" value="${draft.date}"></div><div class="field"><label>Vencimiento opcional</label><input id="dDue" type="date" value="${draft.due||''}"></div><div class="field"><label>Forma de pago</label><input id="dPayment" value="${esc(draft.payment||'')}"></div><div class="field full"><label>Cliente</label><select id="dClient" onchange="clientDefaults()"><option value="">Seleccionar cliente</option>${state.clients.map(c=>`<option value="${c.id}" ${draft.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div id="lines"></div><button class="btn" style="width:100%" onclick="addLine()">+ Añadir línea</button><div class="totals" id="docTotals"></div><div class="field" style="margin-top:14px"><label>Estado</label><select id="dStatus"><option value="pendiente" ${draft.status==='pendiente'?'selected':''}>Pendiente</option><option value="cobrada" ${draft.status==='cobrada'?'selected':''}>Cobrada</option><option value="borrador" ${draft.status==='borrador'?'selected':''}>Borrador</option></select></div><div class="field"><label>Nota</label><textarea id="dNotes">${esc(draft.notes||'')}</textarea></div><div class="sheet-actions"><button class="btn primary" onclick="saveDocument()">Guardar</button><button class="btn" onclick="previewDraft()">Vista previa</button>${state.documents.some(x=>x.id===draft.id)?'<button class="btn danger" onclick="deleteDocument()">Eliminar</button>':''}</div></div></div></div>`;renderLines()}function capture(){draft.number=dNumber.value;draft.date=dDate.value;draft.due=dDue.value;draft.payment=dPayment.value;draft.clientId=dClient.value;draft.status=dStatus.value;draft.notes=dNotes.value;draft.lines=[...document.querySelectorAll('.line')].map(r=>({id:r.dataset.id,desc:r.querySelector('.desc input').value,detail:r.querySelector('.detail input').value,qty:+r.querySelector('.qty').value,price:+r.querySelector('.price').value,vat:+r.querySelector('.vat').value,irpf:+r.querySelector('.irpf').value}))}function renderLines(){lines.innerHTML=draft.lines.map(l=>`<div class="line" data-id="${l.id}"><button class="btn ghost danger" onclick="removeLine('${l.id}')">×</button><div class="line-grid"><div class="field desc"><label>Concepto</label><input value="${esc(l.desc)}" oninput="calc()"></div><div class="field desc detail"><label>Descripción opcional</label><input value="${esc(l.detail||'')}" oninput="calc()"></div><div class="field"><label>Cantidad</label><input class="qty" type="number" step=".01" value="${l.qty}" oninput="calc()"></div><div class="field"><label>Precio</label><input class="price" type="number" step=".01" value="${l.price}" oninput="calc()"></div><div class="field"><label>IVA %</label><input class="vat" type="number" value="${l.vat}" oninput="calc()"></div><div class="field"><label>IRPF %</label><input class="irpf" type="number" value="${l.irpf}" oninput="calc()"></div></div></div>`).join('');calc()}function calc(){capture();const t=totals(draft);docTotals.innerHTML=`<div><span>Base imponible</span><strong>${money(t.base)}</strong></div>${t.vat?`<div><span>IVA</span><strong>${money(t.vat)}</strong></div>`:''}${t.irpf?`<div><span>IRPF</span><strong>− ${money(t.irpf)}</strong></div>`:''}<div class="grand"><span>Total</span><strong>${money(t.total)}</strong></div>`}function addLine(){capture();draft.lines.push({id:id(),desc:'',detail:'',qty:1,price:0,vat:state.settings.vat,irpf:state.settings.irpf});renderLines()}function removeLine(lid){capture();draft.lines=draft.lines.filter(x=>x.id!==lid);renderLines()}function clientDefaults(){const c=state.clients.find(x=>x.id===dClient.value);if(!c)return;document.querySelectorAll('.vat').forEach(x=>x.value=c.vat);document.querySelectorAll('.irpf').forEach(x=>x.value=c.irpf);calc()}function saveDocument(){capture();if(!draft.clientId)return alert('Selecciona un cliente.');if(!draft.number)return alert('Indica el número.');const i=state.documents.findIndex(x=>x.id===draft.id);i<0?state.documents.push(draft):state.documents[i]=draft;if(i<0&&draft.type==='factura')state.settings.next++;persist();closeModal();toast('Documento guardado')}function deleteDocument(){if(confirm('¿Eliminar este documento?')){state.documents=state.documents.filter(x=>x.id!==draft.id);persist();closeModal()}}function preview(did){draft=JSON.parse(JSON.stringify(state.documents.find(x=>x.id===did)));previewDraft()}
function previewDraft(){if(document.getElementById('dNumber'))capture();const c=state.clients.find(x=>x.id===draft.clientId)||{},t=totals(draft),s=state.settings,type=draft.type==='proforma'?'PROFORMA':draft.type==='rectificativa'?'FACTURA RECTIFICATIVA':'FACTURA';modal.innerHTML=`<div class="modal"><div class="sheet preview-sheet"><div class="sheet-head"><h3>Vista previa</h3><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><div class="sheet-body"><div class="invoice-stage"><article class="invoice-page"><div class="inv-top"><div class="inv-brand-row"><div><div class="inv-brand">PUNTO Y COMA</div><div class="inv-brand-sub">LEGAL</div></div><div class="inv-symbol">;</div></div><div class="inv-title"><h1>${type}</h1><div class="number">N.º ${esc(draft.number)}</div>${draft.type==='proforma'?'<div class="proforma-flag">SIN VALIDEZ FISCAL</div>':''}<div class="inv-meta"><span>Fecha de emisión:</span><b>${dateFmt(draft.date)}</b>${draft.due?`<span>Fecha de vencimiento:</span><b>${dateFmt(draft.due)}</b>`:''}${draft.payment?`<span>Forma de pago:</span><b>${esc(draft.payment)}</b>`:''}</div></div></div><hr class="inv-rule"><div class="inv-parties"><div><div class="inv-kicker">DE</div><div class="inv-party"><strong>${esc(s.name)}</strong><br>NIF: ${esc(s.tax)}<br>${esc(s.address)}<br>${s.phone?'Tel. '+esc(s.phone)+'<br>':''}${esc(s.email)}<br>${esc(s.web)}</div></div><div><div class="inv-kicker">PARA</div><div class="inv-party"><strong>${esc(c.name||'Cliente')}</strong><br>${c.tax?'NIF: '+esc(c.tax)+'<br>':''}${esc(c.address||'')}${c.address?'<br>':''}${c.email?esc(c.email):''}</div></div></div>${draft.type==='rectificativa'?'<div class="rect-box"><b>Documento rectificativo.</b><br>Indique en notas la factura original y el motivo de la rectificación.</div>':''}<table class="inv-table"><thead><tr><th>Concepto</th><th>Descripción</th><th class="num">Cant.</th><th class="num">Precio unit.</th><th class="num">Importe</th></tr></thead><tbody>${draft.lines.map(l=>`<tr><td class="inv-desc">${esc(l.desc)}</td><td>${esc(l.detail||'')}</td><td class="num">${l.qty}</td><td class="num">${money(l.price)}</td><td class="num">${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div class="inv-summary"><div class="inv-summary-row"><span>Base imponible</span><strong>${money(t.base)}</strong></div>${t.vat?`<div class="inv-summary-row"><span>IVA</span><strong>${money(t.vat)}</strong></div>`:''}${t.irpf?`<div class="inv-summary-row"><span>IRPF</span><strong>− ${money(t.irpf)}</strong></div>`:''}<div class="inv-summary-total"><span>TOTAL</span><span>${money(t.total)}</span></div></div>${draft.notes?`<div class="inv-note"><b>NOTA</b>${esc(draft.notes)}</div>`:''}<div class="inv-bottom"><div class="inv-bottom-symbol">;</div><div class="inv-bank"><b>DATOS BANCARIOS</b>IBAN: ${esc(s.iban)}<br>Titular: ${esc(s.name)}</div><div class="inv-sign"><div class="thanks">Gracias</div><strong>Julia Rico</strong><small>Abogada</small></div></div><div class="inv-footer">${esc((s.web||'PUNTOYCOMA.LEGAL').toUpperCase())}</div></article></div><div class="sheet-actions"><button class="btn primary" onclick="printInvoice()">Generar PDF / Imprimir</button><button class="btn" onclick="openDocument('${draft.type}','${draft.id}')">Editar</button></div></div></div></div>`;fitInvoice()}function fitInvoice(){setTimeout(()=>{const stage=document.querySelector('.invoice-stage'),page=document.querySelector('.invoice-page');if(!stage||!page)return;const available=stage.clientWidth-12,scale=Math.min(1,available/page.offsetWidth);page.style.transform=`scale(${scale})`;page.style.transformOrigin='top left';page.style.marginBottom=`${page.offsetHeight*(scale-1)}px`},30)}function printInvoice(){
  const source=document.querySelector('.invoice-page');
  if(!source)return;
  const page=source.cloneNode(true);
  page.removeAttribute('style');
  page.style.transform='none';
  page.style.margin='0';
  page.style.boxShadow='none';
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const popup=window.open('','_blank');
  if(!popup){alert('Safari ha bloqueado la ventana de impresión. Permite las ventanas emergentes y vuelve a intentarlo.');return;}
  popup.document.open();
  popup.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(draft.number||'Factura')}</title><style>${css}\n@page{size:A4 portrait;margin:0}html,body{margin:0!important;padding:0!important;width:210mm!important;background:#fff!important}.invoice-page{display:block!important;transform:none!important;box-shadow:none!important;margin:0!important;width:210mm!important;min-height:297mm!important;height:auto!important;padding:18mm 18mm 14mm!important}.app,.modal,.sheet-head,.sheet-actions{display:none!important}</style></head><body>${page.outerHTML}<script>window.addEventListener('load',function(){setTimeout(function(){window.print()},250)});<\/script></body></html>`);
  popup.document.close();
}function saveSettings(){state.settings={...state.settings,name:sName.value,tax:sTax.value,address:sAddress.value,email:sEmail.value,phone:sPhone.value,web:sWeb.value,prefix:sPrefix.value||'F-2026-',vat:+sVat.value,irpf:+sIrpf.value,iban:sIban.value};persist();toast('Configuración guardada')}function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}render();
</script></body></html>
