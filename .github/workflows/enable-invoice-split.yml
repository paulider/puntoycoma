name: Enable invoice split prompt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-invoice-split.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Include invoice split module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          multi = '<script src="multi-client.js"></script>'
          split = '<script src="invoice-split.js"></script>'
          if multi not in text:
              text = text.replace('</body>', multi + '</body>')
          if split not in text:
              text = text.replace('</body>', split + '</body>')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Prompt for invoice allocation on every new case invoice"
          git push origin main
          git push origin main:gh-pages --force
