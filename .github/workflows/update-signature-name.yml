name: Update invoice signature name

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-signature-name.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update signature display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "<strong>${esc(s.name)}</strong><small>Abogada</small>"
          new = "<strong>Julia Rico</strong><small>Abogada</small>"
          if old not in text:
              raise SystemExit('Signature target not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Use Julia Rico in invoice signature"
          git push origin main
          git push origin main:gh-pages --force
