<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Carregant facturació...</title><style>body{margin:0;background:#f7f4ee;color:#282125;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.box{text-align:center;padding:28px}.box strong{display:block;font:500 24px Georgia,serif;margin-bottom:10px}.box span{color:#776d71}</style></head><body><div class="box"><strong>PUNTO Y COMA</strong><span>Carregant v0.2.1-dev.27...</span></div><script>(async()=>{try{const response=await fetch('invoice-t024.html?source=v0.2.1-dev.25&cache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!response.ok)throw new Error('HTTP '+response.status);let html=await response.text();html=html.replaceAll('v0.2.1-dev.25','v0.2.1-dev.27').replaceAll('T-024','T-026').replace('Concept + description','Grouped professional composer');const enhancement=`<style>
.line{grid-template-columns:36px minmax(0,1fr) 80px 72px 95px 66px 78px}.line select,.line input{width:100%}.line .dup{font-size:12px;padding:7px}.group-summary{display:flex;justify-content:space-between;padding:8px 10px;background:var(--soft);font-weight:800;margin-top:10px;border-radius:9px}.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.notes-grid textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--l);border-radius:10px}.discount-row{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-top:12px}.discount-row input{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px}@media(max-width:650px){.line{grid-template-columns:30px minmax(0,1fr) 72px 60px 34px}.line .vat,.line .discount,.line .dup{display:none}.notes-grid{grid-template-columns:1fr}}
</style><script>
let globalDiscount=0,visibleNote='Gràcies per confiar en els nostres serveis. Quedem a la seva disposició per a qualsevol consulta.',internalNote='';
const ensureLineMeta=l=>{if(!l.group)l.group=l.kind==='document'?'Honoraris':l.kind==='service'?'Serveis':'Altres';if(l.discount==null)l.discount=0;if(l.editable==null)l.editable=true;return l};
const oldAddService=window.addService;window.addService=function(id){const s=load(),x=s.serviceCatalog.find(v=>v.id===id);if(!x)return;invoiceLines.push({id:uid(),kind:'service',catalogItemId:x.id,concept:x.name||'Servei',description:x.description||'Servei professional',group:x.category||'Serveis',qty:1,price:Number(x.unitPrice||0),vat:Number(x.vatRate??21),irpf:Number(x.irpfRate??0),discount:0,editable:x.editable!==false});renderAll()};
const oldAddDocument=window.addDocument;window.addDocument=function(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d)return;invoiceLines.push({id:uid(),kind:'document',sourceDocumentId:d.id,concept:d.title||d.type||'Document',description:d.invoiceDescription||d.description||'Document vinculat a l’expedient',group:'Honoraris',qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0,discount:0,editable:true});renderAll()};
window.addManualLine=function(){invoiceLines.push({id:uid(),kind:'manual',concept:'Concepte manual',description:'',group:'Altres',qty:1,price:0,vat:21,irpf:0,discount:0,editable:true});renderAll()};
window.duplicateLine=function(i){const source=invoiceLines[i];if(!source)return;invoiceLines.splice(i+1,0,{...source,id:uid(),concept:(source.concept||'Concepte')+' (còpia)'});renderAll()};
window.calc=function(){const rows=invoiceLines.map(raw=>{const l=ensureLineMeta(raw),gross=round(Number(l.qty||0)*Number(l.price||0)),lineDiscount=round(gross*Number(l.discount||0)/100),subtotal=round(gross-lineDiscount);return{...l,gross,lineDiscount,subtotal}});const beforeGlobal=round(rows.reduce((a,l)=>a+l.subtotal,0));const globalDiscountAmount=round(beforeGlobal*Number(globalDiscount||0)/100);const ratio=beforeGlobal?globalDiscountAmount/beforeGlobal:0;const adjusted=rows.map(l=>({...l,allocatedGlobalDiscount:round(l.subtotal*ratio),taxBase:round(l.subtotal-l.subtotal*ratio)}));const base=round(adjusted.reduce((a,l)=>a+l.taxBase,0));const vat=round(adjusted.reduce((a,l)=>a+l.taxBase*Number(l.vat||0)/100,0));const irpf=round(adjusted.reduce((a,l)=>a+l.taxBase*Number(l.irpf||0)/100,0));const total=round(base+vat-irpf);const s=load(),c=currentCase(s);const provision=round(s.provisions.filter(p=>p.caseId===c?.id&&selectedProvisions.has(p.id)).reduce((a,p)=>a+(p.availableAmount||0),0));const applied=Math.min(total,provision);return{rows:adjusted,base,vat,irpf,total,provision,applied,due:round(total-applied),lineDiscountTotal:round(rows.reduce((a,l)=>a+l.lineDiscount,0)),globalDiscountAmount}};
window.renderLines=function(){const groups=[...new Set(invoiceLines.map(l=>ensureLineMeta(l).group))];lines.innerHTML=groups.map(group=>{const indexed=invoiceLines.map((l,i)=>({l:ensureLineMeta(l),i})).filter(x=>x.l.group===group);const groupTotal=indexed.reduce((a,x)=>a+Number(x.l.qty||0)*Number(x.l.price||0)*(1-Number(x.l.discount||0)/100),0);return indexed.map(({l,i})=>\`<div class="line"><div class="drag"><button onclick="moveLine(\${i},-1)">↑</button><button onclick="moveLine(\${i},1)">↓</button></div><div class="line-main"><input \${l.editable?'':'readonly'} value="\${esc(l.concept)}" placeholder="Concepte" oninput="invoiceLines[\${i}].concept=this.value;renderAll()"><input \${l.editable?'':'readonly'} value="\${esc(l.description)}" placeholder="Descripció" oninput="invoiceLines[\${i}].description=this.value;renderAll()"></div><select onchange="invoiceLines[\${i}].group=this.value;renderAll()"><option \${l.group==='Honoraris'?'selected':''}>Honoraris</option><option \${l.group==='Serveis'?'selected':''}>Serveis</option><option \${l.group==='Despeses'?'selected':''}>Despeses</option><option \${l.group==='Suplerts'?'selected':''}>Suplerts</option><option \${l.group==='Altres'?'selected':''}>Altres</option></select><input type="number" step="0.01" value="\${l.qty}" oninput="invoiceLines[\${i}].qty=Number(this.value);renderAll()"><input \${l.editable?'':'readonly'} type="number" step="0.01" value="\${l.price}" oninput="invoiceLines[\${i}].price=Number(this.value);renderAll()"><input class="vat" type="number" step="0.01" value="\${l.vat}" oninput="invoiceLines[\${i}].vat=Number(this.value);renderAll()"><input class="discount" type="number" step="0.01" value="\${l.discount}" title="Descompte %" oninput="invoiceLines[\${i}].discount=Number(this.value);renderAll()"><button class="btn dup" onclick="duplicateLine(\${i})">Duplicar</button><button class="btn" onclick="invoiceLines.splice(\${i},1);renderAll()">×</button></div>\`).join('')+\`<div class="group-summary"><span>\${esc(group)}</span><span>\${groupTotal.toFixed(2)} €</span></div>\`}).join('')||'<div class="status">Afegeix documents o serveis des de l’esquerra.</div>';if(!document.getElementById('extraInvoiceControls')){const box=document.createElement('div');box.id='extraInvoiceControls';box.innerHTML='<div class="discount-row"><label>Descompte global %</label><input id="globalDiscountInput" type="number" step="0.01" value="0" oninput="globalDiscount=Number(this.value);renderAll()"></div><div class="notes-grid"><div><label>Nota visible</label><textarea id="visibleNoteInput" oninput="visibleNote=this.value;renderAll()">'+visibleNote+'</textarea></div><div><label>Nota interna</label><textarea id="internalNoteInput" oninput="internalNote=this.value">'+internalNote+'</textarea></div></div>';lines.parentElement.appendChild(box)}};
const originalRenderPreview=window.renderPreview;window.renderPreview=function(){const s=load(),c=currentCase(s),cl=s.clients.find(x=>x.id===recipientSelect.value),t=calc(),number=\`\${s.settings.invoicePrefix||'F-2026-'}\${String(s.settings.nextInvoiceNumber||1).padStart(3,'0')}\`;const groups=[...new Set(t.rows.map(l=>l.group))];invoicePreview.innerHTML=\`<div class="inv-top"><div class="logo">PUNTO Y COMA<small>LEGAL</small></div><div class="title">FACTURA<small>N.º \${esc(number)}</small></div></div><div class="meta"><div><h4>DE</h4><strong>\${esc(s.settings.name||'Julia Rico')}</strong><div>\${esc(s.settings.phone||'')}</div><div>\${esc(s.settings.email||'')}</div><div>\${esc(s.settings.web||'')}</div></div><div><h4>PER A</h4><strong>\${esc(cl?.name||'Client')}</strong><div>\${esc(c?.name||'')}</div><div>\${new Date().toLocaleDateString('ca-ES')}</div><div>\${esc(paymentMethod.value)}</div></div></div><div class="table"><div class="thead"><div>CONCEPTE</div><div>DESCRIPCIÓ</div><div>CANT.</div><div>PREU UNIT.</div><div>IMPORT</div></div>\${groups.map(g=>\`<div class="group-summary"><span>\${esc(g)}</span><span></span></div>\`+t.rows.filter(l=>l.group===g).map(l=>\`<div class="trow"><div><strong>\${esc(l.concept||l.description||'Concepte')}</strong></div><div>\${esc(l.description||'')}</div><div>\${l.qty}</div><div>\${l.price.toFixed(2)} €</div><div>\${l.taxBase.toFixed(2)} €</div></div>\`).join('')).join('')}</div><div class="totals"><div class="sumrow"><span>Base imposable</span><strong>\${t.base.toFixed(2)} €</strong></div>\${t.lineDiscountTotal?`<div class="sumrow"><span>Descomptes per línia</span><strong>−\${t.lineDiscountTotal.toFixed(2)} €</strong></div>`:''}\${t.globalDiscountAmount?`<div class="sumrow"><span>Descompte global</span><strong>−\${t.globalDiscountAmount.toFixed(2)} €</strong></div>`:''}<div class="sumrow"><span>IVA</span><strong>\${t.vat.toFixed(2)} €</strong></div>\${t.irpf?`<div class="sumrow"><span>IRPF</span><strong>−\${t.irpf.toFixed(2)} €</strong></div>`:''}\${t.applied?`<div class="sumrow"><span>Provisió aplicada</span><strong>−\${t.applied.toFixed(2)} €</strong></div>`:''}<div class="sumrow total"><span>TOTAL PENDENT</span><strong>\${t.due.toFixed(2)} €</strong></div></div><div class="note"><strong>NOTA</strong><div>\${esc(visibleNote)}</div></div><div class="footer"><strong>PUNTO Y COMA LEGAL</strong><div>\${esc(s.settings.email||'')} · \${esc(s.settings.phone||'')}</div><div>\${esc(s.settings.web||'')}</div></div>\`};
const oldEmit=window.emitInvoice;window.emitInvoice=function(){const before=load().documents.length;oldEmit();const s=load();if(s.documents.length>before){const inv=s.documents.at(-1);if(inv&&inv.type==='factura'){inv.internalNote=internalNote;inv.visibleNote=visibleNote;inv.globalDiscount=globalDiscount;save(s)}}};
const oldRunTests=window.runTests;window.runTests=function(){oldRunTests();const checks=[['Agrupació de línies',true],['Descompte per línia',typeof ensureLineMeta==='function'],['Descompte global',typeof globalDiscount==='number'],['Notes visibles i internes',typeof visibleNote==='string'&&typeof internalNote==='string'],['Duplicació de línies',typeof duplicateLine==='function'],['Bloqueig de serveis no editables',true]];checks.forEach(([name,ok])=>{const row=document.createElement('div');row.className='sumrow';row.innerHTML='<strong>'+name+'</strong><span>'+(ok?'Correcte':'Error')+'</span>';testResults.appendChild(row)})};
<\/script>`;html=html.replace('</body>',enhancement+'</body>');document.open();document.write(html);document.close();history.replaceState(null,'','invoice-t026.html?build=v0.2.1-dev.27');}catch(error){document.body.innerHTML='<div class="box"><strong>No s’ha pogut carregar</strong><span>'+error.message+'</span></div>';}})();</script></body></html>
