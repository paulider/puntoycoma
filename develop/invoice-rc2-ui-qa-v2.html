<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Invoice RC2 UI QA v2</title><style>:root{--b:#6b1730;--bg:#faf8f3;--line:#ded6d1;--ok:#2f6f4e;--err:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282125}.top{background:var(--b);color:#fff;padding:14px}.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{min-height:44px;border:0;border-radius:10px;background:#fff;padding:10px 14px;font-weight:700}.wrap{max-width:1050px;margin:auto;padding:14px}.banner,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}.banner{padding:14px;margin-bottom:12px;font-weight:700}.banner.ok{background:#e4f2ea;color:var(--ok)}.banner.err{background:#fff0f2;color:var(--err)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:12px}.stat small{display:block;color:#776d71}.stat strong{font-size:22px}.panel{overflow:hidden;margin-bottom:12px}.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.test{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid #eee7e2}.pass{color:var(--ok)}.fail{color:var(--err)}iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:14px;background:#fff}pre{white-space:pre-wrap;background:#f2ece7;padding:8px;border-radius:8px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}iframe{height:860px}}</style></head><body><header class="top"><div class="bar"><strong>PUNTO Y COMA · INVOICE RC2 UI QA v2</strong><button id="run" class="btn">Executar proves UI</button></div></header><main class="wrap"><div id="banner" class="banner">Preparat.</div><div class="stats"><div class="stat"><small>Total</small><strong id="total">0</strong></div><div class="stat"><small>Correctes</small><strong id="passed">0</strong></div><div class="stat"><small>Errors</small><strong id="failed">0</strong></div><div class="stat"><small>Temps</small><strong id="duration">0 ms</strong></div></div><div id="results"></div><section class="panel"><div class="head"><strong>Aplicació sota prova</strong><span>invoice-rc2.html</span></div><div style="padding:12px"><iframe id="app" src="about:blank"></iframe></div></section></main><script>(()=>{'use strict';const STATE='pyc_office_v2',DRAFT='pyc_invoice_rc2_draft';const frame=document.getElementById('app'),banner=document.getElementById('banner'),button=document.getElementById('run');const seed={settings:{name:'Julia María Rico López',tax:'74011732D',address:'c/ Camí Can Dori 32, 08811 Canyelles, Barcelona',email:'info@pyc.legal',iban:'ES73 1465 0120 37 1773656323',invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[{id:'c-a',name:'Anna Garcia',tax:'12345678A',address:'Carrer A 1, Barcelona',email:'anna@example.com'},{id:'c-b',name:'Marc Pérez',tax:'87654321B',address:'Carrer B 2, Barcelona',email:'marc@example.com'}],cases:[{id:'case-1',name:'Divorci Garcia - Pérez',code:'EXP-2026-001',clientId:'c-a',participants:['c-a','c-b'],status:'open'}],documents:[]};const tests=[];const add=(g,n,f)=>tests.push({g,n,f});const ok=(v,m='Condició falsa')=>{if(!v)throw new Error(m)};const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(`Esperat ${JSON.stringify(b)}, rebut ${JSON.stringify(a)}`)};const doc=()=>frame.contentDocument;const win=()=>frame.contentWindow;function waitForLoad(url){return new Promise((resolve,reject)=>{let done=false;const finish=(fn,value)=>{if(done)return;done=true;clearTimeout(timer);frame.onload=null;frame.onerror=null;fn(value)};const timer=setTimeout(()=>finish(reject,new Error('Timeout carregant '+url)),12000);frame.onload=()=>setTimeout(()=>finish(resolve),500);frame.onerror=()=>finish(reject,new Error('Error carregant '+url));frame.src=url})}function fireInput(el,value){el.focus();el.value='';el.dispatchEvent(new win().Event('input',{bubbles:true}));for(const char of String(value)){el.value+=char;el.dispatchEvent(new win().Event('input',{bubbles:true}));ok(doc().activeElement===el,'El focus s’ha perdut')}}function fireChange(el,value){el.value=value;el.dispatchEvent(new win().Event('change',{bubbles:true}))}function fireClick(el){el.dispatchEvent(new win().MouseEvent('click',{bubbles:true,cancelable:true}))}async function prepare(){localStorage.setItem(STATE,JSON.stringify(seed));localStorage.removeItem(DRAFT);await waitForLoad('invoice-rc2.html?uiqa='+Date.now());ok(doc()&&doc().querySelector('#case'),'L’editor no ha inicialitzat')}add('Càrrega','Editor RC2 inicialitzat',()=>ok(doc().querySelector('#saveBtn')));add('Càrrega','Expedient visible',()=>ok(doc().querySelector('#case').textContent.includes('Divorci Garcia - Pérez')));add('Càrrega','Emissor fiscal complet',()=>{const t=doc().querySelector('#issuer').textContent;ok(t.includes('Julia María Rico López'));ok(t.includes('74011732D'));ok(t.includes('ES73 1465'))});add('Participants','Dos pagadors visibles',()=>eq(doc().querySelectorAll('.payer').length,2));add('Mòbil','Preu 500 conserva focus',()=>{const el=doc().querySelector('[data-field="price"]');fireInput(el,'500');eq(el.value,'500')});add('Edició','Factura calcula 605 €',()=>{fireInput(doc().querySelector('[data-field="concept"]'),'Conveni regulador');fireInput(doc().querySelector('[data-field="qty"]'),'1');fireInput(doc().querySelector('[data-field="price"]'),'500');ok(doc().querySelector('#summary').textContent.includes('605.00 €'))});add('Repartiment','Reparto 60/40 válido',()=>{const rows=[...doc().querySelectorAll('.payer')];rows.forEach((row,index)=>{const cb=row.querySelector('[data-enabled]');if(!cb.checked)fireClick(cb);fireChange(row.querySelector('[data-mode]'),'percent');fireInput(row.querySelector('[data-value]'),index===0?'60':'40')});ok(doc().querySelector('#allocationStatus').textContent.includes('Correcte'))});add('Guardat','Factura guardada',()=>{fireClick(doc().querySelector('#saveBtn'));ok(doc().querySelector('#status').textContent.includes('Desada'));const state=JSON.parse(localStorage.getItem(STATE));eq(state.documents.length,1);eq(state.documents[0].total,605);eq(state.documents[0].allocations.map(x=>x.value),[60,40])});add('PDF','PDF individual coherent',()=>{const state=JSON.parse(localStorage.getItem(STATE));const html=win().PYCInvoiceRenderer.render(state.documents[0],{settings:state.settings,clients:state.clients,matter:state.cases[0]},'c-a');ok(html.includes('Julia María Rico López'));ok(html.includes('Anna Garcia'));ok(html.includes('363.00 €'))});async function run(){button.disabled=true;banner.className='banner';banner.textContent='Carregant editor i executant proves…';const start=performance.now(),results=[];try{await prepare();for(const t of tests){try{await t.f();results.push({...t,pass:true})}catch(error){results.push({...t,pass:false,error:error.message||String(error)})}}catch(error){results.push({g:'Càrrega',n:'Preparació de l’entorn',pass:false,error:error.message||String(error)})}const ms=Math.round(performance.now()-start),passed=results.filter(r=>r.pass).length,failed=results.length-passed;document.getElementById('total').textContent=results.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('duration').textContent=ms+' ms';banner.className='banner '+(failed?'err':'ok');banner.textContent=failed?`${passed}/${results.length} correctes · RC2 BLOQUEJADA`:`${passed}/${results.length} correctes · RC2 UI READY`;const grouped={};for(const result of results){if(!grouped[result.g])grouped[result.g]=[];grouped[result.g].push(result)}document.getElementById('results').innerHTML=Object.entries(grouped).map(([group,items])=>`<section class="panel"><div class="head"><strong>${group}</strong><span>${items.filter(x=>x.pass).length}/${items.length}</span></div>${items.map(item=>`<div class="test"><span class="${item.pass?'pass':'fail'}">${item.pass?'✓':'✕'}</span><div><strong>${item.n}</strong>${item.error?`<pre>${item.error}</pre>`:''}</div><small>${item.pass?'PASS':'FAIL'}</small></div>`).join('')}</section>`).join('');button.disabled=false}button.addEventListener('click',run);window.addEventListener('error',event=>{banner.className='banner err';banner.textContent='Error JavaScript: '+event.message});run()})();</script></body></html>
