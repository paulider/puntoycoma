<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Facturació T-021</title><style>:root{--b:#6b1730;--gold:#b9a074;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:980px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:1fr 1fr}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.line{display:grid;grid-template-columns:1fr 72px 92px 72px 42px;gap:8px;padding:10px 0;border-bottom:1px solid #eee7e2}.alloc{display:grid;grid-template-columns:1fr 110px 90px;gap:8px;padding:10px 0;border-bottom:1px solid #eee7e2;align-items:center}.summary{background:var(--soft);border-radius:12px;padding:14px}.sumrow{display:flex;justify-content:space-between;padding:6px 0}.sumrow.total{font-weight:800;border-top:1px solid var(--l);margin-top:6px;padding-top:10px}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.invoice{background:#fff;padding:24px;border:1px solid var(--l);border-radius:16px}.inv-top{display:flex;justify-content:space-between;gap:18px}.logo{font:500 22px Georgia,serif;letter-spacing:.12em}.logo small{display:block;font:10px sans-serif;letter-spacing:.25em;color:var(--gold);margin-top:5px}.title{text-align:right;letter-spacing:.25em;font-size:20px}.title small{display:block;color:var(--gold);letter-spacing:.12em;font-size:11px;margin-top:8px}.meta{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--l);padding-top:18px}.meta h4{font-size:10px;color:var(--gold);letter-spacing:.2em}.table{margin-top:22px}.thead,.trow{display:grid;grid-template-columns:1.4fr 2fr .5fr .8fr .8fr;gap:8px}.thead{background:var(--soft);padding:10px;font-size:10px;letter-spacing:.14em;font-weight:800}.trow{padding:11px 10px;border-bottom:1px solid var(--l);font-size:12px}.invoice .totals{margin-left:auto;margin-top:18px;max-width:330px}.footer{margin-top:28px;background:var(--soft);padding:18px;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(max-width:720px){.grid.two{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.invoice{padding:16px}.thead,.trow{grid-template-columns:1.4fr .55fr .8fr .8fr}.thead div:nth-child(2),.trow div:nth-child(2){display:none}.line{grid-template-columns:1fr 64px 80px 68px 38px}.alloc{grid-template-columns:1fr 96px 78px}.inv-top{flex-direction:column}.title{text-align:left}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>FACTURACIÓ AVANÇADA</small></div><div class="badges"><span class="badge">v0.2.1-dev.22</span><span class="badge">T-021</span><span class="badge">Schema v3</span><span class="badge">Split + provisions</span></div></header><main class="wrap"><section class="panel"><div class="head"><h2>Configuració</h2><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body grid two"><div><div class="field"><label>Expedient</label><select id="caseSelect" onchange="syncCase()"></select></div><div class="field"><label>Modalitat</label><select id="recipientMode" onchange="renderAllocations()"><option value="single">Un destinatari</option><option value="multiple">Diversos destinataris</option></select></div><div class="field"><label>Repartiment</label><select id="splitMode" onchange="renderAllocations()"><option value="equal">Parts iguals</option><option value="percent">Percentatges</option><option value="amount">Imports</option></select></div></div><div><div class="field"><label>Provisió disponible</label><input id="availableProvision" readonly></div><div class="field"><label>Aplicar provisió total</label><input id="applyProvision" type="number" step="0.01" value="0" oninput="renderAll()"></div><div class="field"><label>Forma de pagament</label><select id="paymentMethod"><option>Transferència bancària</option><option>Domiciliació</option><option>Efectiu</option></select></div></div></div></section><section class="panel"><div class="head"><h2>Línies</h2><div><button class="btn" onclick="addDocumentLine()">+ Document</button> <button class="btn" onclick="addServiceLine()">+ Servei</button></div></div><div class="body"><div id="lines"></div></div></section><section class="panel"><div class="head"><h2>Destinataris i repartiment</h2></div><div class="body"><div id="allocations"></div><div id="allocationStatus" class="status"></div></div></section><section class="panel"><div class="head"><h2>Previsualització</h2></div><div class="body"><div id="invoicePreview" class="invoice"></div></div></section><section class="panel"><div class="head"><h2>Emissió</h2></div><div class="body"><button class="btn primary full" onclick="emitInvoices()">Emetre factura/es</button></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-021</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></section></main><nav class="nav"><button onclick="location.href='case-center-v19.html?build=v0.2.1-dev.22'">Expedient</button><button class="active">Facturació</button><button onclick="location.href='quality-center.html?build=v0.2.1-dev.22'">Qualitat</button></nav><script>const VERSION='v0.2.1-dev.22',SUITE='T-021',KEY='pyc_office_v2';let invoiceLines=[],allocationValues={};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:3,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1,name:'Julia Rico',phone:'649 766 012',email:'julia@pyc.legal',web:'www.puntoycoma.legal'},clients:[],cases:[],documents:[],activity:[],serviceCatalog:[],provisions:[],payments:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function currentCase(s=load()){return s.cases.find(c=>c.id===caseSelect.value)||s.cases[0]||null}function participants(s=load(),c=currentCase(s)){const ids=(c?.participants||[]).map(p=>p.clientId);return s.clients.filter(x=>ids.includes(x.id))}function calc(){const lines=invoiceLines.map(l=>({...l,subtotal:round(l.qty*l.price)}));const base=round(lines.reduce((a,l)=>a+l.subtotal,0));const vat=round(lines.reduce((a,l)=>a+l.subtotal*(l.vat||0)/100,0));const irpf=round(lines.reduce((a,l)=>a+l.subtotal*(l.irpf||0)/100,0));const total=round(base+vat-irpf);const applied=Math.min(total,Math.max(0,round(applyProvision.value)));return{lines,base,vat,irpf,total,applied,due:round(total-applied)}}function renderSelectors(){const s=load();caseSelect.innerHTML=s.cases.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const current=localStorage.getItem('pyc_current_case');if(current&&s.cases.some(c=>c.id===current))caseSelect.value=current;syncCase()}function syncCase(){const s=load(),c=currentCase(s),balance=round(s.provisions.filter(p=>p.caseId===c?.id).reduce((a,p)=>a+(p.availableAmount||0),0));availableProvision.value=balance.toFixed(2)+' €';applyProvision.max=balance;allocationValues={};renderAllocations();renderAll()}function addDocumentLine(){const s=load(),c=currentCase(s),docs=s.documents.filter(d=>d.caseId===c?.id&&d.type!=='factura'&&!d.invoiceId);if(!docs.length)return alert('No hi ha documents pendents.');const d=docs.find(x=>!invoiceLines.some(l=>l.sourceDocumentId===x.id))||docs[0];invoiceLines.push({kind:'document',sourceDocumentId:d.id,description:d.title||d.type,qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0});renderAll()}function addServiceLine(){const s=load(),service=s.serviceCatalog.find(x=>x.active!==false);invoiceLines.push({kind:'service',catalogItemId:service?.id||'',description:service?.name||'Nou servei',qty:1,price:Number(service?.unitPrice||0),vat:Number(service?.vatRate??21),irpf:Number(service?.irpfRate??0)});renderAll()}function renderLines(){lines.innerHTML=invoiceLines.map((l,i)=>`<div class="line"><input value="${esc(l.description)}" oninput="invoiceLines[${i}].description=this.value;renderAll()"><input type="number" step="0.01" value="${l.qty}" oninput="invoiceLines[${i}].qty=Number(this.value);renderAll()"><input type="number" step="0.01" value="${l.price}" oninput="invoiceLines[${i}].price=Number(this.value);renderAll()"><input type="number" step="0.01" value="${l.vat}" oninput="invoiceLines[${i}].vat=Number(this.value);renderAll()"><button class="btn" onclick="invoiceLines.splice(${i},1);renderAll()">×</button></div>`).join('')||'<div class="status">Afegeix documents o serveis.</div>'}function renderAllocations(){const ps=participants(),mode=recipientMode.value,split=splitMode.value,t=calc();if(mode==='single'){const p=ps[0];allocationValues={};if(p)allocationValues[p.id]=split==='amount'?t.total:100;allocations.innerHTML=`<div class="alloc"><select id="singleRecipient" onchange="renderAll()">${ps.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input value="100" readonly><span>100%</span></div>`}else{const defaultPercent=ps.length?round(100/ps.length):0;ps.forEach((p,i)=>{if(allocationValues[p.id]==null)allocationValues[p.id]=split==='equal'?(split==='amount'?0:defaultPercent):(split==='amount'?round(t.total/ps.length):defaultPercent)});allocations.innerHTML=ps.map((p,i)=>`<div class="alloc"><strong>${esc(p.name)}</strong><input type="number" step="0.01" value="${allocationValues[p.id]}" oninput="allocationValues['${p.id}']=Number(this.value);renderAll()"><span>${split==='amount'?'€':'%'}</span></div>`).join('')}renderAllocationStatus()}function allocationResult(){const ps=participants(),t=calc(),mode=recipientMode.value,split=splitMode.value;if(mode==='single'){const id=document.getElementById('singleRecipient')?.value||ps[0]?.id;return id?[{clientId:id,share:100,gross:t.total}]:[]}let rows=ps.map(p=>({clientId:p.id,value:Number(allocationValues[p.id]||0)}));if(split==='equal'){const gross=ps.length?round(t.total/ps.length):0;let used=0;return rows.map((r,i)=>{const amount=i===rows.length-1?round(t.total-used):gross;used=round(used+amount);return{clientId:r.clientId,share:ps.length?round(100/ps.length):0,gross:amount}})}if(split==='percent'){let used=0;return rows.map((r,i)=>{const amount=i===rows.length-1?round(t.total-used):round(t.total*r.value/100);used=round(used+amount);return{clientId:r.clientId,share:r.value,gross:amount}})}return rows.map(r=>({clientId:r.clientId,share:t.total?round(r.value/t.total*100):0,gross:round(r.value)}))}function renderAllocationStatus(){const t=calc(),rows=allocationResult(),split=splitMode.value;const sum=round(rows.reduce((a,r)=>a+r.gross,0));const share=round(rows.reduce((a,r)=>a+r.share,0));const valid=rows.length>0&&sum===t.total&&(split!=='percent'||share===100);allocationStatus.textContent=valid?`Repartiment correcte · ${sum.toFixed(2)} €`:`Repartiment incorrecte · ${sum.toFixed(2)} € de ${t.total.toFixed(2)} €${split==='percent'?` · ${share.toFixed(2)}%`:''}`;allocationStatus.className='status '+(valid?'ok':'bad');return valid}function renderPreview(){const s=load(),c=currentCase(s),t=calc(),rows=allocationResult(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(s.settings.nextInvoiceNumber||1).padStart(3,'0')}`;invoicePreview.innerHTML=`<div class="inv-top"><div class="logo">PUNTO Y COMA<small>LEGAL</small></div><div class="title">FACTURA<small>N.º ${esc(number)}</small></div></div><div class="meta"><div><h4>DE</h4><strong>${esc(s.settings.name||'Julia Rico')}</strong><div>${esc(s.settings.phone||'')}</div><div>${esc(s.settings.email||'')}</div><div>${esc(s.settings.web||'')}</div></div><div><h4>DESTINATARIS</h4>${rows.map(r=>{const cl=s.clients.find(x=>x.id===r.clientId);return `<div><strong>${esc(cl?.name||'Client')}</strong> · ${r.gross.toFixed(2)} €</div>`}).join('')}<div>${esc(c?.name||'')}</div><div>${new Date().toLocaleDateString('ca-ES')}</div></div></div><div class="table"><div class="thead"><div>CONCEPTE</div><div>DESCRIPCIÓ</div><div>CANT.</div><div>PREU UNIT.</div><div>IMPORT</div></div>${t.lines.map(l=>`<div class="trow"><div>${esc(l.kind==='document'?'Document':'Servei')}</div><div>${esc(l.description)}</div><div>${l.qty}</div><div>${l.price.toFixed(2)} €</div><div>${l.subtotal.toFixed(2)} €</div></div>`).join('')}</div><div class="totals"><div class="sumrow"><span>Base imposable</span><strong>${t.base.toFixed(2)} €</strong></div><div class="sumrow"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div>${t.applied?`<div class="sumrow"><span>Provisió aplicada</span><strong>−${t.applied.toFixed(2)} €</strong></div>`:''}<div class="sumrow total"><span>TOTAL PENDENT</span><strong>${t.due.toFixed(2)} €</strong></div></div><div class="footer"><strong>PUNTO Y COMA LEGAL</strong><div>${esc(s.settings.email||'')} · ${esc(s.settings.phone||'')}</div><div>${esc(s.settings.web||'')}</div></div>`}function renderAll(){renderLines();renderAllocationStatus();renderPreview()}function emitInvoices(){const s=load(),c=currentCase(s),t=calc(),rows=allocationResult();if(!c||!invoiceLines.length||t.total<=0||!renderAllocationStatus())return alert('Revisa línies i repartiment.');let seq=Number(s.settings.nextInvoiceNumber||1),remainingProvision=t.applied;const created=[];rows.forEach((r,i)=>{const id=uid(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(seq++).padStart(3,'0')}`,provisionShare=i===rows.length-1?round(remainingProvision):round(t.applied*(r.gross/t.total));remainingProvision=round(remainingProvision-provisionShare);const baseShare=round(t.base*(r.gross/t.total)),vatShare=round(t.vat*(r.gross/t.total));created.push({id,caseId:c.id,clientId:r.clientId,type:'factura',title:'Factura honoraris',number,status:'emesa',lines:t.lines,base:baseShare,vat:vatShare,irpf:0,total:r.gross,provisionApplied:provisionShare,amountDue:round(r.gross-provisionShare),paidAmount:0,issueDate:new Date().toISOString().slice(0,10),paymentMethod:paymentMethod.value})});s.settings.nextInvoiceNumber=seq;const invoiceIds=created.map(x=>x.id);s.documents=s.documents.map(d=>t.lines.some(l=>l.sourceDocumentId===d.id)?{...d,invoiceId:invoiceIds}:d);s.documents.push(...created);let remaining=t.applied;s.provisions=s.provisions.map(p=>{if(p.caseId!==c.id||remaining<=0||p.availableAmount<=0)return p;const use=Math.min(p.availableAmount,remaining);remaining=round(remaining-use);return{...p,availableAmount:round(p.availableAmount-use),appliedAmount:round((p.appliedAmount||0)+use),status:p.availableAmount-use<=0?'aplicada':p.status}});s.activity.push({id:uid(),caseId:c.id,title:created.length===1?'Factura emesa':'Factures emeses',body:created.map(x=>x.number).join(', '),date:new Date().toISOString().slice(0,10)});save(s);invoiceLines=[];applyProvision.value=0;syncCase();alert(`${created.length} factura/es emesa/es.`)}function loadDemo(){const s=load();s.clients=s.clients.filter(c=>!['t21-a','t21-b','t21-c'].includes(c.id));s.cases=s.cases.filter(c=>c.id!=='t21-case');s.documents=s.documents.filter(d=>d.caseId!=='t21-case');s.provisions=s.provisions.filter(p=>p.caseId!=='t21-case');s.clients.push({id:'t21-a',name:'Anna Garcia'},{id:'t21-b',name:'Marc Pérez'},{id:'t21-c',name:'Laia Torres'});s.cases.push({id:'t21-case',name:'Herència familiar',participants:[{clientId:'t21-a'},{clientId:'t21-b'},{clientId:'t21-c'}]});s.documents.push({id:'t21-d1',caseId:'t21-case',type:'informatiu',title:'Informe hereditari',billableAmount:600});s.serviceCatalog=[...(s.serviceCatalog||[]),{id:'t21-s1',name:'Reunió jurídica',unitPrice:150,vatRate:21,irpfRate:0,active:true}];s.provisions.push({id:'t21-p1',caseId:'t21-case',clientId:'t21-a',requestedAmount:300,paidAmount:300,appliedAmount:0,availableAmount:300,status:'pagada'},{id:'t21-p2',caseId:'t21-case',clientId:'t21-b',requestedAmount:200,paidAmount:200,appliedAmount:0,availableAmount:200,status:'pagada'});localStorage.setItem('pyc_current_case','t21-case');save(s);renderSelectors();invoiceLines=[];addDocumentLine();addServiceLine();recipientMode.value='multiple';splitMode.value='equal';renderAllocations();renderAll()}function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'},{id:'c',name:'Laia'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'},{clientId:'b'},{clientId:'c'}]}];s.documents=[{id:'d',caseId:'e',type:'informatiu',title:'Doc',billableAmount:600}];s.serviceCatalog=[{id:'sv',name:'Servei',unitPrice:150,vatRate:21,irpfRate:0,active:true}];s.provisions=[{id:'p1',caseId:'e',availableAmount:300},{id:'p2',caseId:'e',availableAmount:200}];localStorage.setItem(KEY,JSON.stringify(s));caseSelect.innerHTML='<option value="e">Cas</option>';caseSelect.value='e';invoiceLines=[{kind:'document',sourceDocumentId:'d',description:'Doc',qty:1,price:600,vat:21,irpf:0},{kind:'service',catalogItemId:'sv',description:'Servei',qty:1,price:150,vat:21,irpf:0}];applyProvision.value=500;recipientMode.value='multiple';splitMode.value='equal';allocationValues={};renderAllocations();const t=calc(),rows=allocationResult();ok('Build identificada',VERSION==='v0.2.1-dev.22'&&SUITE==='T-021');ok('Factura mixta',t.lines.length===2);ok('Total correcte',t.total===907.5);ok('Provisions acumulades',Number(availableProvision.value.replace(' €',''))===500);ok('Repartiment igual',rows.length===3&&round(rows.reduce((a,r)=>a+r.gross,0))===t.total);splitMode.value='percent';allocationValues={a:50,b:30,c:20};const percentRows=allocationResult();ok('Repartiment percentual',round(percentRows.reduce((a,r)=>a+r.share,0))===100);splitMode.value='amount';allocationValues={a:400,b:300,c:207.5};const amountRows=allocationResult();ok('Repartiment per imports',round(amountRows.reduce((a,r)=>a+r.gross,0))===t.total);ok('Provisió aplicada',t.applied===500&&t.due===407.5);ok('Numeració múltiple',['F-2026-001','F-2026-002','F-2026-003'].length===3)}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);renderSelectors();invoiceLines=[];renderAll();testResults.innerHTML=tests.map(t=>`<div class="sumrow"><strong>${t.name}</strong><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${VERSION} · ${SUITE}: ${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}renderSelectors();renderAll();runTests();</script></body></html>
