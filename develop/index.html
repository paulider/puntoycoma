<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma Office · Develop</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--s:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:74px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:780px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.danger{color:var(--bad)}.search{width:100%;padding:12px 14px;border:1px solid var(--l);border-radius:12px;background:#fff}.row{padding:13px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong,.test strong{display:block}.row small,.test small{display:block;color:var(--m);margin-top:3px}.empty{padding:26px;text-align:center;color:var(--m)}.status{padding:12px;border-radius:12px;background:var(--s);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.modal{position:fixed;inset:0;background:rgba(25,14,19,.55);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--p);border-radius:22px 22px 0 0}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(250,248,243,.96);z-index:2}.sheet-head h3{margin:0;font:500 22px Georgia,serif}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:80px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.participant{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-bottom:8px}.participant .btn{padding:10px}.test{padding:10px 0;border-bottom:1px solid #eee7e2}.test:last-child{border-bottom:0}.test span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--m)}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 4px;font-size:12px}.nav button.active{color:var(--b);font-weight:800}@media(min-width:760px){.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:700px;border-radius:22px}.nav{left:50%;transform:translateX(-50%);max-width:680px;border:1px solid var(--l);border-radius:16px 16px 0 0}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>DEVELOP PREVIEW</small></div><div class="badges"><span class="badge">v0.2.1-dev.8</span><span class="badge">T-008</span><span class="badge">Schema v2</span><span class="badge">Clients + Expedients</span></div></header><main class="wrap"><section id="clientsView" class="view active"><div class="panel"><div class="head"><h2>Clients</h2><button class="btn primary" onclick="openClientForm()">Nou client</button></div><div class="body"><input id="clientSearch" class="search" placeholder="Cercar client" oninput="renderClients()"><div id="clientList"></div></div></div></section><section id="casesView" class="view"><div class="panel"><div class="head"><h2>Expedients</h2><button class="btn primary" onclick="openCaseForm()">Nou expedient</button></div><div class="body"><input id="caseSearch" class="search" placeholder="Cercar expedient o participant" oninput="renderCases()"><div id="caseList"></div></div></div></section><section id="testsView" class="view"><div class="panel"><div class="head"><h2>Diagnòstic · T-008</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></div></section></main><nav class="nav"><button id="navClients" class="active" onclick="showView('clients')">Clients</button><button id="navCases" onclick="showView('cases')">Expedients</button><button id="navTests" onclick="showView('tests')">Tests</button></nav><div id="modal"></div><script>
const VERSION='v0.2.1-dev.8',SUITE='T-008',KEY='pyc_office_v2';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emptyState(){return{version:2,settings:{},clients:[],cases:[],documents:[],activity:[]}}
function migrate(raw){const s={...emptyState(),...(raw||{})};s.clients=Array.isArray(s.clients)?s.clients:[];s.cases=(s.cases||[]).map(c=>({...c,participants:Array.isArray(c.participants)?c.participants:(c.clientId?[{clientId:c.clientId,role:'principal',isPrimary:true}]:[])}));s.documents=Array.isArray(s.documents)?s.documents:[];return s}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{return emptyState()}}
function save(s){localStorage.setItem(KEY,JSON.stringify(migrate(s)));renderAll()}
function showView(name){['clients','cases','tests'].forEach(v=>{document.getElementById(v+'View').classList.toggle('active',v===name);document.getElementById('nav'+v[0].toUpperCase()+v.slice(1)).classList.toggle('active',v===name)})}
function findClient(id){return load().clients.find(c=>c.id===id)||null}function findCase(id){return load().cases.find(c=>c.id===id)||null}
function renderClients(){const q=(document.getElementById('clientSearch')?.value||'').toLowerCase(),s=load();const list=[...s.clients].sort((a,b)=>a.name.localeCompare(b.name,'ca')).filter(c=>!q||[c.name,c.tax,c.email,c.phone].join(' ').toLowerCase().includes(q));document.getElementById('clientList').innerHTML=list.length?list.map(c=>`<div class="row" onclick="openClientForm('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.tax||'Sense NIF')} · ${esc(c.email||'Sense email')}</small></div><span>›</span></div>`).join(''):'<div class="empty">Encara no hi ha clients.</div>'}
function participantNames(c,s){return(c.participants||[]).map(p=>s.clients.find(x=>x.id===p.clientId)?.name||'Client desconegut').join(', ')}
function renderCases(){const q=(document.getElementById('caseSearch')?.value||'').toLowerCase(),s=load();const list=[...s.cases].filter(c=>!q||[c.name,c.code,c.type,c.status,participantNames(c,s)].join(' ').toLowerCase().includes(q));document.getElementById('caseList').innerHTML=list.length?list.map(c=>`<div class="row" onclick="openCaseForm('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.code||'Sense codi')} · ${esc(participantNames(c,s))}</small></div><span>›</span></div>`).join(''):'<div class="empty">Encara no hi ha expedients.</div>'}
function renderAll(){renderClients();renderCases()}
function closeModal(){document.getElementById('modal').innerHTML=''}
function openClientForm(id=''){const c=id?findClient(id):{name:'',tax:'',email:'',phone:'',address:'',notes:''};document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${id?'Editar':'Nou'} client</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Nom</label><input id="fName" value="${esc(c.name)}"></div><div class="field"><label>NIF / NIE</label><input id="fTax" value="${esc(c.tax)}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(c.email)}"></div><div class="field"><label>Telèfon</label><input id="fPhone" value="${esc(c.phone)}"></div><div class="field"><label>Adreça</label><input id="fAddress" value="${esc(c.address)}"></div><div class="field"><label>Notes</label><textarea id="fNotes">${esc(c.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveClient('${id}')">Desar</button>${id?`<button class="btn danger" onclick="deleteClient('${id}')">Eliminar</button>`:'<button class="btn" onclick="closeModal()">Cancel·lar</button>'}</div></div></div></div>`}
function saveClient(id){const name=document.getElementById('fName').value.trim();if(!name)return alert('El nom és obligatori.');const s=load(),data={id:id||uid(),name,tax:fTax.value.trim(),email:fEmail.value.trim(),phone:fPhone.value.trim(),address:fAddress.value.trim(),notes:fNotes.value.trim()};const i=s.clients.findIndex(c=>c.id===id);if(i>=0)s.clients[i]={...s.clients[i],...data};else s.clients.push(data);save(s);closeModal()}
function deleteClient(id){const s=load();if(s.cases.some(c=>(c.participants||[]).some(p=>p.clientId===id)))return alert('No es pot eliminar: té expedients vinculats.');if(!confirm('Eliminar client?'))return;s.clients=s.clients.filter(c=>c.id!==id);save(s);closeModal()}
function participantRow(p={clientId:'',role:'principal'}){const s=load();return `<div class="participant"><select class="pClient">${s.clients.map(c=>`<option value="${c.id}" ${c.id===p.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="pRole" value="${esc(p.role||'principal')}" placeholder="Rol"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`}
function addParticipant(p){document.getElementById('participants').insertAdjacentHTML('beforeend',participantRow(p))}
function openCaseForm(id=''){const s=load();if(!s.clients.length)return alert('Primer has de crear almenys un client.');const c=id?findCase(id):{name:'',code:'',type:'divorci',status:'obert',participants:[{clientId:s.clients[0].id,role:'principal'}],notes:''};document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${id?'Editar':'Nou'} expedient</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Nom</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>Codi</label><input id="cCode" value="${esc(c.code||'')}"></div><div class="field"><label>Tipus</label><select id="cType"><option value="divorci">Divorci</option><option value="herencia">Herència</option><option value="compravenda">Compravenda</option><option value="altres">Altres</option></select></div><div class="field"><label>Estat</label><select id="cStatus"><option value="obert">Obert</option><option value="en espera">En espera</option><option value="tancat">Tancat</option></select></div><div class="field"><label>Participants</label><div id="participants">${(c.participants||[]).map(participantRow).join('')}</div><button class="btn" onclick="addParticipant()">Afegir participant</button></div><div class="field"><label>Notes</label><textarea id="cNotes">${esc(c.notes||'')}</textarea></div><div class="actions"><button class="btn primary" onclick="saveCase('${id}')">Desar</button>${id?`<button class="btn danger" onclick="deleteCase('${id}')">Eliminar</button>`:'<button class="btn" onclick="closeModal()">Cancel·lar</button>'}</div></div></div></div>`;cType.value=c.type||'altres';cStatus.value=c.status||'obert'}
function saveCase(id){const name=cName.value.trim();if(!name)return alert('El nom és obligatori.');const participants=[...document.querySelectorAll('.participant')].map((row,i)=>({clientId:row.querySelector('.pClient').value,role:row.querySelector('.pRole').value.trim()||'principal',isPrimary:i===0}));if(!participants.length)return alert('Cal almenys un participant.');if(new Set(participants.map(p=>p.clientId)).size!==participants.length)return alert('No es pot repetir un participant.');const s=load(),data={id:id||uid(),name,code:cCode.value.trim(),type:cType.value,status:cStatus.value,participants,notes:cNotes.value.trim()};const i=s.cases.findIndex(c=>c.id===id);if(i>=0)s.cases[i]={...s.cases[i],...data};else s.cases.push(data);save(s);closeModal()}
function deleteCase(id){const s=load();if(s.documents.some(d=>d.caseId===id))return alert('No es pot eliminar: té documents vinculats.');if(!confirm('Eliminar expedient?'))return;s.cases=s.cases.filter(c=>c.id!==id);save(s);closeModal()}
function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(name,cond)=>tests.push({name,ok:Boolean(cond)});try{ok('Build identificada',VERSION==='v0.2.1-dev.8'&&SUITE==='T-008');let s=emptyState();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'},{id:'c',name:'Laia'}];s.cases=[{id:'e',name:'Divorci prova',participants:[{clientId:'a',role:'conyuge_1'},{clientId:'b',role:'conyuge_2'}]}];localStorage.setItem(KEY,JSON.stringify(s));let x=load();ok('Crear expedient',x.cases.length===1);ok('Dos participants',x.cases[0].participants.length===2);x.cases[0].participants.push({clientId:'c',role:'representant'});localStorage.setItem(KEY,JSON.stringify(x));x=load();ok('Afegir tercer participant',x.cases[0].participants.length===3);x.cases[0].name='Expedient editat';localStorage.setItem(KEY,JSON.stringify(x));ok('Editar expedient',load().cases[0].name==='Expedient editat');ok('Relacions correctes',['a','b','c'].every(id=>load().cases.some(c=>c.participants.some(p=>p.clientId===id))));x=load();x.cases=[];localStorage.setItem(KEY,JSON.stringify(x));ok('Eliminar expedient',load().cases.length===0)}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);renderAll();testResults.innerHTML=tests.map(t=>`<div class="test"><span>${t.ok?'Correcte':'Error'}</span><strong>${esc(t.name)}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div>`).join('');const failed=tests.filter(t=>!t.ok).length;testStatus.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les proves han passat.`;testStatus.className='status '+(failed?'bad':'ok')}
renderAll();runTests();
</script></body></html>
