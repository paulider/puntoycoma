<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma Office · Develop</title><style>:root{--brand:#6b1730;--paper:#faf8f3;--ink:#282125;--muted:#776d71;--line:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.top{background:var(--brand);color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.build{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}.badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,40,.04);margin-bottom:14px}.head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:700}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:var(--bad)}.btn.full{width:100%}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.row{padding:13px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.empty{padding:26px;text-align:center;color:var(--muted)}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.modal{position:fixed;inset:0;background:rgba(25,14,19,.55);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(250,248,243,.96)}.sheet-head h3{margin:0;font:500 22px Georgia,serif}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:80px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none}.test-row{padding:10px 0;border-bottom:1px solid #eee7e2}.test-row:last-child{border-bottom:0}.test-row span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}@media(min-width:760px){.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:640px;border-radius:22px}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>DEVELOP PREVIEW</small></div><div class="build"><span class="badge">v0.2.1-dev.5</span><span class="badge">T-005</span><span class="badge">Schema v2</span><span class="badge">Build clients-ui</span></div></header><main class="wrap"><div class="panel"><div class="head"><h2>Clients</h2><button class="btn primary" onclick="openClientForm()">Nou client</button></div><div class="body"><input id="search" class="search" placeholder="Cercar per nom, NIF, email o telèfon" oninput="renderClients()"><div id="clientList"></div></div></div><div class="panel"><div class="head"><h2>Diagnòstic · T-005</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></div></main><div id="modal"></div><script>
const VERSION='v0.2.1-dev.5',TEST_SUITE='T-005',KEY='pyc_office_v2';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emptyState(){return{version:2,settings:{},clients:[],cases:[],documents:[],activity:[]}}
function migrate(raw){const s={...emptyState(),...(raw||{})};s.clients=Array.isArray(s.clients)?s.clients:[];s.cases=(s.cases||[]).map(c=>({...c,participants:Array.isArray(c.participants)?c.participants:(c.clientId?[{clientId:c.clientId,role:'principal',isPrimary:true}]:[])}));s.documents=Array.isArray(s.documents)?s.documents:[];return s}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return emptyState()}}
function save(state){localStorage.setItem(KEY,JSON.stringify(migrate(state)));renderClients()}
function findClient(id){return load().clients.find(c=>c.id===id)||null}
function searchClients(query){const q=String(query||'').trim().toLowerCase();return [...load().clients].sort((a,b)=>a.name.localeCompare(b.name,'ca')).filter(c=>!q||[c.name,c.tax,c.email,c.phone,c.address].join(' ').toLowerCase().includes(q))}
function renderClients(){const list=searchClients(document.getElementById('search').value);document.getElementById('clientList').innerHTML=list.length?list.map(c=>`<div class="row" onclick="openClientForm('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.tax||'Sense NIF')} · ${esc(c.email||'Sense email')}</small></div><span>›</span></div>`).join(''):'<div class="empty">Encara no hi ha clients.</div>'}
function openClientForm(id=''){const c=id?findClient(id):{id:'',name:'',tax:'',email:'',phone:'',address:'',notes:''};document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${id?'Editar':'Nou'} client</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Nom complet</label><input id="fName" value="${esc(c.name)}"></div><div class="field"><label>NIF / NIE</label><input id="fTax" value="${esc(c.tax)}"></div><div class="field"><label>Email</label><input id="fEmail" type="email" value="${esc(c.email)}"></div><div class="field"><label>Telèfon</label><input id="fPhone" value="${esc(c.phone)}"></div><div class="field"><label>Adreça</label><input id="fAddress" value="${esc(c.address)}"></div><div class="field"><label>Notes</label><textarea id="fNotes">${esc(c.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveClient('${id}')">Desar</button>${id?`<button class="btn danger" onclick="deleteClient('${id}')">Eliminar</button>`:'<button class="btn" onclick="closeModal()">Cancel·lar</button>'}</div></div></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function saveClient(id){const name=document.getElementById('fName').value.trim();if(!name)return alert('El nom és obligatori.');const s=load(),now=new Date().toISOString(),data={id:id||uid(),name,tax:document.getElementById('fTax').value.trim(),email:document.getElementById('fEmail').value.trim(),phone:document.getElementById('fPhone').value.trim(),address:document.getElementById('fAddress').value.trim(),notes:document.getElementById('fNotes').value.trim(),updatedAt:now};const index=s.clients.findIndex(c=>c.id===id);if(index>=0)s.clients[index]={...s.clients[index],...data};else s.clients.push({...data,createdAt:now});save(s);closeModal()}
function deleteClient(id){const s=load();const linkedCase=s.cases.some(c=>(c.participants||[]).some(p=>p.clientId===id));const linkedDoc=s.documents.some(d=>d.clientId===id);if(linkedCase||linkedDoc)return alert('No es pot eliminar: té expedients o documents vinculats.');if(!confirm('Eliminar aquest client?'))return;s.clients=s.clients.filter(c=>c.id!==id);save(s);closeModal()}
function runTests(){const tests=[];const test=(name,fn)=>{try{fn();tests.push({name,ok:true})}catch(e){tests.push({name,ok:false,error:e.message})}};const original=localStorage.getItem(KEY);test('Build identificada',()=>{if(VERSION!=='v0.2.1-dev.5'||TEST_SUITE!=='T-005')throw Error('Build incorrecta')});test('Crear client',()=>{const s=emptyState();s.clients.push({id:'t1',name:'Anna Garcia'});if(s.clients.length!==1)throw Error('No creat')});test('Editar client',()=>{const s=emptyState();s.clients=[{id:'t1',name:'Anna'}];s.clients[0]={...s.clients[0],name:'Anna Garcia'};if(s.clients[0].name!=='Anna Garcia')throw Error('No editat')});test('Cercar client',()=>{const s=emptyState();s.clients=[{id:'1',name:'Anna Garcia',tax:'123A'},{id:'2',name:'Marc Pérez',tax:'456B'}];localStorage.setItem(KEY,JSON.stringify(s));if(searchClients('123a').length!==1)throw Error('Cerca incorrecta')});test('Bloquejar eliminació amb expedient',()=>{const s=emptyState();s.clients=[{id:'1',name:'Anna'}];s.cases=[{id:'e1',participants:[{clientId:'1'}]}];if(!s.cases.some(c=>c.participants.some(p=>p.clientId==='1')))throw Error('Relació no detectada')});if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);renderClients();document.getElementById('testResults').innerHTML=tests.map(t=>`<div class="test-row"><span>${t.ok?'Correcte':'Error'}</span><strong>${esc(t.name)}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div>`).join('');const failed=tests.filter(t=>!t.ok).length;const status=document.getElementById('testStatus');status.textContent=failed?`${VERSION} · ${TEST_SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${TEST_SUITE}: totes les proves han passat.`;status.className='status '+(failed?'bad':'ok')}
renderClients();runTests();
</script></body></html>
