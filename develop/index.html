<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma Office · Develop</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--s:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:820px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}.panel,.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.panel{overflow:hidden;margin-bottom:14px}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.danger{color:var(--bad)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}.metric{font:600 27px Georgia,serif;margin-top:5px}.search{width:100%;padding:12px 14px;border:1px solid var(--l);border-radius:12px;background:#fff}.row{padding:13px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:3px}.empty{padding:24px;text-align:center;color:var(--m)}.status{padding:12px;border-radius:12px;background:var(--s);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.modal{position:fixed;inset:0;background:rgba(25,14,19,.55);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--p);border-radius:22px 22px 0 0}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(250,248,243,.96);z-index:2}.sheet-head h3{margin:0;font:500 22px Georgia,serif}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:80px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.participant{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-bottom:8px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:720px;border-radius:22px}.nav{left:50%;transform:translateX(-50%);max-width:720px;border:1px solid var(--l);border-radius:16px 16px 0 0}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>DEVELOP · CASE-CENTERED</small></div><div class="badges"><span class="badge">v0.2.1-dev.10</span><span class="badge">T-010</span><span class="badge">Schema v2</span><span class="badge">Case-first navigation</span></div></header><main class="wrap"><section id="homeView" class="view active"><div class="grid"><div class="card"><div class="label">Expedients oberts</div><div id="homeOpen" class="metric">0</div></div><div class="card"><div class="label">Documents</div><div id="homeDocs" class="metric">0</div></div><div class="card"><div class="label">Factures</div><div id="homeInvoices" class="metric">0</div></div><div class="card"><div class="label">Cites</div><div id="homeEvents" class="metric">0</div></div></div><div class="panel" style="margin-top:14px"><div class="head"><h2>Expedients recents</h2><button class="btn primary" onclick="showView('cases');openCaseForm()">Nou expedient</button></div><div id="recentCases" class="body"></div></div></section><section id="casesView" class="view"><div class="panel"><div class="head"><h2>Expedients</h2><button class="btn primary" onclick="openCaseForm()">Nou expedient</button></div><div class="body"><input id="caseSearch" class="search" placeholder="Cercar expedient o participant" oninput="renderCases()"><div id="caseList"></div></div></div></section><section id="calendarView" class="view"><div class="panel"><div class="head"><h2>Calendari</h2><button class="btn primary" onclick="addEvent()">Nova cita</button></div><div id="eventList" class="body"></div></div></section><section id="settingsView" class="view"><div class="panel"><div class="head"><h2>Configuració</h2></div><div class="body"><div class="field"><label>Nom professional</label><input id="sName" value="Julia María Rico López"></div><div class="field"><label>Email</label><input id="sEmail" value="info@pyc.legal"></div><button class="btn primary" onclick="saveSettings()">Desar configuració</button></div></div><div class="panel"><div class="head"><h2>Diagnòstic · T-010</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></div></section></main><nav class="nav"><button id="navHome" class="active" onclick="showView('home')">Inici</button><button id="navCases" onclick="showView('cases')">Expedients</button><button id="navCalendar" onclick="showView('calendar')">Calendari</button><button id="navSettings" onclick="showView('settings')">Configuració</button></nav><div id="modal"></div><script>const VERSION='v0.2.1-dev.10',SUITE='T-010',KEY='pyc_office_v2';const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:2,settings:{name:'Julia María Rico López',email:'info@pyc.legal'},clients:[],cases:[],documents:[],events:[],activity:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s));renderAll()}function showView(name){['home','cases','calendar','settings'].forEach(v=>{document.getElementById(v+'View').classList.toggle('active',v===name);document.getElementById('nav'+v[0].toUpperCase()+v.slice(1)).classList.toggle('active',v===name)})}function names(c,s){return(c.participants||[]).map(p=>s.clients.find(x=>x.id===p.clientId)?.name||'Client desconegut').join(', ')}function renderAll(){const s=load();homeOpen.textContent=s.cases.filter(c=>c.status!=='tancat').length;homeDocs.textContent=s.documents.length;homeInvoices.textContent=s.documents.filter(d=>d.type==='factura').length;homeEvents.textContent=(s.events||[]).length;const recent=[...s.cases].slice(-5).reverse();recentCases.innerHTML=recent.length?recent.map(c=>caseRow(c,s)).join(''):'<div class="empty">Encara no hi ha expedients.</div>';renderCases();renderEvents();sName.value=s.settings?.name||'';sEmail.value=s.settings?.email||''}function caseRow(c,s){return `<div class="row" onclick="openCaseCenter('${c.id}')"><div><strong>${esc(c.name)}</strong><small>${esc(c.code||'Sense codi')} · ${esc(names(c,s))}</small></div><span>›</span></div>`}function renderCases(){const s=load(),q=(caseSearch?.value||'').toLowerCase();const list=s.cases.filter(c=>!q||[c.name,c.code,c.type,c.status,names(c,s)].join(' ').toLowerCase().includes(q));caseList.innerHTML=list.length?list.map(c=>caseRow(c,s)).join(''):'<div class="empty">No s’han trobat expedients.</div>'}function renderEvents(){const s=load();eventList.innerHTML=(s.events||[]).length?s.events.map(e=>`<div class="row"><div><strong>${esc(e.title)}</strong><small>${esc(e.date)} · ${esc(e.caseName||'Sense expedient')}</small></div></div>`).join(''):'<div class="empty">No hi ha cites.</div>'}function closeModal(){modal.innerHTML=''}function participantRow(p={clientId:'',role:'principal'}){const s=load();return `<div class="participant"><select class="pClient">${s.clients.map(c=>`<option value="${c.id}" ${c.id===p.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="pRole" value="${esc(p.role||'principal')}"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`}function addParticipant(){participants.insertAdjacentHTML('beforeend',participantRow())}function openCaseForm(){const s=load();if(!s.clients.length)return openNewClientThenCase();modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>Nou expedient</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Nom</label><input id="cName"></div><div class="field"><label>Codi</label><input id="cCode"></div><div class="field"><label>Tipus</label><select id="cType"><option value="divorci">Divorci</option><option value="herencia">Herència</option><option value="compravenda">Compravenda</option><option value="altres">Altres</option></select></div><div class="field"><label>Participants</label><div id="participants">${participantRow({clientId:s.clients[0].id})}</div><button class="btn" onclick="addParticipant()">Afegir participant</button></div><button class="btn primary" style="width:100%" onclick="saveCase()">Crear expedient</button></div></div></div>`}function openNewClientThenCase(){modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>Primer participant</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Nom complet</label><input id="newClientName"></div><div class="field"><label>NIF / NIE</label><input id="newClientTax"></div><button class="btn primary" style="width:100%" onclick="saveFirstClient()">Crear client i continuar</button></div></div></div>`}function saveFirstClient(){if(!newClientName.value.trim())return alert('El nom és obligatori.');const s=load();s.clients.push({id:uid(),name:newClientName.value.trim(),tax:newClientTax.value.trim()});save(s);openCaseForm()}function saveCase(){const s=load(),ps=[...document.querySelectorAll('.participant')].map((r,i)=>({clientId:r.querySelector('.pClient').value,role:r.querySelector('.pRole').value||'principal',isPrimary:i===0}));if(!cName.value.trim())return alert('El nom és obligatori.');if(new Set(ps.map(p=>p.clientId)).size!==ps.length)return alert('No es pot repetir un participant.');s.cases.push({id:uid(),name:cName.value.trim(),code:cCode.value.trim(),type:cType.value,status:'obert',participants:ps,createdAt:new Date().toISOString()});save(s);closeModal();showView('cases')}function openCaseCenter(id){localStorage.setItem('pyc_current_case',id);location.href='case-center.html?build=v0.2.1-dev.10'}function addEvent(){const s=load();modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>Nova cita</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body"><div class="field"><label>Títol</label><input id="eTitle"></div><div class="field"><label>Data</label><input id="eDate" type="date"></div><div class="field"><label>Expedient</label><select id="eCase"><option value="">Sense expedient</option>${s.cases.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn primary" style="width:100%" onclick="saveEvent()">Desar cita</button></div></div></div>`}function saveEvent(){if(!eTitle.value.trim()||!eDate.value)return alert('Cal indicar títol i data.');const s=load(),c=s.cases.find(x=>x.id===eCase.value);s.events=s.events||[];s.events.push({id:uid(),title:eTitle.value.trim(),date:eDate.value,caseId:eCase.value,caseName:c?.name||''});save(s);closeModal()}function saveSettings(){const s=load();s.settings={...s.settings,name:sName.value.trim(),email:sEmail.value.trim()};save(s);alert('Configuració desada.')}function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{ok('Build identificada',VERSION==='v0.2.1-dev.10'&&SUITE==='T-010');let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'}];s.cases=[{id:'e',name:'Divorci test',status:'obert',participants:[{clientId:'a'},{clientId:'b'}]}];s.events=[{id:'ev',title:'Cita',date:'2026-08-03',caseId:'e'}];localStorage.setItem(KEY,JSON.stringify(s));let x=load();ok('Navegació case-first',Array.isArray(x.cases)&&!('clientsView'in window));ok('Expedient amb participants',x.cases[0].participants.length===2);ok('Calendari vinculat',x.events[0].caseId==='e');x.settings.name='Julia Rico';localStorage.setItem(KEY,JSON.stringify(x));ok('Configuració persistent',load().settings.name==='Julia Rico')}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);renderAll();testResults.innerHTML=tests.map(t=>`<div class="row"><div><strong>${esc(t.name)}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const failed=tests.filter(t=>!t.ok).length;testStatus.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les proves han passat.`;testStatus.className='status '+(failed?'bad':'ok')}renderAll();runTests();</script></body></html>
