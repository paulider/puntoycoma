<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma Office · Develop</title><style>:root{--brand:#6b1730;--paper:#faf8f3;--ink:#282125;--muted:#776d71;--line:#ded6d1;--ok:#2f6f4e;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--brand);color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.build{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}.badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;letter-spacing:.05em}.wrap{max-width:760px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,40,.04);margin-bottom:14px}.head{padding:15px 16px;border-bottom:1px solid var(--line)}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.row{padding:12px 0;border-bottom:1px solid #eee7e2}.row:last-child{border-bottom:0}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}strong{display:block;margin-top:4px}small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font:600 26px Georgia,serif;margin-top:5px}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>DEVELOP PREVIEW</small></div><div class="build"><span class="badge">v0.2.1-dev.4</span><span class="badge">T-004</span><span class="badge">Schema v2</span><span class="badge">Build 7d5ea9f</span></div></header><main class="wrap"><div class="panel"><div class="head"><h2>Prova de la nova arquitectura</h2></div><div class="body"><div id="status" class="status">Executant proves automàtiques...</div><button class="btn primary" onclick="runTests()">Executar proves</button><button class="btn" onclick="createSample()">Crear dades de prova</button><button class="btn" onclick="clearTestData()">Netejar dades de prova</button></div></div><div class="grid"><div class="panel"><div class="body"><div class="label">Clients</div><div id="clients" class="metric">0</div></div></div><div class="panel"><div class="body"><div class="label">Expedients</div><div id="cases" class="metric">0</div></div></div></div><div class="panel"><div class="head"><h2>Resultats · T-004</h2></div><div id="results" class="body"></div></div></main><script>
const KEY='pyc_office_v2';const VERSION='v0.2.1-dev.4';const TEST_SUITE='T-004';
function emptyState(){return{version:2,settings:{name:'Julia María Rico López',invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[],cases:[],documents:[],activity:[]}}
function migrate(raw){const state={...emptyState(),...(raw||{})};state.cases=(raw?.cases||[]).map(c=>({...c,participants:Array.isArray(c.participants)?c.participants:(c.clientId?[{clientId:c.clientId,role:'principal',isPrimary:true}]:[])}));state.version=2;return state}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return emptyState()}}
function save(state){localStorage.setItem(KEY,JSON.stringify(migrate(state)));render()}
function render(){const s=load();document.getElementById('clients').textContent=s.clients.length;document.getElementById('cases').textContent=s.cases.length}
function result(name,ok,detail=''){return `<div class="row"><span class="label">${ok?'Correcte':'Error'}</span><strong>${name}</strong>${detail?`<small>${detail}</small>`:''}</div>`}
function runTests(){const out=[];let s=emptyState();out.push(result('Build identificada',VERSION==='v0.2.1-dev.4'&&TEST_SUITE==='T-004'));out.push(result('Es crea un estat buit',s.version===2));s.clients.push({id:'c1',name:'Client prova'});s.cases.push({id:'e1',name:'Divorci prova',participants:[{clientId:'c1',role:'conyuge_1',isPrimary:true}]});save(s);const loaded=load();out.push(result('LocalStorage desa i recupera dades',loaded.clients.length===1&&loaded.cases.length===1));const legacy=migrate({clients:[{id:'c2',name:'Legacy'}],cases:[{id:'e2',clientId:'c2',name:'Expedient antic'}]});out.push(result('Migració de client únic a participants',legacy.cases[0].participants?.[0]?.clientId==='c2'));const unlimited={id:'e3',participants:Array.from({length:8},(_,i)=>({clientId:`c${i}`,role:'client',isPrimary:i===0}))};out.push(result('Admet participants il·limitats',unlimited.participants.length===8));const duplicateNameSearch=['Anna Garcia','Marc Pérez'].filter(n=>n.toLowerCase().includes('anna')).length===1;out.push(result('Cerca bàsica de clients',duplicateNameSearch));document.getElementById('results').innerHTML=out.join('');const ok=!out.join('').includes('Error');const status=document.getElementById('status');status.textContent=ok?`${VERSION} · ${TEST_SUITE}: totes les proves han passat.`:`${VERSION} · ${TEST_SUITE}: hi ha proves amb errors.`;status.className='status '+(ok?'ok':'');render()}
function createSample(){const s=emptyState();s.clients=[{id:'c1',name:'Anna Garcia'},{id:'c2',name:'Marc Pérez'},{id:'c3',name:'Laia Garcia'}];s.cases=[{id:'e1',name:'Divorci de mutu acord',participants:[{clientId:'c1',role:'conyuge_1',isPrimary:true},{clientId:'c2',role:'conyuge_2',isPrimary:false}]},{id:'e2',name:'Herència familiar',participants:[{clientId:'c1',role:'heretera',isPrimary:true},{clientId:'c3',role:'heretera',isPrimary:false}]}];save(s);document.getElementById('status').textContent=`${VERSION}: dades de prova creades.`}
function clearTestData(){localStorage.removeItem(KEY);render();document.getElementById('results').innerHTML='';document.getElementById('status').textContent=`${VERSION}: dades de prova eliminades.`}
render();runTests();
</script></body></html>
