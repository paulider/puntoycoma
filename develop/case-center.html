<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Case Center</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:820px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}.metric{font:600 24px Georgia,serif;margin-top:5px}.row{padding:13px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:3px}.empty{padding:22px;text-align:center;color:var(--m)}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.timeline{border-left:2px solid #e7ddd8;margin-left:8px;padding-left:16px}.event{position:relative;padding:0 0 16px}.event:before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--b)}.event small{color:var(--m)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.modal{position:fixed;inset:0;background:rgba(25,14,19,.55);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--p);border-radius:22px 22px 0 0}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(250,248,243,.96)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:90px}@media(min-width:760px){.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:680px;border-radius:22px}.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>CASE-CENTERED WORKSPACE</small></div><div class="badges"><span class="badge">v0.2.1-dev.9</span><span class="badge">T-009</span><span class="badge">Schema v2</span><span class="badge">Case Center</span></div></header><main class="wrap"><section class="panel"><div class="head"><div><div class="label" id="caseCode">Sense expedient</div><h2 id="caseName">Centre d’expedient</h2></div><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body"><div class="grid"><div class="card"><div class="label">Participants</div><div id="metricParticipants" class="metric">0</div></div><div class="card"><div class="label">Documents</div><div id="metricDocuments" class="metric">0</div></div><div class="card"><div class="label">Factures</div><div id="metricInvoices" class="metric">0</div></div><div class="card"><div class="label">Estat</div><div id="metricStatus" class="metric">—</div></div></div></div></section><section class="panel"><div class="head"><h2>Accions ràpides</h2></div><div class="body"><div class="actions"><button class="btn primary" onclick="addNote()">Afegir nota</button><button class="btn" onclick="addDocument()">Nou document</button><button class="btn" onclick="addTask()">Nova tasca</button><button class="btn" onclick="addPayment()">Registrar pagament</button></div></div></section><section class="panel"><div class="head"><h2>Participants</h2></div><div id="participants" class="body"></div></section><section class="panel"><div class="head"><h2>Documents</h2></div><div id="documents" class="body"></div></section><section class="panel"><div class="head"><h2>Cronologia</h2></div><div id="timeline" class="body"></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-009</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></section></main><div id="modal"></div><script>
const VERSION='v0.2.1-dev.9',SUITE='T-009',KEY='pyc_office_v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function empty(){return{version:2,settings:{},clients:[],cases:[],documents:[],activity:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||empty()}catch{return empty()}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}
function getCurrentCase(){const s=load();const id=localStorage.getItem('pyc_current_case');return s.cases.find(c=>c.id===id)||s.cases[0]||null}
function relations(c,s){return{participants:(c?.participants||[]).map(p=>({...p,client:s.clients.find(x=>x.id===p.clientId)})),documents:s.documents.filter(d=>d.caseId===c?.id),invoices:s.documents.filter(d=>d.caseId===c?.id&&d.type==='factura')}}
function render(){const s=load(),c=getCurrentCase(),r=relations(c,s);caseCode.textContent=c?.code||'Sense expedient';caseName.textContent=c?.name||'Centre d’expedient';metricParticipants.textContent=r.participants.length;metricDocuments.textContent=r.documents.length;metricInvoices.textContent=r.invoices.length;metricStatus.textContent=c?.status||'—';participants.innerHTML=r.participants.length?r.participants.map(p=>`<div class="row"><div><strong>${esc(p.client?.name||'Client desconegut')}</strong><small>${esc(p.role||'participant')}</small></div><span>›</span></div>`).join(''):'<div class="empty">No hi ha participants.</div>';documents.innerHTML=r.documents.length?r.documents.map(d=>`<div class="row"><div><strong>${esc(d.title||d.type)}</strong><small>${esc(d.type)} · ${esc(d.date||'')}</small></div><span>${esc(d.number||'')}</span></div>`).join(''):'<div class="empty">No hi ha documents.</div>';const events=(s.activity||[]).filter(e=>e.caseId===c?.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));timeline.innerHTML=events.length?`<div class="timeline">${events.map(e=>`<div class="event"><strong>${esc(e.title)}</strong><small>${esc(e.date||'')}</small>${e.body?`<div>${esc(e.body)}</div>`:''}</div>`).join('')}</div>`:'<div class="empty">Encara no hi ha activitat.</div>'}
function loadDemo(){const s=load();const ids=['cc-a','cc-b'];s.clients=s.clients.filter(c=>!ids.includes(c.id));s.cases=s.cases.filter(c=>c.id!=='cc-case');s.documents=s.documents.filter(d=>d.caseId!=='cc-case');s.activity=(s.activity||[]).filter(e=>e.caseId!=='cc-case');s.clients.push({id:'cc-a',name:'Anna Garcia',tax:'12345678A'},{id:'cc-b',name:'Marc Pérez',tax:'87654321B'});s.cases.push({id:'cc-case',code:'EXP-2026-018',name:'Divorci Garcia - Pérez',type:'divorci',status:'obert',participants:[{clientId:'cc-a',role:'cònjuge 1'},{clientId:'cc-b',role:'cònjuge 2'}]});s.documents.push({id:'cc-d1',caseId:'cc-case',clientId:'cc-a',type:'provisio',title:'Provisió de fons',date:'2026-08-02'},{id:'cc-d2',caseId:'cc-case',clientId:'cc-a',type:'factura',title:'Factura honoraris',number:'F-2026-001',date:'2026-08-02'});s.activity.push({id:'cc-e1',caseId:'cc-case',title:'Alta de l’expedient',date:'2026-08-02'},{id:'cc-e2',caseId:'cc-case',title:'Provisió de fons creada',date:'2026-08-02'});localStorage.setItem('pyc_current_case','cc-case');save(s)}
function closeModal(){modal.innerHTML=''}
function form(title,body,onSave){modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${title}</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body">${body}<button class="btn primary" style="width:100%" onclick="${onSave}">Desar</button></div></div></div>`}
function addNote(){const c=getCurrentCase();if(!c)return alert('Carrega un expedient.');form('Afegir nota','<div class="field"><label>Nota</label><textarea id="noteBody"></textarea></div>',"saveEvent('Nota',noteBody.value)")}
function addTask(){const c=getCurrentCase();if(!c)return alert('Carrega un expedient.');form('Nova tasca','<div class="field"><label>Tasca</label><input id="taskBody"></div>',"saveEvent('Tasca',taskBody.value)")}
function addPayment(){const c=getCurrentCase();if(!c)return alert('Carrega un expedient.');form('Registrar pagament','<div class="field"><label>Import</label><input id="payBody" type="number" step="0.01"></div>',"saveEvent('Pagament',payBody.value+' €')")}
function saveEvent(title,body){if(!body?.trim())return alert('Cal indicar contingut.');const s=load(),c=getCurrentCase();s.activity.push({id:uid(),caseId:c.id,title,date:new Date().toISOString().slice(0,10),body:body.trim()});save(s);closeModal()}
function addDocument(){const c=getCurrentCase();if(!c)return alert('Carrega un expedient.');form('Nou document','<div class="field"><label>Títol</label><input id="docTitle"></div><div class="field"><label>Tipus</label><select id="docType"><option value="lliure">Document lliure</option><option value="provisio">Provisió</option><option value="factura">Factura</option></select></div>',"saveDocument()")}
function saveDocument(){if(!docTitle.value.trim())return alert('Cal indicar un títol.');const s=load(),c=getCurrentCase();s.documents.push({id:uid(),caseId:c.id,type:docType.value,title:docTitle.value.trim(),date:new Date().toISOString().slice(0,10)});s.activity.push({id:uid(),caseId:c.id,title:'Document creat',date:new Date().toISOString().slice(0,10),body:docTitle.value.trim()});save(s);closeModal()}
function runTests(){const original=localStorage.getItem(KEY),current=localStorage.getItem('pyc_current_case'),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{ok('Build identificada',VERSION==='v0.2.1-dev.9'&&SUITE==='T-009');loadDemo();let s=load(),c=getCurrentCase(),r=relations(c,s);ok('Carregar expedient central',c?.id==='cc-case');ok('Mostrar participants',r.participants.length===2);ok('Mostrar documents',r.documents.length===2);ok('Comptar factures',r.invoices.length===1);s.activity.push({id:'t-note',caseId:c.id,title:'Nota',date:'2026-08-02',body:'Prova'});localStorage.setItem(KEY,JSON.stringify(s));ok('Afegir activitat',load().activity.some(e=>e.id==='t-note'));s.documents.push({id:'t-doc',caseId:c.id,type:'lliure',title:'Document prova'});localStorage.setItem(KEY,JSON.stringify(s));ok('Afegir document',relations(getCurrentCase(),load()).documents.some(d=>d.id==='t-doc'));}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);if(current===null)localStorage.removeItem('pyc_current_case');else localStorage.setItem('pyc_current_case',current)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="row"><div><strong>${esc(t.name)}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const failed=tests.filter(t=>!t.ok).length;testStatus.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les proves han passat.`;testStatus.className='status '+(failed?'':'ok')}
render();runTests();
</script></body></html>
