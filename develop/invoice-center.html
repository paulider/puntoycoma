<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Invoice Center</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.back{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:900px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.line{display:grid;grid-template-columns:1fr 80px 100px 40px;gap:8px;padding:10px 0;border-bottom:1px solid #eee7e2}.line:last-child{border-bottom:0}.source{font-size:11px;color:var(--m);margin-top:4px}.summary{background:var(--soft);border-radius:12px;padding:14px}.summary-row{display:flex;justify-content:space-between;padding:6px 0}.summary-row.total{font-weight:800;border-top:1px solid var(--l);margin-top:5px;padding-top:10px}.row{padding:12px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px}.row:last-child{border-bottom:0}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}@media(max-width:620px){.line{grid-template-columns:1fr 72px 86px 38px}}</style></head><body><header class="top"><div class="topline"><div class="brand">PUNTO Y COMA<small>INVOICE CENTER</small></div><button class="back" onclick="location.href='case-center.html?build=v0.2.1-dev.15'">Tornar</button></div><div class="badges"><span class="badge">v0.2.1-dev.15</span><span class="badge">T-015</span><span class="badge">Schema v2</span><span class="badge">Mixed invoice lines</span></div></header><main class="wrap"><section class="panel"><div class="head"><h2>Crear factura</h2></div><div class="body"><div class="field"><label>Abast</label><select id="scope"><option value="partial">Part de l’expedient</option><option value="full">Tot l’expedient pendent</option></select></div><div class="field"><label>Destinatari</label><select id="recipient"></select></div></div></section><section class="panel"><div class="head"><h2>Línies</h2><div><button class="btn" onclick="addDocumentLine()">+ Document</button> <button class="btn" onclick="addServiceLine()">+ Servei</button></div></div><div class="body"><div id="lines"></div><button class="btn" style="margin-top:12px" onclick="saveCurrentService()">Desar servei actual al catàleg</button></div></section><section class="panel"><div class="head"><h2>Resum</h2></div><div class="body"><div id="totals" class="summary"></div><button class="btn primary full" style="margin-top:12px" onclick="createInvoice()">Crear factura</button></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-015</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></section></main><script>
const VERSION='v0.2.1-dev.15',SUITE='T-015',KEY='pyc_office_v2';let invoiceLines=[];
const empty=()=>({version:2,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[],cases:[],documents:[],activity:[],serviceCatalog:[]});
const load=()=>{try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}};const save=s=>localStorage.setItem(KEY,JSON.stringify(s));const currentCase=s=>s.cases.find(c=>c.id===localStorage.getItem('pyc_current_case'))||s.cases[0];const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
function calc(lines){const normalized=lines.map(l=>({...l,subtotal:round(l.qty*l.price)}));const base=round(normalized.reduce((a,l)=>a+l.subtotal,0));const vat=round(normalized.reduce((a,l)=>a+l.subtotal*(l.vat||0)/100,0));const irpf=round(normalized.reduce((a,l)=>a+l.subtotal*(l.irpf||0)/100,0));return{lines:normalized,base,vat,irpf,total:round(base+vat-irpf)}}
function render(){const s=load(),c=currentCase(s),ids=(c?.participants||[]).map(p=>p.clientId);recipient.innerHTML=s.clients.filter(x=>ids.includes(x.id)).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');lines.innerHTML=invoiceLines.map((l,i)=>`<div class="line"><div><input value="${l.description}" oninput="invoiceLines[${i}].description=this.value;renderTotals()"><div class="source">${l.kind==='document'?'Document vinculat':'Servei'}</div></div><input type="number" step="0.01" value="${l.qty}" oninput="invoiceLines[${i}].qty=Number(this.value);renderTotals()"><input type="number" step="0.01" value="${l.price}" oninput="invoiceLines[${i}].price=Number(this.value);renderTotals()"><button class="btn" onclick="invoiceLines.splice(${i},1);render()">×</button></div>`).join('')||'<div class="source">Afegeix documents o serveis.</div>';renderTotals()}
function renderTotals(){const t=calc(invoiceLines);totals.innerHTML=`<div class="summary-row"><span>Base</span><strong>${t.base.toFixed(2)} €</strong></div><div class="summary-row"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div><div class="summary-row"><span>IRPF</span><strong>−${t.irpf.toFixed(2)} €</strong></div><div class="summary-row total"><span>Total</span><strong>${t.total.toFixed(2)} €</strong></div>`}
function addDocumentLine(){const s=load(),c=currentCase(s);const docs=s.documents.filter(d=>d.caseId===c?.id&&d.type!=='factura'&&!d.invoiceId);if(!docs.length)return alert('No hi ha documents pendents de facturar.');const d=docs[0];invoiceLines.push({kind:'document',sourceDocumentId:d.id,description:d.title||d.type,qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0});render()}
function addServiceLine(){const s=load(),service=s.serviceCatalog?.find(x=>x.active!==false);invoiceLines.push({kind:'service',catalogItemId:service?.id||'',description:service?.name||'Nou servei',qty:1,price:Number(service?.unitPrice||0),vat:Number(service?.vatRate??21),irpf:Number(service?.irpfRate??0)});render()}
function saveCurrentService(){const l=[...invoiceLines].reverse().find(x=>x.kind==='service');if(!l)return alert('Afegeix primer una línia de servei.');const s=load();s.serviceCatalog=s.serviceCatalog||[];s.serviceCatalog.push({id:'svc-'+Date.now(),name:l.description,unitPrice:round(l.price),vatRate:l.vat,irpfRate:l.irpf,active:true});save(s);alert('Servei desat al catàleg.')}
function createInvoice(){const s=load(),c=currentCase(s);if(!c||!invoiceLines.length)return alert('Cal un expedient i almenys una línia.');const t=calc(invoiceLines),seq=Number(s.settings.nextInvoiceNumber||1),id='inv-'+Date.now();const invoice={id,caseId:c.id,clientId:recipient.value,type:'factura',title:'Factura honoraris',number:`${s.settings.invoicePrefix||'F-2026-'}${String(seq).padStart(3,'0')}`,status:'esborrany',scope:scope.value,lines:t.lines,base:t.base,vat:t.vat,irpf:t.irpf,total:t.total};s.settings.nextInvoiceNumber=seq+1;s.documents=s.documents.map(d=>t.lines.some(l=>l.sourceDocumentId===d.id)?{...d,invoiceId:id}:d);s.documents.push(invoice);s.activity.push({id:'act-'+Date.now(),caseId:c.id,title:'Factura creada',body:invoice.number,date:new Date().toISOString().slice(0,10)});save(s);invoiceLines=[];render();alert(`Factura ${invoice.number} creada.`)}
function runTests(){const original=localStorage.getItem(KEY),current=localStorage.getItem('pyc_current_case'),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'}];s.cases=[{id:'e',name:'Divorci',participants:[{clientId:'a'},{clientId:'b'}]}];s.documents=[{id:'d',caseId:'e',type:'informatiu',title:'Conveni',base:400}];s.serviceCatalog=[{id:'svc',name:'Reunió',unitPrice:100,vatRate:21,irpfRate:0,active:true}];localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('pyc_current_case','e');ok('Build identificada',VERSION==='v0.2.1-dev.15'&&SUITE==='T-015');const mixed=[{kind:'document',sourceDocumentId:'d',description:'Conveni',qty:1,price:400,vat:21,irpf:0},{kind:'service',catalogItemId:'svc',description:'Reunió',qty:2,price:100,vat:21,irpf:0}];const t=calc(mixed);ok('Combinar document i servei',mixed.length===2);ok('Base correcta',t.base===600);ok('IVA correcte',t.vat===126);ok('Total correcte',t.total===726);ok('Servei reutilitzable',s.serviceCatalog[0].name==='Reunió');ok('Document vinculat',mixed[0].sourceDocumentId==='d');ok('Línia manual editable',typeof mixed[1].description==='string')}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);if(current===null)localStorage.removeItem('pyc_current_case');else localStorage.setItem('pyc_current_case',current)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="row"><strong>${t.name}</strong><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}
render();runTests();
</script></body></html>
