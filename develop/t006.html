<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · T-006</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l)}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.status{padding:13px;border-radius:12px;background:#f2ece7;font-size:14px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.row{padding:12px 0;border-bottom:1px solid #eee7e2}.row:last-child{border-bottom:0}.row span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--m)}.row strong{display:block;margin-top:4px}.row small{display:block;color:var(--m);margin-top:4px}.btn{width:100%;margin-top:12px;border:1px solid var(--b);background:var(--b);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>FULL FLOW TEST</small></div><div class="badges"><span class="badge">v0.2.1-dev.6</span><span class="badge">T-006</span><span class="badge">Schema v2</span><span class="badge">Clients E2E</span></div></header><main class="wrap"><section class="panel"><div class="head"><h2>Prova completa de clients</h2></div><div class="body"><div id="status" class="status">Executant el flux complet...</div><button class="btn" onclick="runFullFlow()">Tornar a executar T-006</button></div></section><section class="panel"><div class="head"><h2>Resultats</h2></div><div id="results" class="body"></div></section></main><script>
const VERSION='v0.2.1-dev.6',SUITE='T-006',KEY='pyc_office_v2';
const empty=()=>({version:2,settings:{},clients:[],cases:[],documents:[],activity:[]});
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||empty()}catch{return empty()}};
const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
const search=(s,q)=>{q=String(q).toLowerCase();return s.clients.filter(c=>[c.name,c.tax,c.email,c.phone,c.address].join(' ').toLowerCase().includes(q))};
const result=(name,ok,detail='')=>({name,ok,detail});
function render(items){document.getElementById('results').innerHTML=items.map(t=>`<div class="row"><span>${t.ok?'Correcte':'Error'}</span><strong>${t.name}</strong>${t.detail?`<small>${t.detail}</small>`:''}</div>`).join('');const failed=items.filter(t=>!t.ok).length;const s=document.getElementById('status');s.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: flux complet superat i dades restaurades.`;s.className='status '+(failed?'bad':'ok')}
function runFullFlow(){const original=localStorage.getItem(KEY);const tests=[];try{
 tests.push(result('Capçalera i build correctes',VERSION==='v0.2.1-dev.6'&&SUITE==='T-006'));
 const state=load();const id='test-client-t006';state.clients=state.clients.filter(c=>c.id!==id);state.clients.push({id,name:'Client temporal T-006',tax:'T0060001X',email:'test@pyc.local',phone:'600000006',address:'Adreça temporal'});save(state);
 let current=load();tests.push(result('Crear client nou',current.clients.some(c=>c.id===id)));
 tests.push(result('Apareix a la llista',current.clients.filter(c=>c.id===id).length===1));
 const index=current.clients.findIndex(c=>c.id===id);current.clients[index]={...current.clients[index],name:'Client editat T-006',tax:'T0069999Z'};save(current);
 current=load();tests.push(result('Editar client',current.clients.find(c=>c.id===id)?.name==='Client editat T-006'));
 tests.push(result('Buscar pel nom',search(current,'client editat t-006').some(c=>c.id===id)));
 tests.push(result('Buscar pel NIF',search(current,'t0069999z').some(c=>c.id===id)));
 current.clients=current.clients.filter(c=>c.id!==id);save(current);
 current=load();tests.push(result('Eliminar client',!current.clients.some(c=>c.id===id)));
 tests.push(result('Desapareix de la llista',search(current,'t0069999z').length===0));
 }catch(error){tests.push(result('Execució de la suite',false,error.message))}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}
 const restored=localStorage.getItem(KEY)===original;tests.push(result('Restaurar dades prèvies',restored));render(tests)}
runFullFlow();
</script></body></html>
