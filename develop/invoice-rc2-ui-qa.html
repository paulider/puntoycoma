<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Invoice RC2 UI QA</title><style>:root{--b:#6b1730;--bg:#faf8f3;--line:#ded6d1;--ok:#2f6f4e;--err:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282125}.top{background:var(--b);color:#fff;padding:14px}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{min-height:44px;border:0;border-radius:10px;background:#fff;padding:10px 14px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:14px}.banner,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}.banner{padding:14px;margin-bottom:12px;font-weight:700}.banner.ok{background:#e4f2ea;color:var(--ok)}.banner.err{background:#fff0f2;color:var(--err)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:12px}.stat small{display:block;color:#776d71}.stat strong{font-size:22px}.panel{overflow:hidden;margin-bottom:12px}.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.test{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid #eee7e2}.pass{color:var(--ok)}.fail{color:var(--err)}iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:14px;background:#fff}pre{white-space:pre-wrap;background:#f2ece7;padding:8px;border-radius:8px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}iframe{height:860px}}</style></head><body><header class="top"><div class="bar"><strong>PUNTO Y COMA · INVOICE RC2 UI QA</strong><button id="run" class="btn">Executar proves UI</button></div></header><main class="wrap"><div id="banner" class="banner">Preparant entorn de prova…</div><div class="stats"><div class="stat"><small>Total</small><strong id="total">0</strong></div><div class="stat"><small>Correctes</small><strong id="passed">0</strong></div><div class="stat"><small>Errors</small><strong id="failed">0</strong></div><div class="stat"><small>Temps</small><strong id="duration">0 ms</strong></div></div><div id="results"></div><section class="panel"><div class="head"><strong>Aplicació sota prova</strong><span>invoice-rc2.html</span></div><div style="padding:12px"><iframe id="app" src="about:blank"></iframe></div></section></main><script>(()=>{'use strict';const STATE='pyc_office_v2',DRAFT='pyc_invoice_rc2_draft',frame=document.getElementById('app'),banner=document.getElementById('banner'),button=document.getElementById('run');const sleep=ms=>new Promise(r=>setTimeout(r,ms));const seed={settings:{name:'Julia María Rico López',tax:'74011732D',address:'c/ Camí Can Dori 32, 08811 Canyelles, Barcelona',email:'info@pyc.legal',iban:'ES73 1465 0120 37 1773656323',invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[{id:'c-a',name:'Anna Garcia',tax:'12345678A',address:'Carrer A 1, Barcelona',email:'anna@example.com'},{id:'c-b',name:'Marc Pérez',tax:'87654321B',address:'Carrer B 2, Barcelona',email:'marc@example.com'}],cases:[{id:'case-1',name:'Divorci Garcia - Pérez',code:'EXP-2026-001',clientId:'c-a',participants:['c-a','c-b'],status:'open'}],documents:[]};const tests=[];const add=(g,n,f)=>tests.push({g,n,f});const ok=(v,m='Condició falsa')=>{if(!v)throw new Error(m)};const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(`Esperat ${JSON.stringify(b)}, rebut ${JSON.stringify(a)}`)};function doc(){return frame.contentDocument}function win(){return frame.contentWindow}function input(el,value){el.focus();el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));for(const c of String(value)){el.value+=c;el.dispatchEvent(new Event('input',{bubbles:true}))}}function click(el){el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:win()}))}function change(el,value){el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}))}async function loadApp(){localStorage.setItem(STATE,JSON.stringify(seed));localStorage.removeItem(DRAFT);frame.src='invoice-rc2.html?uiqa='+Date.now();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Timeout carregant invoice-rc2.html')),10000);frame.onload=()=>{clearTimeout(timer);setTimeout(resolve,350)}})}add('Càrrega','Mostra expedient seeded',()=>ok(doc().querySelector('#case').textContent.includes('Divorci Garcia - Pérez')));add('Càrrega','Mostra emissor complet',()=>{const t=doc().querySelector('#issuer').textContent;ok(t.includes('Julia María Rico López'));ok(t.includes('74011732D'));ok(t.includes('ES73 1465'))});add('Participants','Mostra dos pagadors',()=>eq(doc().querySelectorAll('.payer').length,2));add('Mòbil','Preu manté focus escrivint 500',()=>{const price=doc().querySelector('[data-field="price"]');price.focus();for(const c of '500'){price.value+=c;price.dispatchEvent(new Event('input',{bubbles:true}));ok(doc().activeElement===price,'El focus s’ha perdut')}ok(price.value.endsWith('500'))});add('Mòbil','Percentatge manté focus escrivint 60',()=>{const value=doc().querySelector('.payer [data-value]');value.focus();value.value='';for(const c of '60'){value.value+=c;value.dispatchEvent(new Event('input',{bubbles:true}));ok(doc().activeElement===value,'El focus s’ha perdut')}eq(value.value,'60')});add('Edició','Conceptes i imports recalculen total',()=>{const concept=doc().querySelector('[data-field="concept"]'),qty=doc().querySelector('[data-field="qty"]'),price=doc().querySelector('[data-field="price"]');input(concept,'Conveni regulador');input(qty,'1');input(price,'500');ok(doc().querySelector('#summary').textContent.includes('605.00 €'))});add('Repartiment','Configura 60/40',()=>{const rows=[...doc().querySelectorAll('.payer')];rows.forEach((row,i)=>{const cb=row.querySelector('[data-enabled]');if(!cb.checked)click(cb);const mode=row.querySelector('[data-mode]');change(mode,'percent');const value=row.querySelector('[data-value]');input(value,i===0?'60':'40')});ok(doc().querySelector('#allocationStatus').textContent.includes('Correcte'))});add('Guardat','Desa factura sense error',()=>{click(doc().querySelector('#saveBtn'));ok(doc().querySelector('#status').textContent.includes('Desada'))});add('Persistència','Factura guardada en documents',()=>{const state=JSON.parse(localStorage.getItem(STATE));eq(state.documents.length,1);eq(state.documents[0].number,'F-2026-001');eq(state.documents[0].allocations.length,2)});add('Persistència','Repartiment 60/40 persistit',()=>{const state=JSON.parse(localStorage.getItem(STATE)),a=state.documents[0].allocations;eq(a.map(x=>x.value),[60,40])});add('Persistència','Totals persistits',()=>{const state=JSON.parse(localStorage.getItem(STATE)),inv=state.documents[0];eq(inv.base,500);eq(inv.vat,105);eq(inv.total,605)});add('Reobertura','Esborrany conserva línia i repartiment',async()=>{frame.src='invoice-rc2.html?uiqa=reload'+Date.now();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Timeout recarregant')),10000);frame.onload=()=>{clearTimeout(timer);setTimeout(resolve,350)}});ok(doc().querySelector('[data-field="concept"]').value.includes('Conveni regulador'));eq([...doc().querySelectorAll('.payer [data-value]')].map(x=>Number(x.value)),[60,40])});add('PDF','Renderer genera dades fiscals i client',()=>{const state=JSON.parse(localStorage.getItem(STATE)),inv=state.documents[0],html=win().PYCInvoiceRenderer.render(inv,{settings:state.settings,clients:state.clients,matter:state.cases[0]},'c-a');ok(html.includes('Julia María Rico López'));ok(html.includes('74011732D'));ok(html.includes('Anna Garcia'));ok(html.includes('Divorci Garcia - Pérez'));ok(html.includes('363.00 €'))});async function run(){button.disabled=true;banner.className='banner';banner.textContent='Executant proves UI…';const start=performance.now(),results=[];try{await loadApp()}catch(e){results.push({g:'Càrrega',n:'Carrega invoice-rc2.html',pass:false,error:e.message})}if(!results.length){for(const t of tests){try{await t.f();results.push({...t,pass:true})}catch(e){results.push({...t,pass:false,error:e.message||String(e)})}}const ms=Math.round(performance.now()-start),passed=results.filter(r=>r.pass).length,failed=results.length-passed;document.getElementById('total').textContent=results.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('duration').textContent=ms+' ms';banner.className='banner '+(failed?'err':'ok');banner.textContent=failed?`${passed}/${results.length} correctes · RC2 BLOQUEJADA`:`${passed}/${results.length} correctes · RC2 UI READY`;const grouped={};results.forEach(r=>(grouped[r.g]??=[]).push(r));document.getElementById('results').innerHTML=Object.entries(grouped).map(([g,items])=>`<section class="panel"><div class="head"><strong>${g}</strong><span>${items.filter(x=>x.pass).length}/${items.length}</span></div>${items.map(r=>`<div class="test"><span class="${r.pass?'pass':'fail'}">${r.pass?'✓':'✕'}</span><div><strong>${r.n}</strong>${r.error?`<pre>${r.error}</pre>`:''}</div><small>${r.pass?'PASS':'FAIL'}</small></div>`).join('')}</section>`).join('');button.disabled=false;return{passed,failed,results}}button.addEventListener('click',run);window.PYCInvoiceUIQA={run,tests};run()})();</script></body></html>
