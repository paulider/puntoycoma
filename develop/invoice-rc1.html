<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Punto y Coma · Factura RC1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf8f3}.bar{position:fixed;left:0;right:0;top:0;height:54px;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 7px) 12px 7px;background:#6b1730;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;min-height:40px;padding:8px 12px;font-weight:700}.bar strong{font:500 16px Georgia,serif;letter-spacing:.08em}.frame{position:fixed;inset:calc(54px + env(safe-area-inset-top)) 0 0;border:0;width:100%;height:calc(100% - 54px - env(safe-area-inset-top));background:#faf8f3}.loading{position:fixed;inset:calc(54px + env(safe-area-inset-top)) 0 0;display:grid;place-items:center;background:#faf8f3;color:#6b1730;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:4}</style></head><body><div class="bar"><button id="back">← Tornar</button><strong>FACTURA · RC1.1</strong></div><div id="loading" class="loading">Carregant editor…</div><iframe id="invoice" class="frame" src="invoice-advanced-i18n-v041.html?rc1mobile=2" title="Editor de factura"></iframe><script>(()=>{const frame=document.getElementById('invoice'),loading=document.getElementById('loading');document.getElementById('back').onclick=()=>location.href='rc1-app-fixed.html?return=invoice';frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const style=doc.createElement('style');style.textContent=`@media(max-width:700px){body{padding-bottom:20px}.top{display:none}.wrap{padding:10px}.layout{display:block}.panel{border-radius:14px}.head{display:block}.head h2{margin-bottom:10px}.toolbar{display:grid!important;grid-template-columns:1fr 1fr;width:100%}.toolbar .btn{width:100%}.meta-grid{display:block}.invoice-line{display:grid!important;grid-template-columns:28px 34px minmax(0,1fr) 38px 38px!important;gap:8px!important;padding:12px!important}.invoice-line .line-main{grid-column:3/6}.invoice-line [data-field="groupKey"]{grid-column:1/6;display:block!important}.invoice-line [data-field="qty"],.invoice-line [data-field="price"],.invoice-line [data-field="vat"],.invoice-line [data-field="discount"]{display:block!important}.invoice-line [data-field="qty"]{grid-column:1/3}.invoice-line [data-field="price"]{grid-column:3/6}.invoice-line [data-field="vat"]{grid-column:1/3}.invoice-line [data-field="discount"]{grid-column:3/6}.invoice-line .exempt{grid-column:1/6;display:flex!important}.group-editor{grid-template-columns:minmax(0,1fr) 40px 40px 40px}.bulk{grid-template-columns:1fr}.summary .grand{font-size:20px}}`;doc.head.appendChild(style);const badges=doc.querySelectorAll('.badge');if(badges[0])badges[0].textContent='v0.3.0-rc1.1';if(badges[1])badges[1].textContent='RC1.1';loading.remove()}catch(error){loading.textContent='Error carregant editor: '+String(error.message||error)}})})();</script></body></html>
