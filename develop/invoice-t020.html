<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Facturació</title><style>:root{--b:#6b1730;--gold:#b9a074;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:980px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:1fr 1fr}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.line{display:grid;grid-template-columns:1fr 74px 96px 42px;gap:8px;padding:10px 0;border-bottom:1px solid #eee7e2}.summary{background:var(--soft);border-radius:12px;padding:14px}.sumrow{display:flex;justify-content:space-between;padding:6px 0}.sumrow.total{font-weight:800;border-top:1px solid var(--l);margin-top:6px;padding-top:10px}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.invoice{background:#fff;padding:24px;border:1px solid var(--l);border-radius:16px}.inv-top{display:flex;justify-content:space-between;gap:18px}.logo{font:500 22px Georgia,serif;letter-spacing:.12em}.logo small{display:block;font:10px sans-serif;letter-spacing:.25em;color:var(--gold);margin-top:5px}.title{text-align:right;letter-spacing:.25em;font-size:20px}.title small{display:block;color:var(--gold);letter-spacing:.12em;font-size:11px;margin-top:8px}.meta{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--l);padding-top:18px}.meta h4{font-size:10px;color:var(--gold);letter-spacing:.2em}.table{margin-top:22px}.thead,.trow{display:grid;grid-template-columns:1.4fr 2fr .5fr .8fr .8fr;gap:8px}.thead{background:var(--soft);padding:10px;font-size:10px;letter-spacing:.14em;font-weight:800}.trow{padding:11px 10px;border-bottom:1px solid var(--l);font-size:12px}.invoice .totals{margin-left:auto;margin-top:18px;max-width:330px}.note{margin-top:28px;border-left:3px solid var(--gold);padding-left:12px}.footer{margin-top:28px;background:var(--soft);padding:18px;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(max-width:720px){.grid.two{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.invoice{padding:16px}.thead,.trow{grid-template-columns:1.4fr .55fr .8fr .8fr}.thead div:nth-child(2),.trow div:nth-child(2){display:none}.line{grid-template-columns:1fr 68px 84px 38px}.inv-top{flex-direction:column}.title{text-align:left}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>FACTURACIÓ I PROVISIONS</small></div><div class="badges"><span class="badge">v0.2.1-dev.21</span><span class="badge">T-020</span><span class="badge">Schema v3</span><span class="badge">Operational billing</span></div></header><main class="wrap"><section class="panel"><div class="head"><h2>Nova factura</h2><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body grid two"><div><div class="field"><label>Expedient</label><select id="caseSelect" onchange="renderRecipients();renderProvision()"></select></div><div class="field"><label>Destinatari</label><select id="recipientSelect"></select></div><div class="field"><label>Abast</label><select id="scopeSelect"><option value="partial">Part de l’expedient</option><option value="full">Tot el pendent</option></select></div><div class="field"><label>Forma de pagament</label><select id="paymentMethod"><option>Transferència bancària</option><option>Domiciliació</option><option>Efectiu</option></select></div></div><div><div class="field"><label>Provisió disponible</label><input id="availableProvision" readonly></div><div class="field"><label>Aplicar provisió</label><input id="applyProvision" type="number" step="0.01" value="0" oninput="renderAll()"></div><div class="field"><label>Nota</label><textarea id="invoiceNote">Gràcies per confiar en els nostres serveis. Quedem a la seva disposició per a qualsevol consulta.</textarea></div></div></div></section><section class="panel"><div class="head"><h2>Línies de factura</h2><div><button class="btn" onclick="addDocumentLine()">+ Document</button> <button class="btn" onclick="addServiceLine()">+ Servei</button></div></div><div class="body"><div id="lines"></div><button class="btn" style="margin-top:12px" onclick="saveLastService()">Desar últim servei al catàleg</button></div></section><section class="panel"><div class="head"><h2>Previsualització</h2></div><div class="body"><div id="invoicePreview" class="invoice"></div></div></section><section class="panel"><div class="head"><h2>Accions</h2></div><div class="body"><button class="btn primary full" onclick="emitInvoice()">Emetre factura</button></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-020</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></section></main><nav class="nav"><button onclick="location.href='case-center-v19.html?build=v0.2.1-dev.21'">Expedient</button><button class="active">Facturació</button><button onclick="location.href='quality-center.html?build=v0.2.1-dev.21'">Qualitat</button></nav><script>const VERSION='v0.2.1-dev.21',SUITE='T-020',KEY='pyc_office_v2';let invoiceLines=[];const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:3,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1,name:'Julia Rico',phone:'649 766 012',email:'julia@pyc.legal',web:'www.puntoycoma.legal'},clients:[],cases:[],documents:[],activity:[],serviceCatalog:[],provisions:[],payments:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function currentCase(s=load()){return s.cases.find(c=>c.id===caseSelect.value)||s.cases[0]||null}function calc(){const lines=invoiceLines.map(l=>({...l,subtotal:round(l.qty*l.price)}));const base=round(lines.reduce((a,l)=>a+l.subtotal,0));const vat=round(lines.reduce((a,l)=>a+l.subtotal*(l.vat||0)/100,0));const irpf=round(lines.reduce((a,l)=>a+l.subtotal*(l.irpf||0)/100,0));const total=round(base+vat-irpf);const applied=Math.min(total,round(applyProvision.value));return{lines,base,vat,irpf,total,applied,due:round(total-applied)}}function renderSelectors(){const s=load();caseSelect.innerHTML=s.cases.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const current=localStorage.getItem('pyc_current_case');if(current&&s.cases.some(c=>c.id===current))caseSelect.value=current;renderRecipients();renderProvision()}function renderRecipients(){const s=load(),c=currentCase(s),ids=(c?.participants||[]).map(p=>p.clientId);recipientSelect.innerHTML=s.clients.filter(x=>ids.includes(x.id)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'<option value="third">Tercer pagador</option>';renderAll()}function renderProvision(){const s=load(),c=currentCase(s),balance=round(s.provisions.filter(p=>p.caseId===c?.id).reduce((a,p)=>a+(p.availableAmount||0),0));availableProvision.value=balance.toFixed(2)+' €';applyProvision.max=balance;renderAll()}function addDocumentLine(){const s=load(),c=currentCase(s),docs=s.documents.filter(d=>d.caseId===c?.id&&d.type!=='factura'&&!d.invoiceId);if(!docs.length)return alert('No hi ha documents pendents.');const d=docs.find(x=>!invoiceLines.some(l=>l.sourceDocumentId===x.id))||docs[0];invoiceLines.push({kind:'document',sourceDocumentId:d.id,description:d.title||d.type,qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0});renderAll()}function addServiceLine(){const s=load(),service=s.serviceCatalog.find(x=>x.active!==false);invoiceLines.push({kind:'service',catalogItemId:service?.id||'',description:service?.name||'Nou servei',qty:1,price:Number(service?.unitPrice||0),vat:Number(service?.vatRate??21),irpf:Number(service?.irpfRate??0)});renderAll()}function saveLastService(){const l=[...invoiceLines].reverse().find(x=>x.kind==='service');if(!l)return alert('Afegeix una línia de servei.');const s=load();s.serviceCatalog.push({id:uid(),name:l.description,unitPrice:round(l.price),vatRate:l.vat,irpfRate:l.irpf,active:true});save(s);alert('Servei desat al catàleg.')}function renderLines(){lines.innerHTML=invoiceLines.map((l,i)=>`<div class="line"><input value="${esc(l.description)}" oninput="invoiceLines[${i}].description=this.value;renderAll()"><input type="number" step="0.01" value="${l.qty}" oninput="invoiceLines[${i}].qty=Number(this.value);renderAll()"><input type="number" step="0.01" value="${l.price}" oninput="invoiceLines[${i}].price=Number(this.value);renderAll()"><button class="btn" onclick="invoiceLines.splice(${i},1);renderAll()">×</button></div>`).join('')||'<div class="status">Afegeix documents o serveis.</div>'}function renderPreview(){const s=load(),c=currentCase(s),client=s.clients.find(x=>x.id===recipientSelect.value),t=calc(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(s.settings.nextInvoiceNumber||1).padStart(3,'0')}`;invoicePreview.innerHTML=`<div class="inv-top"><div class="logo">PUNTO Y COMA<small>LEGAL</small></div><div class="title">FACTURA<small>N.º ${esc(number)}</small></div></div><div class="meta"><div><h4>DE</h4><strong>${esc(s.settings.name||'Julia Rico')}</strong><div>${esc(s.settings.phone||'')}</div><div>${esc(s.settings.email||'')}</div><div>${esc(s.settings.web||'')}</div></div><div><h4>PER A</h4><strong>${esc(client?.name||'Client')}</strong><div>${esc(c?.name||'')}</div><div>${new Date().toLocaleDateString('ca-ES')}</div><div>${esc(paymentMethod.value)}</div></div></div><div class="table"><div class="thead"><div>CONCEPTE</div><div>DESCRIPCIÓ</div><div>CANT.</div><div>PREU UNIT.</div><div>IMPORT</div></div>${t.lines.map(l=>`<div class="trow"><div>${esc(l.kind==='document'?'Document':'Servei')}</div><div>${esc(l.description)}</div><div>${l.qty}</div><div>${l.price.toFixed(2)} €</div><div>${l.subtotal.toFixed(2)} €</div></div>`).join('')}</div><div class="totals"><div class="sumrow"><span>Base imposable</span><strong>${t.base.toFixed(2)} €</strong></div><div class="sumrow"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div>${t.irpf?`<div class="sumrow"><span>IRPF</span><strong>−${t.irpf.toFixed(2)} €</strong></div>`:''}${t.applied?`<div class="sumrow"><span>Provisió aplicada</span><strong>−${t.applied.toFixed(2)} €</strong></div>`:''}<div class="sumrow total"><span>TOTAL PENDENT</span><strong>${t.due.toFixed(2)} €</strong></div></div><div class="note"><strong>NOTA</strong><div>${esc(invoiceNote.value)}</div></div><div class="footer"><strong>PUNTO Y COMA LEGAL</strong><div>${esc(s.settings.email||'')} · ${esc(s.settings.phone||'')}</div><div>${esc(s.settings.web||'')}</div></div>`}function renderAll(){renderLines();renderPreview()}function emitInvoice(){const s=load(),c=currentCase(s),client=s.clients.find(x=>x.id===recipientSelect.value),t=calc();if(!c||!invoiceLines.length||t.base<=0)return alert('Falten dades per emetre.');const seq=Number(s.settings.nextInvoiceNumber||1),id=uid(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(seq).padStart(3,'0')}`;const inv={id,caseId:c.id,clientId:client?.id||'',type:'factura',title:'Factura honoraris',number,status:'emesa',scope:scopeSelect.value,lines:t.lines,base:t.base,vat:t.vat,irpf:t.irpf,total:t.total,provisionApplied:t.applied,amountDue:t.due,paidAmount:0,issueDate:new Date().toISOString().slice(0,10),paymentMethod:paymentMethod.value,note:invoiceNote.value};s.settings.nextInvoiceNumber=seq+1;s.documents=s.documents.map(d=>t.lines.some(l=>l.sourceDocumentId===d.id)?{...d,invoiceId:id}:d);s.documents.push(inv);let remaining=t.applied;s.provisions=s.provisions.map(p=>{if(p.caseId!==c.id||remaining<=0||p.availableAmount<=0)return p;const use=Math.min(p.availableAmount,remaining);remaining=round(remaining-use);return{...p,availableAmount:round(p.availableAmount-use),appliedAmount:round((p.appliedAmount||0)+use),status:p.availableAmount-use<=0?'aplicada':p.status}});s.activity.push({id:uid(),caseId:c.id,title:'Factura emesa',body:number,date:inv.issueDate});save(s);invoiceLines=[];applyProvision.value=0;renderProvision();alert(`Factura ${number} emesa.`)}function loadDemo(){const s=load();s.clients=s.clients.filter(c=>!['t20-a','t20-b'].includes(c.id));s.cases=s.cases.filter(c=>c.id!=='t20-case');s.documents=s.documents.filter(d=>d.caseId!=='t20-case');s.provisions=s.provisions.filter(p=>p.caseId!=='t20-case');s.clients.push({id:'t20-a',name:'Anna Garcia',tax:'12345678A'},{id:'t20-b',name:'Marc Pérez',tax:'87654321B'});s.cases.push({id:'t20-case',name:'Divorci Garcia - Pérez',participants:[{clientId:'t20-a'},{clientId:'t20-b'}]});s.documents.push({id:'t20-d1',caseId:'t20-case',type:'informatiu',title:'Conveni regulador',billableAmount:450});s.serviceCatalog=[...(s.serviceCatalog||[]),{id:'t20-s1',name:'Reunió jurídica',unitPrice:120,vatRate:21,irpfRate:0,active:true}];s.provisions.push({id:'t20-p1',caseId:'t20-case',clientId:'t20-a',requestedAmount:300,paidAmount:300,appliedAmount:0,availableAmount:300,status:'pagada'});localStorage.setItem('pyc_current_case','t20-case');save(s);renderSelectors();invoiceLines=[];addDocumentLine();addServiceLine()}function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'}]}];s.documents=[{id:'d',caseId:'e',type:'informatiu',title:'Doc',billableAmount:400}];s.serviceCatalog=[{id:'sv',name:'Servei',unitPrice:100,vatRate:21,irpfRate:0,active:true}];s.provisions=[{id:'p',caseId:'e',availableAmount:300,appliedAmount:0,status:'pagada'}];localStorage.setItem(KEY,JSON.stringify(s));ok('Build identificada',VERSION==='v0.2.1-dev.21'&&SUITE==='T-020');invoiceLines=[{kind:'document',sourceDocumentId:'d',description:'Doc',qty:1,price:400,vat:21,irpf:0},{kind:'service',catalogItemId:'sv',description:'Servei',qty:1,price:100,vat:21,irpf:0}];applyProvision.value=300;const t=calc();ok('Factura mixta',t.lines.length===2);ok('Base correcta',t.base===500);ok('IVA correcte',t.vat===105);ok('Total correcte',t.total===605);ok('Aplicar provisió',t.applied===300&&t.due===305);ok('Document seleccionable',invoiceLines[0].sourceDocumentId==='d');ok('Servei reutilitzable',invoiceLines[1].catalogItemId==='sv');const number=`F-2026-${String(1).padStart(3,'0')}`;ok('Numeració consecutiva',number==='F-2026-001')}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);renderSelectors();invoiceLines=[];renderAll();testResults.innerHTML=tests.map(t=>`<div class="sumrow"><strong>${t.name}</strong><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${VERSION} · ${SUITE}: ${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}renderSelectors();renderAll();runTests();</script></body></html>
