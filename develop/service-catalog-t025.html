<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Catàleg de serveis</title><style>:root{--b:#6b1730;--p:#f7f4ee;--i:#282125;--m:#776d71;--l:#ddd5cf;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f0ebe4}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:1060px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,40,.04);margin-bottom:14px}.head{padding:14px 15px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 18px Georgia,serif}.body{padding:14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}.field textarea{min-height:92px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.service{padding:14px 0;border-bottom:1px solid #eee7e2}.service:last-child{border-bottom:0}.service-top{display:flex;justify-content:space-between;gap:12px}.service strong{display:block}.service small{display:block;color:var(--m);margin-top:4px;line-height:1.4}.service-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:var(--soft);white-space:nowrap}.pill.off{background:#f8e7ea;color:var(--bad)}.status{padding:11px;border-radius:11px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px}.metric span{display:block;font-size:10px;color:var(--m);letter-spacing:.1em;text-transform:uppercase}.metric strong{display:block;font:600 25px Georgia,serif;margin-top:6px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(max-width:820px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.split{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>CATÀLEG DE SERVEIS</small></div><div class="badges"><span class="badge">v0.2.1-dev.26</span><span class="badge">T-025</span><span class="badge">Schema v3</span><span class="badge">Persistent service catalog</span></div></header><main class="wrap"><section class="summary"><div class="metric"><span>Total</span><strong id="mTotal">0</strong></div><div class="metric"><span>Actius</span><strong id="mActive">0</strong></div><div class="metric"><span>Categories</span><strong id="mCategories">0</strong></div></section><div class="grid" style="margin-top:14px"><section><div class="panel"><div class="head"><h2 id="formTitle">Nou servei</h2><button class="btn" onclick="resetForm()">Netejar</button></div><div class="body"><input id="serviceId" type="hidden"><div class="field"><label>Nom</label><input id="name" placeholder="Ex. Reunió jurídica"></div><div class="field"><label>Descripció per defecte</label><textarea id="description" placeholder="Text que apareixerà a la factura"></textarea></div><div class="split"><div class="field"><label>Categoria</label><input id="category" list="categories" placeholder="Consultes"><datalist id="categories"></datalist></div><div class="field"><label>Unitat</label><select id="unit"><option value="unitat">Unitat</option><option value="hora">Hora</option><option value="sessio">Sessió</option><option value="document">Document</option><option value="procediment">Procediment</option><option value="desplacament">Desplaçament</option></select></div></div><div class="split"><div class="field"><label>Preu per defecte</label><input id="price" type="number" step="0.01"></div><div class="field"><label>Editable en factura</label><select id="editable"><option value="true">Sí</option><option value="false">No</option></select></div></div><div class="split"><div class="field"><label>IVA %</label><input id="vat" type="number" step="0.01" value="21"></div><div class="field"><label>IRPF %</label><input id="irpf" type="number" step="0.01" value="0"></div></div><div class="field"><label>Estat</label><select id="active"><option value="true">Actiu</option><option value="false">Inactiu</option></select></div><button class="btn primary full" onclick="saveService()">Desar servei</button></div></div><div class="panel"><div class="head"><h2>Diagnòstic · T-025</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></div></section><section><div class="panel"><div class="head"><h2>Serveis</h2><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body"><div class="split"><div class="field"><label>Cerca</label><input id="search" placeholder="Nom o descripció" oninput="render()"></div><div class="field"><label>Categoria</label><select id="categoryFilter" onchange="render()"><option value="">Totes</option></select></div></div><div id="serviceList"></div></div></div></section></div></main><nav class="nav"><button onclick="location.href='case-center-v19.html?build=v0.2.1-dev.26'">Expedient</button><button onclick="location.href='invoice-t024.html?build=v0.2.1-dev.26'">Facturació</button><button class="active">Serveis</button></nav><script>const VERSION='v0.2.1-dev.26',SUITE='T-025',KEY='pyc_office_v2';const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:3,settings:{},clients:[],cases:[],documents:[],activity:[],serviceCatalog:[],provisions:[],payments:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}function normalize(x){return{id:x.id||uid(),name:String(x.name||'').trim(),description:String(x.description||'').trim(),category:String(x.category||'General').trim()||'General',unit:x.unit||'unitat',unitPrice:Number(x.unitPrice||0),vatRate:Number(x.vatRate??21),irpfRate:Number(x.irpfRate??0),editable:x.editable!==false,active:x.active!==false,createdAt:x.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}}function saveService(){const s=load(),n=name.value.trim();if(!n)return alert('Cal indicar el nom.');const item=normalize({id:serviceId.value||uid(),name:n,description:description.value,category:category.value,unit:unit.value,unitPrice:price.value,vatRate:vat.value,irpfRate:irpf.value,editable:editable.value==='true',active:active.value==='true',createdAt:s.serviceCatalog.find(x=>x.id===serviceId.value)?.createdAt});const idx=s.serviceCatalog.findIndex(x=>x.id===item.id);if(idx>=0)s.serviceCatalog[idx]=item;else s.serviceCatalog.push(item);save(s);resetForm()}function editService(id){const x=load().serviceCatalog.find(v=>v.id===id);if(!x)return;serviceId.value=x.id;name.value=x.name;description.value=x.description||'';category.value=x.category||'';unit.value=x.unit||'unitat';price.value=x.unitPrice||0;vat.value=x.vatRate??21;irpf.value=x.irpfRate??0;editable.value=String(x.editable!==false);active.value=String(x.active!==false);formTitle.textContent='Editar servei';scrollTo({top:0,behavior:'smooth'})}function toggleService(id){const s=load(),x=s.serviceCatalog.find(v=>v.id===id);if(!x)return;x.active=!x.active;x.updatedAt=new Date().toISOString();save(s)}function duplicateService(id){const s=load(),x=s.serviceCatalog.find(v=>v.id===id);if(!x)return;const copy=normalize({...x,id:uid(),name:x.name+' (còpia)',createdAt:new Date().toISOString()});s.serviceCatalog.push(copy);save(s)}function resetForm(){serviceId.value='';name.value='';description.value='';category.value='';unit.value='unitat';price.value='';vat.value='21';irpf.value='0';editable.value='true';active.value='true';formTitle.textContent='Nou servei'}function render(){const s=load(),q=search.value.toLowerCase(),cat=categoryFilter.value;const cats=[...new Set(s.serviceCatalog.map(x=>x.category||'General'))].sort();categories.innerHTML=cats.map(x=>`<option value="${esc(x)}"></option>`).join('');categoryFilter.innerHTML='<option value="">Totes</option>'+cats.map(x=>`<option value="${esc(x)}" ${x===cat?'selected':''}>${esc(x)}</option>`).join('');const rows=s.serviceCatalog.filter(x=>(!cat||x.category===cat)&&(`${x.name} ${x.description}`.toLowerCase().includes(q)));serviceList.innerHTML=rows.length?rows.map(x=>`<div class="service"><div class="service-top"><div><strong>${esc(x.name)}</strong><small>${esc(x.description||'Sense descripció')}</small><small>${esc(x.category)} · ${esc(x.unit)} · IVA ${x.vatRate}% · IRPF ${x.irpfRate}%</small></div><div><span class="pill ${x.active?'':'off'}">${x.active?'Actiu':'Inactiu'}</span><br><strong style="margin-top:8px">${Number(x.unitPrice).toFixed(2)} €</strong></div></div><div class="service-actions"><button class="btn" onclick="editService('${x.id}')">Editar</button><button class="btn" onclick="duplicateService('${x.id}')">Duplicar</button><button class="btn" onclick="toggleService('${x.id}')">${x.active?'Desactivar':'Activar'}</button></div></div>`).join(''):'<div class="status">No hi ha serveis amb aquests filtres.</div>';mTotal.textContent=s.serviceCatalog.length;mActive.textContent=s.serviceCatalog.filter(x=>x.active!==false).length;mCategories.textContent=cats.length}function loadDemo(){const s=load();s.serviceCatalog=s.serviceCatalog.filter(x=>!String(x.id).startsWith('t25-'));s.serviceCatalog.push(normalize({id:'t25-1',name:'Primera consulta',description:'Sessió inicial d’anàlisi i orientació jurídica',category:'Consultes',unit:'sessio',unitPrice:90,vatRate:21,irpfRate:0,editable:true,active:true}),normalize({id:'t25-2',name:'Redacció de conveni regulador',description:'Preparació i revisió del conveni regulador',category:'Divorcis',unit:'document',unitPrice:450,vatRate:21,irpfRate:0,editable:false,active:true}),normalize({id:'t25-3',name:'Desplaçament',description:'Desplaçament professional fora del municipi',category:'Despeses',unit:'desplacament',unitPrice:45,vatRate:21,irpfRate:0,editable:true,active:true}));save(s)}function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();const a=normalize({id:'a',name:'Consulta',description:'Consulta jurídica',category:'Consultes',unit:'sessio',unitPrice:100,vatRate:21,irpfRate:0,editable:true,active:true});s.serviceCatalog=[a];ok('Build identificada',VERSION==='v0.2.1-dev.26'&&SUITE==='T-025');ok('Crear servei complet',a.name==='Consulta'&&a.description==='Consulta jurídica');ok('Categoria persistent',a.category==='Consultes');ok('Unitat persistent',a.unit==='sessio');ok('IVA i IRPF persistents',a.vatRate===21&&a.irpfRate===0);ok('Preu persistent',a.unitPrice===100);a.active=false;ok('Activar i desactivar',a.active===false);const copy=normalize({...a,id:'b',name:'Consulta (còpia)'});s.serviceCatalog.push(copy);ok('Duplicar servei',s.serviceCatalog.length===2&&copy.name.includes('còpia'));const found=s.serviceCatalog.filter(x=>`${x.name} ${x.description}`.toLowerCase().includes('jurídica'));ok('Cerca per descripció',found.length===2)}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="service"><div class="service-top"><strong>${t.name}</strong><span>${t.ok?'Correcte':'Error'}</span></div></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${VERSION} · ${SUITE}: ${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}render();runTests();</script></body></html>
