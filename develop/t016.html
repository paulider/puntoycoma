<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · T-016</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:860px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.status{padding:13px;border-radius:12px;background:var(--soft);line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.row{padding:12px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:4px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>END-TO-END CORE VALIDATION</small></div><div class="badges"><span class="badge">v0.2.1-dev.17</span><span class="badge">T-016</span><span class="badge">Schema v3</span><span class="badge">Full economic flow</span></div></header><main class="wrap"><section class="panel"><div class="head"><h2>Validació completa</h2><button class="btn primary" onclick="run()">Executar</button></div><div class="body"><div id="status" class="status">Preparant proves...</div></div></section><section class="panel"><div class="head"><h2>Resultats</h2></div><div id="results" class="body"></div></section></main><script>
const VERSION='v0.2.1-dev.17',SUITE='T-016',KEY='pyc_office_v2';
const empty=()=>({version:3,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[],cases:[],documents:[],activity:[],events:[],tasks:[],serviceCatalog:[],billableItems:[],provisions:[],payments:[],migrations:[]});
const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
function test(name,ok,detail=''){return{name,ok:Boolean(ok),detail}}
function render(items){results.innerHTML=items.map(t=>`<div class="row"><div><strong>${t.name}</strong>${t.detail?`<small>${t.detail}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const failed=items.filter(x=>!x.ok).length;status.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${items.length} proves han passat.`;status.className='status '+(failed?'bad':'ok')}
function run(){const original=localStorage.getItem(KEY),items=[];try{let s=empty();items.push(test('Build i schema identificats',VERSION==='v0.2.1-dev.17'&&SUITE==='T-016'&&s.version===3));s.clients=[{id:'c1',name:'Anna'},{id:'c2',name:'Marc'}];items.push(test('Crear clients',s.clients.length===2));s.cases=[{id:'e1',name:'Divorci',status:'obert',participants:[{clientId:'c1'},{clientId:'c2'}]}];items.push(test('Crear expedient amb participants',s.cases[0].participants.length===2));s.documents.push({id:'d1',caseId:'e1',type:'informatiu',title:'Conveni',base:400,status:'actiu'});items.push(test('Crear document',s.documents.some(d=>d.id==='d1')));s.serviceCatalog.push({id:'svc1',name:'Reunió',unitPrice:100,vatRate:21,irpfRate:0,active:true});s.billableItems.push({id:'b1',caseId:'e1',type:'servei',description:'Reunió',amount:100,status:'pendent',invoicedAmount:0,invoiceIds:[]});items.push(test('Crear servei i element facturable',s.serviceCatalog.length===1&&s.billableItems.length===1));s.provisions.push({id:'p1',caseId:'e1',clientId:'c1',requestedAmount:500,paidAmount:500,appliedAmount:0,availableAmount:500,status:'pagada',payments:[{id:'pp1',amount:500}]});items.push(test('Crear i pagar provisió',s.provisions[0].availableAmount===500));const lines=[{kind:'document',sourceDocumentId:'d1',description:'Conveni',quantity:1,unitPrice:400,subtotal:400,vatRate:21,irpfRate:0},{kind:'service',catalogItemId:'svc1',description:'Reunió',quantity:1,unitPrice:100,subtotal:100,vatRate:21,irpfRate:0}];const base=500,vat=105,total=605;const invoice={id:'f1',caseId:'e1',clientId:'c1',type:'factura',title:'Factura honoraris',number:'',status:'esborrany',lines,base,vat,irpf:0,total,provisionApplied:0,paidAmount:0};s.documents.push(invoice);items.push(test('Crear factura mixta',invoice.lines.length===2&&invoice.total===605));invoice.provisionApplied=500;invoice.amountDue=105;s.provisions[0].appliedAmount=500;s.provisions[0].availableAmount=0;s.provisions[0].status='aplicada';items.push(test('Aplicar provisió',invoice.amountDue===105&&s.provisions[0].availableAmount===0));invoice.number=`${s.settings.invoicePrefix}${String(s.settings.nextInvoiceNumber).padStart(3,'0')}`;s.settings.nextInvoiceNumber++;invoice.status='emesa';invoice.lockedAt=new Date().toISOString();items.push(test('Emetre i bloquejar factura',invoice.number==='F-2026-001'&&invoice.status==='emesa'&&!!invoice.lockedAt));invoice.payments=[{id:'pay1',amount:50}];invoice.paidAmount=50;invoice.amountDue=55;invoice.status='parcialment_cobrada';items.push(test('Registrar cobrament parcial',invoice.amountDue===55&&invoice.status==='parcialment_cobrada'));invoice.payments.push({id:'pay2',amount:55});invoice.paidAmount=105;invoice.amountDue=0;invoice.status='cobrada';items.push(test('Registrar cobrament final',invoice.amountDue===0&&invoice.status==='cobrada'));s.documents=s.documents.map(d=>d.id==='d1'?{...d,invoiceId:'f1'}:d);s.billableItems=s.billableItems.map(b=>b.id==='b1'?{...b,status:'facturat',invoicedAmount:100,invoiceIds:['f1']}:b);items.push(test('Relacions documentals correctes',s.documents.find(d=>d.id==='d1').invoiceId==='f1'&&s.billableItems[0].invoiceIds[0]==='f1'));s.activity.push({id:'a1',caseId:'e1',title:'Factura cobrada',body:'F-2026-001'});items.push(test('Cronologia registrada',s.activity.length===1));localStorage.setItem(KEY,JSON.stringify(s));const persisted=JSON.parse(localStorage.getItem(KEY));items.push(test('Persistència Schema v3',persisted.version===3&&persisted.provisions.length===1&&persisted.documents.length===2));const refsValid=persisted.cases.every(c=>c.participants.every(p=>persisted.clients.some(cl=>cl.id===p.clientId)))&&persisted.documents.every(d=>!d.caseId||persisted.cases.some(c=>c.id===d.caseId));items.push(test('Integritat referencial',refsValid));}catch(e){items.push(test('Execució de la suite',false,e.message))}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}items.push(test('Restaurar dades originals',localStorage.getItem(KEY)===original));render(items)}run();
</script></body></html>
