<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Billing Workspace</title><style>:root{--b:#6b1730;--gold:#b9a074;--p:#f7f4ee;--i:#282125;--m:#776d71;--l:#ddd5cf;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f0ebe4}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:1440px;margin:auto;padding:14px}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:14px;align-items:start}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,40,.04);margin-bottom:14px}.head{padding:14px 15px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 18px Georgia,serif}.body{padding:14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.search{margin-bottom:10px}.source{padding:10px 0;border-bottom:1px solid #eee7e2}.source:last-child{border-bottom:0}.source strong{display:block}.source small{display:block;color:var(--m);margin-top:3px}.source .btn{margin-top:8px}.line{display:grid;grid-template-columns:36px minmax(0,1fr) 70px 95px 66px 36px;gap:8px;padding:10px 0;border-bottom:1px solid #eee7e2;align-items:center}.drag{display:grid;gap:3px}.drag button{border:1px solid var(--l);background:#fff;border-radius:7px;padding:1px 0;font-size:12px}.line input{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.summary{background:var(--soft);border-radius:12px;padding:13px}.sumrow{display:flex;justify-content:space-between;padding:6px 0}.sumrow.total{font-weight:800;border-top:1px solid var(--l);margin-top:6px;padding-top:10px}.provision{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #eee7e2;align-items:center}.status{padding:11px;border-radius:11px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.a4{background:#fff;max-width:794px;min-height:1123px;margin:auto;padding:52px;border:1px solid var(--l);box-shadow:0 18px 50px rgba(40,25,30,.08)}.inv-top{display:flex;justify-content:space-between;gap:24px}.logo{font:500 24px Georgia,serif;letter-spacing:.12em}.logo small{display:block;font:10px sans-serif;letter-spacing:.25em;color:var(--gold);margin-top:6px}.title{text-align:right;letter-spacing:.25em;font-size:22px}.title small{display:block;color:var(--gold);letter-spacing:.12em;font-size:11px;margin-top:8px}.meta{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--l);padding-top:22px}.meta h4{font-size:10px;color:var(--gold);letter-spacing:.2em}.table{margin-top:30px}.thead,.trow{display:grid;grid-template-columns:1.5fr 2fr .5fr .9fr .9fr;gap:8px}.thead{background:var(--soft);padding:11px;font-size:10px;letter-spacing:.12em;font-weight:800}.trow{padding:12px 10px;border-bottom:1px solid var(--l);font-size:12px}.a4 .totals{margin-left:auto;margin-top:22px;max-width:330px}.note{margin-top:32px;border-left:3px solid var(--gold);padding-left:12px}.footer{margin-top:34px;background:var(--soft);padding:20px;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.a4{min-height:auto;padding:24px}.left{order:1}.center{order:2}.right{order:3}}@media(max-width:650px){.line{grid-template-columns:30px 1fr 58px 75px 52px 32px}.line .vat{display:none}.a4{padding:16px}.meta{grid-template-columns:1fr}.thead,.trow{grid-template-columns:1.5fr .5fr .9fr .9fr}.thead div:nth-child(2),.trow div:nth-child(2){display:none}.inv-top{flex-direction:column}.title{text-align:left}}@media print{body{background:#fff;padding:0}.top,.left,.right,.head,.nav,#testsPanel{display:none!important}.wrap,.workspace,.center,.panel,.body{padding:0;margin:0;border:0;box-shadow:none}.workspace{display:block}.a4{border:0;box-shadow:none;max-width:none;min-height:0;padding:18mm}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>BILLING WORKSPACE</small></div><div class="badges"><span class="badge">v0.2.1-dev.23</span><span class="badge">T-022</span><span class="badge">Schema v3</span><span class="badge">Professional composer</span></div></header><main class="wrap"><div class="workspace"><aside class="left"><section class="panel"><div class="head"><h2>Expedient</h2><button class="btn primary" onclick="loadDemo()">Demo</button></div><div class="body"><div class="field"><label>Expedient</label><select id="caseSelect" onchange="syncCase()"></select></div><div class="field"><label>Cerca</label><input id="sourceSearch" class="search" placeholder="Document o servei" oninput="renderSources()"></div></div></section><section class="panel"><div class="head"><h2>Documents pendents</h2></div><div id="documentSources" class="body"></div></section><section class="panel"><div class="head"><h2>Catàleg de serveis</h2></div><div id="serviceSources" class="body"></div></section></aside><section class="center"><div class="panel"><div class="head"><h2>Factura editable</h2><button class="btn" onclick="window.print()">Imprimir / PDF</button></div><div class="body"><div id="lines"></div><button class="btn" style="margin-top:12px" onclick="addManualLine()">+ Concepte manual</button></div></div><div class="panel"><div class="head"><h2>Vista A4</h2></div><div class="body"><div id="invoicePreview" class="a4"></div></div></div></section><aside class="right"><section class="panel"><div class="head"><h2>Destinatari</h2></div><div class="body"><div class="field"><label>Client</label><select id="recipientSelect" onchange="renderAll()"></select></div><div class="field"><label>Forma de pagament</label><select id="paymentMethod" onchange="renderAll()"><option>Transferència bancària</option><option>Domiciliació</option><option>Efectiu</option></select></div></div></section><section class="panel"><div class="head"><h2>Provisions</h2></div><div id="provisions" class="body"></div></section><section class="panel"><div class="head"><h2>Resum</h2></div><div class="body"><div id="economicSummary" class="summary"></div><div id="validation" class="status" style="margin-top:10px"></div><button class="btn primary full" style="margin-top:12px" onclick="emitInvoice()">Emetre factura</button></div></section><section id="testsPanel" class="panel"><div class="head"><h2>Diagnòstic · T-022</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></section></aside></div></main><nav class="nav"><button onclick="location.href='case-center-v19.html?build=v0.2.1-dev.23'">Expedient</button><button class="active">Facturació</button><button onclick="location.href='quality-center.html?build=v0.2.1-dev.23'">Qualitat</button></nav><script>const VERSION='v0.2.1-dev.23',SUITE='T-022',KEY='pyc_office_v2';let invoiceLines=[],selectedProvisions=new Set();const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:3,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1,name:'Julia Rico',phone:'649 766 012',email:'julia@pyc.legal',web:'www.puntoycoma.legal'},clients:[],cases:[],documents:[],activity:[],serviceCatalog:[],provisions:[],payments:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function currentCase(s=load()){return s.cases.find(c=>c.id===caseSelect.value)||s.cases[0]||null}function participants(s=load(),c=currentCase(s)){const ids=(c?.participants||[]).map(p=>p.clientId);return s.clients.filter(x=>ids.includes(x.id))}function calc(){const rows=invoiceLines.map(l=>({...l,subtotal:round(Number(l.qty||0)*Number(l.price||0))}));const base=round(rows.reduce((a,l)=>a+l.subtotal,0));const vat=round(rows.reduce((a,l)=>a+l.subtotal*Number(l.vat||0)/100,0));const irpf=round(rows.reduce((a,l)=>a+l.subtotal*Number(l.irpf||0)/100,0));const total=round(base+vat-irpf);const s=load(),c=currentCase(s);const provision=round(s.provisions.filter(p=>p.caseId===c?.id&&selectedProvisions.has(p.id)).reduce((a,p)=>a+(p.availableAmount||0),0));const applied=Math.min(total,provision);return{rows,base,vat,irpf,total,provision,applied,due:round(total-applied)}}function renderSelectors(){const s=load();caseSelect.innerHTML=s.cases.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const current=localStorage.getItem('pyc_current_case');if(current&&s.cases.some(c=>c.id===current))caseSelect.value=current;syncCase()}function syncCase(){selectedProvisions.clear();invoiceLines=[];const ps=participants();recipientSelect.innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');renderSources();renderAll()}function renderSources(){const s=load(),c=currentCase(s),q=sourceSearch.value.toLowerCase();const docs=s.documents.filter(d=>d.caseId===c?.id&&d.type!=='factura'&&!d.invoiceId&&(d.title||d.type||'').toLowerCase().includes(q));documentSources.innerHTML=docs.map(d=>`<div class="source"><strong>${esc(d.title||d.type)}</strong><small>${Number(d.billableAmount??d.base??0).toFixed(2)} €</small><button class="btn" onclick="addDocument('${d.id}')">Afegir</button></div>`).join('')||'<div class="status">No hi ha documents pendents.</div>';const services=(s.serviceCatalog||[]).filter(x=>x.active!==false&&(x.name||'').toLowerCase().includes(q));serviceSources.innerHTML=services.map(x=>`<div class="source"><strong>${esc(x.name)}</strong><small>${Number(x.unitPrice||0).toFixed(2)} €</small><button class="btn" onclick="addService('${x.id}')">Afegir</button></div>`).join('')||'<div class="status">No hi ha serveis.</div>'}function addDocument(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d)return;invoiceLines.push({id:uid(),kind:'document',sourceDocumentId:d.id,description:d.title||d.type,qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0});renderAll()}function addService(id){const s=load(),x=s.serviceCatalog.find(v=>v.id===id);if(!x)return;invoiceLines.push({id:uid(),kind:'service',catalogItemId:x.id,description:x.name,qty:1,price:Number(x.unitPrice||0),vat:Number(x.vatRate??21),irpf:Number(x.irpfRate??0)});renderAll()}function addManualLine(){invoiceLines.push({id:uid(),kind:'manual',description:'Nou concepte',qty:1,price:0,vat:21,irpf:0});renderAll()}function moveLine(i,delta){const j=i+delta;if(j<0||j>=invoiceLines.length)return;[invoiceLines[i],invoiceLines[j]]=[invoiceLines[j],invoiceLines[i]];renderAll()}function renderLines(){lines.innerHTML=invoiceLines.map((l,i)=>`<div class="line"><div class="drag"><button onclick="moveLine(${i},-1)">↑</button><button onclick="moveLine(${i},1)">↓</button></div><input value="${esc(l.description)}" oninput="invoiceLines[${i}].description=this.value;renderAll()"><input type="number" step="0.01" value="${l.qty}" oninput="invoiceLines[${i}].qty=Number(this.value);renderAll()"><input type="number" step="0.01" value="${l.price}" oninput="invoiceLines[${i}].price=Number(this.value);renderAll()"><input class="vat" type="number" step="0.01" value="${l.vat}" oninput="invoiceLines[${i}].vat=Number(this.value);renderAll()"><button class="btn" onclick="invoiceLines.splice(${i},1);renderAll()">×</button></div>`).join('')||'<div class="status">Arrossega conceptualment afegint documents o serveis des de l’esquerra.</div>'}function renderProvisions(){const s=load(),c=currentCase(s),ps=s.provisions.filter(p=>p.caseId===c?.id&&p.availableAmount>0);provisions.innerHTML=ps.map(p=>`<label class="provision"><input type="checkbox" ${selectedProvisions.has(p.id)?'checked':''} onchange="this.checked?selectedProvisions.add('${p.id}'):selectedProvisions.delete('${p.id}');renderAll()"><span><strong>${esc(p.title||'Provisió')}</strong><small>${esc(s.clients.find(x=>x.id===p.clientId)?.name||'Expedient')}</small></span><strong>${Number(p.availableAmount).toFixed(2)} €</strong></label>`).join('')||'<div class="status">No hi ha saldo disponible.</div>'}function renderSummary(){const t=calc();economicSummary.innerHTML=`<div class="sumrow"><span>Base</span><strong>${t.base.toFixed(2)} €</strong></div><div class="sumrow"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div>${t.irpf?`<div class="sumrow"><span>IRPF</span><strong>−${t.irpf.toFixed(2)} €</strong></div>`:''}<div class="sumrow"><span>Provisió aplicada</span><strong>−${t.applied.toFixed(2)} €</strong></div><div class="sumrow total"><span>Pendent</span><strong>${t.due.toFixed(2)} €</strong></div>`;const valid=invoiceLines.length>0&&t.base>0&&recipientSelect.value;validation.textContent=valid?'Factura preparada per revisar i emetre.':'Cal destinatari i almenys una línia amb import.';validation.className='status '+(valid?'ok':'bad')}function renderPreview(){const s=load(),c=currentCase(s),cl=s.clients.find(x=>x.id===recipientSelect.value),t=calc(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(s.settings.nextInvoiceNumber||1).padStart(3,'0')}`;invoicePreview.innerHTML=`<div class="inv-top"><div class="logo">PUNTO Y COMA<small>LEGAL</small></div><div class="title">FACTURA<small>N.º ${esc(number)}</small></div></div><div class="meta"><div><h4>DE</h4><strong>${esc(s.settings.name||'Julia Rico')}</strong><div>${esc(s.settings.phone||'')}</div><div>${esc(s.settings.email||'')}</div><div>${esc(s.settings.web||'')}</div></div><div><h4>PER A</h4><strong>${esc(cl?.name||'Client')}</strong><div>${esc(c?.name||'')}</div><div>${new Date().toLocaleDateString('ca-ES')}</div><div>${esc(paymentMethod.value)}</div></div></div><div class="table"><div class="thead"><div>CONCEPTE</div><div>DESCRIPCIÓ</div><div>CANT.</div><div>PREU UNIT.</div><div>IMPORT</div></div>${t.rows.map(l=>`<div class="trow"><div>${esc(l.kind==='document'?'Document':l.kind==='service'?'Servei':'Concepte')}</div><div>${esc(l.description)}</div><div>${l.qty}</div><div>${l.price.toFixed(2)} €</div><div>${l.subtotal.toFixed(2)} €</div></div>`).join('')}</div><div class="totals"><div class="sumrow"><span>Base imposable</span><strong>${t.base.toFixed(2)} €</strong></div><div class="sumrow"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div>${t.applied?`<div class="sumrow"><span>Provisió aplicada</span><strong>−${t.applied.toFixed(2)} €</strong></div>`:''}<div class="sumrow total"><span>TOTAL PENDENT</span><strong>${t.due.toFixed(2)} €</strong></div></div><div class="note"><strong>NOTA</strong><div>Gràcies per confiar en els nostres serveis. Quedem a la seva disposició per a qualsevol consulta.</div></div><div class="footer"><strong>PUNTO Y COMA LEGAL</strong><div>${esc(s.settings.email||'')} · ${esc(s.settings.phone||'')}</div><div>${esc(s.settings.web||'')}</div></div>`}function renderAll(){renderLines();renderProvisions();renderSummary();renderPreview()}function emitInvoice(){const s=load(),c=currentCase(s),t=calc();if(!c||!recipientSelect.value||!invoiceLines.length||t.base<=0)return alert('Completa la factura.');const seq=Number(s.settings.nextInvoiceNumber||1),id=uid(),number=`${s.settings.invoicePrefix||'F-2026-'}${String(seq).padStart(3,'0')}`;const inv={id,caseId:c.id,clientId:recipientSelect.value,type:'factura',title:'Factura honoraris',number,status:'emesa',lines:t.rows,base:t.base,vat:t.vat,irpf:t.irpf,total:t.total,provisionApplied:t.applied,amountDue:t.due,paidAmount:0,issueDate:new Date().toISOString().slice(0,10),paymentMethod:paymentMethod.value};s.settings.nextInvoiceNumber=seq+1;s.documents=s.documents.map(d=>t.rows.some(l=>l.sourceDocumentId===d.id)?{...d,invoiceId:id}:d);s.documents.push(inv);let remaining=t.applied;s.provisions=s.provisions.map(p=>{if(!selectedProvisions.has(p.id)||remaining<=0)return p;const use=Math.min(p.availableAmount,remaining);remaining=round(remaining-use);return{...p,availableAmount:round(p.availableAmount-use),appliedAmount:round((p.appliedAmount||0)+use),status:p.availableAmount-use<=0?'aplicada':p.status}});s.activity.push({id:uid(),caseId:c.id,title:'Factura emesa',body:number,date:inv.issueDate});save(s);invoiceLines=[];selectedProvisions.clear();renderSources();renderAll();alert(`Factura ${number} emesa.`)}function loadDemo(){const s=load();s.clients=s.clients.filter(c=>!['t22-a','t22-b'].includes(c.id));s.cases=s.cases.filter(c=>c.id!=='t22-case');s.documents=s.documents.filter(d=>d.caseId!=='t22-case');s.provisions=s.provisions.filter(p=>p.caseId!=='t22-case');s.clients.push({id:'t22-a',name:'Anna Garcia'},{id:'t22-b',name:'Marc Pérez'});s.cases.push({id:'t22-case',name:'Divorci Garcia - Pérez',participants:[{clientId:'t22-a'},{clientId:'t22-b'}]});s.documents.push({id:'t22-d1',caseId:'t22-case',type:'informatiu',title:'Conveni regulador',billableAmount:450},{id:'t22-d2',caseId:'t22-case',type:'informatiu',title:'Informe patrimonial',billableAmount:300});s.serviceCatalog=[...(s.serviceCatalog||[]),{id:'t22-s1',name:'Reunió jurídica',unitPrice:120,vatRate:21,irpfRate:0,active:true},{id:'t22-s2',name:'Desplaçament',unitPrice:45,vatRate:21,irpfRate:0,active:true}];s.provisions.push({id:'t22-p1',caseId:'t22-case',clientId:'t22-a',title:'Provisió inicial',availableAmount:300,appliedAmount:0,status:'pagada'},{id:'t22-p2',caseId:'t22-case',clientId:'t22-b',title:'Segona provisió',availableAmount:200,appliedAmount:0,status:'pagada'});localStorage.setItem('pyc_current_case','t22-case');save(s);renderSelectors()}function runTests(){const original=localStorage.getItem(KEY),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'}]}];s.documents=[{id:'d',caseId:'e',type:'informatiu',title:'Doc',billableAmount:400}];s.serviceCatalog=[{id:'sv',name:'Servei',unitPrice:100,vatRate:21,irpfRate:0,active:true}];s.provisions=[{id:'p1',caseId:'e',availableAmount:200},{id:'p2',caseId:'e',availableAmount:100}];localStorage.setItem(KEY,JSON.stringify(s));caseSelect.innerHTML='<option value="e">Cas</option>';caseSelect.value='e';recipientSelect.innerHTML='<option value="a">Anna</option>';recipientSelect.value='a';invoiceLines=[{id:'1',kind:'document',sourceDocumentId:'d',description:'Doc',qty:1,price:400,vat:21,irpf:0},{id:'2',kind:'service',catalogItemId:'sv',description:'Servei',qty:1,price:100,vat:21,irpf:0}];selectedProvisions=new Set(['p1','p2']);const t=calc();ok('Build identificada',VERSION==='v0.2.1-dev.23'&&SUITE==='T-022');ok('Composer mixt',t.rows.length===2);ok('Càlcul base',t.base===500);ok('Càlcul IVA',t.vat===105);ok('Selecció múltiple de provisions',t.provision===300);ok('Pendent correcte',t.due===305);moveLine(1,-1);ok('Reordenació de línies',invoiceLines[0].id==='2');addManualLine();ok('Concepte manual',invoiceLines.at(-1).kind==='manual');ok('Vista imprimible',typeof window.print==='function')}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original)}ok('Restaurar dades',localStorage.getItem(KEY)===original);invoiceLines=[];selectedProvisions.clear();renderSelectors();renderAll();testResults.innerHTML=tests.map(t=>`<div class="sumrow"><strong>${t.name}</strong><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${VERSION} · ${SUITE}: ${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}renderSelectors();renderAll();runTests();</script></body></html>
