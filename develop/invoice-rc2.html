<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><meta http-equiv="Cache-Control" content="no-store"><title>Punto y Coma · Factura RC2</title><style>:root{--b:#6b1730;--bg:#faf8f3;--ink:#282125;--muted:#776d71;--line:#ded6d1;--soft:#f2ece7;--ok:#2f6f4e;--err:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:24px}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font:500 14px Georgia,serif;letter-spacing:.08em}.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}.wrap{max-width:1100px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line)}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:14px}.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field label,.mini{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select,.line input,.line select,.payer input,.payer select{width:100%;min-height:44px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.line{display:grid;grid-template-columns:minmax(180px,1fr) 100px 88px 88px 74px 74px 44px;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid #eee7e2}.line-main{display:grid;gap:6px}.payer{display:grid;grid-template-columns:32px minmax(0,1fr) 120px 110px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid #eee7e2}.payer small{display:block;color:var(--muted)}.payer-total{font-weight:800;padding-bottom:12px;text-align:right}.summary div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee7e2}.summary .grand{margin-top:8px;padding:13px;border:0;border-radius:10px;background:var(--soft);color:var(--b);font-size:19px}.status{padding:11px;border-radius:11px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.err{background:#fff0f2;color:var(--err)}.identity{font-size:12px;line-height:1.5;background:var(--soft);padding:11px;border-radius:11px;margin-top:10px}.pdfrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line-main{grid-column:1/-1}.payer{grid-template-columns:32px minmax(0,1fr)}.payer .mode,.payer .value,.payer-total{grid-column:2}.payer-total{text-align:left;padding-bottom:4px}}@media(max-width:560px){.head{align-items:flex-start;flex-direction:column}.toolbar{display:grid;grid-template-columns:1fr 1fr;width:100%}.toolbar .btn{width:100%}.brand{font-size:12px}}</style></head><body><header class="top"><div class="toprow"><button id="back" class="btn ghost">← Tornar</button><div class="brand">PUNTO Y COMA · RC2</div><button id="saveTop" class="btn ghost">Desar</button></div></header><main class="wrap"><div class="grid"><section><div class="panel"><div class="head"><h2>Factura</h2><div class="toolbar"><button id="newBtn" class="btn">Nova</button><button id="saveBtn" class="btn primary">Desar</button><button id="generalPdf" class="btn">PDF general</button></div></div><div class="body"><div class="fields"><div class="field"><label>Expedient</label><select id="case"></select></div><div class="field"><label>Estat</label><select id="statusSel"><option value="esborrany">Esborrany</option><option value="emesa">Emesa</option><option value="pagada">Pagada</option></select></div><div class="field"><label>Idioma</label><select id="lang"><option value="ca">Català</option><option value="es">Castellano</option><option value="en">English</option></select></div></div><div id="issuer" class="identity"></div><div id="status" class="status">Preparat.</div></div></div><div class="panel"><div class="head"><h2>Línies</h2><button id="addLine" class="btn">+ Línia</button></div><div class="body"><div id="lines"></div></div></div><div class="panel"><div class="head"><h2>Repartiment</h2><button id="equal" class="btn">Parts iguals</button></div><div class="body"><div id="payers"></div><div id="allocationStatus" class="status"></div><div class="pdfrow"><select id="payerSelect"></select><button id="payerPdf" class="btn primary">PDF client</button></div></div></div></section><aside><div class="panel"><div class="head"><h2>Resum</h2></div><div class="body"><div id="summary" class="summary"></div></div></div></aside></div></main><script src="invoice-engine-v001.js?v=rc2"></script><script src="invoice-store-v001.js?v=rc2"></script><script src="invoice-renderer-v001.js?v=rc2"></script><script>(()=>{'use strict';const KEY='pyc_office_v2',DRAFT='pyc_invoice_rc2_draft';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const engine=window.PYCInvoiceEngine,renderer=window.PYCInvoiceRenderer;const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{},clients:[],cases:[],documents:[]}}catch{return{settings:{},clients:[],cases:[],documents:[]}}};let draft={invoiceId:null,caseId:'',status:'esborrany',language:'ca',lines:[{id:uid(),concept:'',description:'',qty:1,price:0,vat:21,discount:0}],allocations:[]};try{Object.assign(draft,JSON.parse(localStorage.getItem(DRAFT)||'null')||{})}catch{}const persist=()=>localStorage.setItem(DRAFT,JSON.stringify(draft));function matterClients(state,matter){const ids=[];if(matter?.clientId)ids.push(matter.clientId);(matter?.participants||[]).forEach(p=>ids.push(typeof p==='string'?p:(p.clientId||p.id)));return[...new Set(ids.filter(Boolean))].map(id=>state.clients.find(c=>c.id===id)).filter(Boolean)}function syncAllocations(){const s=load(),m=s.cases.find(c=>c.id===draft.caseId),clients=matterClients(s,m),old=new Map(draft.allocations.map(a=>[a.clientId,a]));draft.allocations=clients.map((c,i)=>old.get(c.id)||{clientId:c.id,enabled:i===0,mode:'percent',value:i===0?100:0});persist()}function calc(){return engine.calculateInvoice(draft.lines)}function alloc(){return engine.calculateAllocations(calc().total,draft.allocations)}function issuerText(){const d=renderer.issuerData(load().settings||{});return`${d.name} · ${d.tax} · ${d.address} · ${d.email} · ${d.iban}`}function setStatus(text,type=''){$('status').className='status'+(type?' '+type:'');$('status').textContent=text}function renderAll(){const s=load();if(!draft.caseId)draft.caseId=s.cases[0]?.id||'';$('case').innerHTML=s.cases.map(c=>`<option value="${c.id}" ${c.id===draft.caseId?'selected':''}>${esc(c.name||c.code||'Expedient')}</option>`).join('')||'<option value="">Sense expedients</option>';$('statusSel').value=draft.status;$('lang').value=draft.language;$('issuer').textContent='Emissor: '+issuerText();$('lines').innerHTML=draft.lines.map(lineHtml).join('');renderPayers();updateSummary();persist()}function lineHtml(l){const cell=(label,f,v)=>`<div><label class="mini">${label}</label><input data-field="${f}" type="text" inputmode="decimal" autocomplete="off" value="${esc(v)}"></div>`;return`<div class="line" data-id="${l.id}"><div class="line-main"><input data-field="concept" value="${esc(l.concept)}" placeholder="Concepte"><input data-field="description" value="${esc(l.description||'')}" placeholder="Descripció"></div>${cell('Quant.','qty',l.qty)}${cell('Preu','price',l.price)}${cell('IVA %','vat',l.vat)}${cell('Desc. %','discount',l.discount)}<button class="btn" data-del="${l.id}">×</button></div>`}function renderPayers(){const s=load(),rows=alloc().rows;$('payers').innerHTML=rows.length?rows.map(r=>{const c=s.clients.find(x=>x.id===r.clientId)||{};return`<div class="payer" data-payer="${r.clientId}"><input type="checkbox" data-enabled ${r.enabled===false?'':'checked'}><div><strong>${esc(c.name||'Client')}</strong><small>${esc([c.tax||c.nif||'',c.address||''].filter(Boolean).join(' · '))}</small></div><div class="mode"><label class="mini">Mètode</label><select data-mode><option value="percent" ${r.mode==='percent'?'selected':''}>Percentatge</option><option value="amount" ${r.mode==='amount'?'selected':''}>Import</option></select></div><div class="value"><label class="mini">Valor</label><input data-value type="text" inputmode="decimal" autocomplete="off" value="${esc(r.value)}"></div><div class="payer-total">${r.amount.toFixed(2)} €</div></div>`}).join(''):'<div class="status err">No hi ha clients participants.</div>';$('payerSelect').innerHTML=rows.filter(r=>r.enabled!==false).map(r=>{const c=s.clients.find(x=>x.id===r.clientId)||{};return`<option value="${r.clientId}">${esc(c.name||'Client')} · ${r.amount.toFixed(2)} €</option>`}).join('')||'<option value="">Sense client</option>';updateAllocationStatus()}function updatePayerAmounts(){const rows=alloc().rows;rows.forEach(r=>{const el=document.querySelector(`[data-payer="${CSS.escape(r.clientId)}"] .payer-total`);if(el)el.textContent=r.amount.toFixed(2)+' €'});updateAllocationStatus()}function updateAllocationStatus(){const a=alloc();$('allocationStatus').className='status '+(a.valid?'ok':'err');$('allocationStatus').textContent=a.valid?`Correcte: ${a.assigned.toFixed(2)} €`:`Diferència: ${a.delta.toFixed(2)} €`}function updateSummary(){const t=calc();$('summary').innerHTML=`<div><span>Base</span><strong>${t.base.toFixed(2)} €</strong></div><div><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div><div class="grand"><span>Total</span><strong>${t.total.toFixed(2)} €</strong></div>`;updatePayerAmounts()}function saveInvoice(){draft.caseId=$('case').value;draft.status=$('statusSel').value;draft.language=$('lang').value;const validation=engine.validateInvoice(draft);if(!validation.valid){setStatus('No es pot desar: '+validation.errors.join(', '),'err');return false}const s=load();let inv=draft.invoiceId?(s.documents||[]).find(d=>d.id===draft.invoiceId):null;if(!inv){const n=Number(s.settings?.nextInvoiceNumber||1);inv={id:uid(),type:'factura',number:`${s.settings?.invoicePrefix||'F-2026-'}${String(n).padStart(3,'0')}`,createdAt:new Date().toISOString()};s.settings=s.settings||{};s.settings.nextInvoiceNumber=n+1;s.documents=s.documents||[];s.documents.push(inv)}Object.assign(inv,{caseId:draft.caseId,status:draft.status,language:draft.language,lines:validation.totals.lines.map(l=>({...l,vat:l.vatRate})),allocations:validation.allocation.rows.filter(r=>r.enabled!==false),base:validation.totals.base,vat:validation.totals.vat,total:validation.totals.total,updatedAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(s));draft.invoiceId=inv.id;persist();setStatus(`Desada ${inv.number}`,'ok');return inv}function openPdf(clientId=''){const inv=saveInvoice();if(!inv)return;const s=load(),matter=s.cases.find(c=>c.id===inv.caseId);if(!renderer.open(inv,{settings:s.settings,clients:s.clients,matter},clientId))setStatus('Safari ha bloquejat la finestra.','err')}document.addEventListener('input',e=>{const line=e.target.closest('.line');if(line&&e.target.dataset.field){const item=draft.lines.find(x=>x.id===line.dataset.id);if(item)item[e.target.dataset.field]=e.target.value;persist();updateSummary()}const payer=e.target.closest('.payer');if(payer&&e.target.hasAttribute('data-value')){const item=draft.allocations.find(x=>x.clientId===payer.dataset.payer);if(item)item.value=e.target.value;persist();updatePayerAmounts()}});document.addEventListener('change',e=>{if(e.target.id==='case'){draft.caseId=e.target.value;syncAllocations();renderAll()}if(e.target.id==='statusSel')draft.status=e.target.value;if(e.target.id==='lang')draft.language=e.target.value;const payer=e.target.closest('.payer');if(payer){const item=draft.allocations.find(x=>x.clientId===payer.dataset.payer);if(item){if(e.target.hasAttribute('data-enabled'))item.enabled=e.target.checked;if(e.target.hasAttribute('data-mode'))item.mode=e.target.value;persist();renderPayers()}}});document.addEventListener('click',e=>{if(e.target.dataset.del){draft.lines=draft.lines.filter(l=>l.id!==e.target.dataset.del);if(!draft.lines.length)draft.lines.push({id:uid(),concept:'',description:'',qty:1,price:0,vat:21,discount:0});renderAll()}});$('addLine').onclick=()=>{draft.lines.push({id:uid(),concept:'',description:'',qty:1,price:0,vat:21,discount:0});renderAll()};$('equal').onclick=()=>{draft.allocations=engine.equalSplit(draft.allocations);renderPayers();persist()};$('saveBtn').onclick=saveInvoice;$('saveTop').onclick=saveInvoice;$('generalPdf').onclick=()=>openPdf('');$('payerPdf').onclick=()=>openPdf($('payerSelect').value);$('newBtn').onclick=()=>{draft={invoiceId:null,caseId:$('case').value,status:'esborrany',language:'ca',lines:[{id:uid(),concept:'',description:'',qty:1,price:0,vat:21,discount:0}],allocations:[]};syncAllocations();renderAll()};$('back').onclick=()=>location.href='rc1-app-fixed.html';syncAllocations();renderAll()})();</script></body></html>
