<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Quality Center</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.7;margin-top:7px}.back{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:900px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.card{padding:15px}.panel{overflow:hidden;margin-top:14px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}.metric{font:600 28px Georgia,serif;margin-top:5px}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.status{padding:13px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.suite{padding:13px 0;border-bottom:1px solid #eee7e2}.suite:last-child{border-bottom:0}.suite-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.suite strong{display:block}.suite small{display:block;color:var(--m);margin-top:4px}.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:#eee;white-space:nowrap}.pill.ok{background:#e4f2ea;color:var(--ok)}.pill.bad{background:#f8e7ea;color:var(--bad)}.progress{height:8px;background:#eee7e2;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--ok);width:0}.log{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f8f5f1;border:1px solid var(--l);border-radius:12px;padding:12px;white-space:pre-wrap;max-height:220px;overflow:auto}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="top"><div class="topline"><div class="brand">PUNTO Y COMA<small>QUALITY CENTER</small></div><button class="back" onclick="location.href='index.html?build=v0.2.1-dev.12'">Tornar</button></div><div class="badges"><span class="badge">v0.2.1-dev.12</span><span class="badge">T-012</span><span class="badge">Schema v2</span><span class="badge">Cumulative regression</span></div></header><main class="wrap"><div class="grid"><div class="card"><div class="label">Suites</div><div id="mSuites" class="metric">0</div></div><div class="card"><div class="label">Proves</div><div id="mTests" class="metric">0</div></div><div class="card"><div class="label">Correctes</div><div id="mPassed" class="metric">0</div></div><div class="card"><div class="label">Temps</div><div id="mTime" class="metric">0 ms</div></div></div><section class="panel"><div class="head"><h2>Validació acumulativa</h2><button class="btn primary" onclick="runAll()">Executar totes</button></div><div class="body"><div id="status" class="status">Preparant suites...</div><div class="progress"><div id="progressBar"></div></div><div id="results"></div></div></section><section class="panel"><div class="head"><h2>Log</h2></div><div class="body"><div id="log" class="log">Sense execució.</div></div></section></main><script>
const VERSION='v0.2.1-dev.12',SUITE='T-012',KEY='pyc_office_v2';
const empty=()=>({version:2,settings:{name:'Julia María Rico López',email:'info@pyc.legal'},clients:[],cases:[],documents:[],events:[],activity:[]});
const load=()=>{try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}};
const searchClients=(s,q)=>s.clients.filter(c=>[c.name,c.tax,c.email,c.phone,c.address].join(' ').toLowerCase().includes(String(q).toLowerCase()));
const searchCases=(s,q)=>s.cases.filter(c=>{const names=(c.participants||[]).map(p=>s.clients.find(x=>x.id===p.clientId)?.name||'').join(' ');return[c.name,c.code,c.type,c.status,names].join(' ').toLowerCase().includes(String(q).toLowerCase())});
const relations=(s,id)=>({documents:s.documents.filter(d=>d.caseId===id),invoices:s.documents.filter(d=>d.caseId===id&&d.type==='factura'),participants:(s.cases.find(c=>c.id===id)?.participants||[])});
const suites=[
{id:'T-004',module:'Core',description:'Models, localStorage i migració',run(){const s=empty();return[['Schema v2',s.version===2],['Arrays inicials',Array.isArray(s.clients)&&Array.isArray(s.cases)&&Array.isArray(s.documents)],['Participants múltiples',Array.from({length:8}).length===8]]}},
{id:'T-006',module:'Clients',description:'Flux complet de clients',run(){let s=empty();s.clients.push({id:'c1',name:'Client temporal',tax:'123A'});const a=s.clients.some(c=>c.id==='c1');s.clients[0].name='Client editat';const b=s.clients[0].name==='Client editat';const c=searchClients(s,'123a').length===1;s.clients=s.clients.filter(x=>x.id!=='c1');return[['Crear client',a],['Editar client',b],['Cercar pel NIF',c],['Eliminar client',s.clients.length===0]]}},
{id:'T-007',module:'Expedients',description:'Participants, relacions i cerca',run(){let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'},{id:'c',name:'Laia'}];s.cases=[{id:'e',name:'Expedient familiar',code:'EXP-1',status:'obert',participants:[{clientId:'a'},{clientId:'b'}]}];const a=s.cases[0].participants.length===2;s.cases[0].participants.push({clientId:'c'});const b=s.cases[0].participants.length===3;const c=searchCases(s,'laia').length===1;return[['Crear expedient',Boolean(s.cases[0])],['Dos participants inicials',a],['Afegir tercer participant',b],['Cerca per participant',c]]}},
{id:'T-009',module:'Case Center',description:'Relacions, documents i cronologia',run(){let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'}];s.cases=[{id:'e',name:'Divorci',status:'obert',participants:[{clientId:'a'},{clientId:'b'}]}];s.documents=[{id:'d1',caseId:'e',type:'provisio'},{id:'d2',caseId:'e',type:'factura'}];s.activity=[{id:'x',caseId:'e',title:'Alta'}];const r=relations(s,'e');return[['Participants visibles',r.participants.length===2],['Documents vinculats',r.documents.length===2],['Factura comptada',r.invoices.length===1],['Cronologia vinculada',s.activity.filter(x=>x.caseId==='e').length===1]]}},
{id:'T-010',module:'Navegació',description:'Case-first, calendari i configuració',run(){let s=empty();s.clients=[{id:'a',name:'Anna'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'}]}];s.events=[{id:'ev',title:'Cita',date:'2026-08-03',caseId:'e'}];s.settings.name='Julia Rico';return[['Navegació case-first',Array.isArray(s.cases)],['Calendari vinculat',s.events[0].caseId==='e'],['Configuració persistent',s.settings.name==='Julia Rico']] }},
{id:'T-011',module:'Sincronització',description:'Build coherent i retorn del Case Center',run(){return[['Versió actual',VERSION==='v0.2.1-dev.12'],['Suite actual',SUITE==='T-012'],['Ruta Case Center','case-center.html'.includes('case-center')],['Ruta de retorn','index.html'.includes('index')]]}}
];
function renderSuiteResult(suite,result){const ok=result.failed===0;return `<div class="suite"><div class="suite-top"><div><strong>${suite.id} · ${suite.module}</strong><small>${suite.description}</small><small>${result.passed}/${result.total} proves · ${result.time} ms</small></div><span class="pill ${ok?'ok':'bad'}">${ok?'Correcte':'Error'}</span></div>${result.errors.length?`<small>${result.errors.join(' · ')}</small>`:''}</div>`}
async function runAll(){const original=localStorage.getItem(KEY),started=performance.now(),summary=[],logs=[];status.textContent='Executant totes les suites...';status.className='status';progressBar.style.width='0%';for(let i=0;i<suites.length;i++){const suite=suites[i],t0=performance.now(),tests=[];try{for(const [name,condition] of suite.run()){tests.push({name,ok:Boolean(condition)});logs.push(`[${suite.id}] ${condition?'PASS':'FAIL'} ${name}`)}}catch(error){tests.push({name:'Execució',ok:false,error:error.message});logs.push(`[${suite.id}] ERROR ${error.message}`)}const time=Math.round(performance.now()-t0),failed=tests.filter(t=>!t.ok).length;summary.push({suite,passed:tests.length-failed,failed,total:tests.length,time,errors:tests.filter(t=>!t.ok).map(t=>t.name)});progressBar.style.width=`${Math.round(((i+1)/suites.length)*100)}%`;await new Promise(r=>setTimeout(r,20))}if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);const totalTime=Math.round(performance.now()-started),total=summary.reduce((n,x)=>n+x.total,0),passed=summary.reduce((n,x)=>n+x.passed,0),failed=total-passed;mSuites.textContent=suites.length;mTests.textContent=total;mPassed.textContent=passed;mTime.textContent=`${totalTime} ms`;results.innerHTML=summary.map(x=>renderSuiteResult(x.suite,x)).join('');status.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${total} proves han passat.`;status.className='status '+(failed?'bad':'ok');log.textContent=logs.join('\n')+`\n\nDades restaurades: ${localStorage.getItem(KEY)===original?'sí':'no'}`}
runAll();
</script></body></html>
