<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Carregant facturació...</title><style>body{margin:0;background:#f7f4ee;color:#282125;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.box{text-align:center;padding:28px}.box strong{display:block;font:500 24px Georgia,serif;margin-bottom:10px}.box span{color:#776d71}</style></head><body><div class="box"><strong>PUNTO Y COMA</strong><span>Carregant v0.2.1-dev.28...</span></div><script>(async()=>{try{const response=await fetch('invoice-t026.html?source=v0.2.1-dev.27&cache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!response.ok)throw new Error('HTTP '+response.status);let html=await response.text();html=html.replaceAll('v0.2.1-dev.27','v0.2.1-dev.28').replaceAll('T-026','T-027').replace('Grouped professional composer','Editable manual groups');const enhancement=`<style>
.group-manager{display:grid;gap:10px;margin-top:14px}.group-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff}.group-row input[type=text]{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.bulk-bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:12px 0}.bulk-bar select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.line-select{display:flex;align-items:center;justify-content:center}.line{grid-template-columns:28px 36px minmax(0,1fr) 90px 72px 95px 66px 78px}.group-name{font-weight:800}.group-summary input{border:0;background:transparent;font-weight:800;min-width:0;width:70%;padding:0}.group-summary button{margin-left:8px}@media(max-width:650px){.line{grid-template-columns:24px 30px minmax(0,1fr) 82px 60px 34px}.line .vat,.line .discount,.line .dup{display:none}.bulk-bar{grid-template-columns:1fr}.group-row{grid-template-columns:24px minmax(0,1fr)}}
</style><script>
let invoiceGroups=[{id:'g-honoraris',name:'Honoraris',order:0},{id:'g-serveis',name:'Serveis',order:1},{id:'g-despeses',name:'Despeses',order:2},{id:'g-suplerts',name:'Suplerts',order:3},{id:'g-altres',name:'Altres',order:4}],selectedLineIds=new Set();
function ensureGroups(){const known=new Map(invoiceGroups.map(g=>[g.name,g]));invoiceLines.forEach(l=>{ensureLineMeta(l);if(!known.has(l.group)){const g={id:'g-'+uid(),name:l.group,order:invoiceGroups.length};invoiceGroups.push(g);known.set(g.name,g)}})}
function createGroup(){const name=prompt('Nom del nou grup');if(!name||!name.trim())return;if(invoiceGroups.some(g=>g.name.toLowerCase()===name.trim().toLowerCase()))return alert('Aquest grup ja existeix.');invoiceGroups.push({id:'g-'+uid(),name:name.trim(),order:invoiceGroups.length});renderAll()}
function renameGroup(id,value){const g=invoiceGroups.find(x=>x.id===id);if(!g)return;const old=g.name,newName=value.trim();if(!newName||invoiceGroups.some(x=>x.id!==id&&x.name.toLowerCase()===newName.toLowerCase())){renderAll();return alert('Nom de grup no vàlid o duplicat.')}g.name=newName;invoiceLines.forEach(l=>{if(l.group===old)l.group=newName});renderAll()}
function deleteGroup(id){const g=invoiceGroups.find(x=>x.id===id);if(!g)return;const used=invoiceLines.some(l=>l.group===g.name);if(used)return alert('Mou primer les línies d’aquest grup.');invoiceGroups=invoiceGroups.filter(x=>x.id!==id).map((x,i)=>({...x,order:i}));renderAll()}
function moveGroup(id,delta){const i=invoiceGroups.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=invoiceGroups.length)return;[invoiceGroups[i],invoiceGroups[j]]=[invoiceGroups[j],invoiceGroups[i]];invoiceGroups.forEach((g,k)=>g.order=k);renderAll()}
function toggleLineSelection(id,checked){checked?selectedLineIds.add(id):selectedLineIds.delete(id);renderBulkBar()}
function applyGroupToSelected(){const name=document.getElementById('bulkGroupSelect')?.value;if(!name||!selectedLineIds.size)return alert('Selecciona línies i grup.');invoiceLines.forEach(l=>{if(selectedLineIds.has(l.id))l.group=name});selectedLineIds.clear();renderAll()}
function selectAllLines(){invoiceLines.forEach(l=>selectedLineIds.add(l.id));renderAll()}
function clearSelection(){selectedLineIds.clear();renderAll()}
function renderBulkBar(){const target=document.getElementById('bulkControls');if(!target)return;target.innerHTML=\`<div class="bulk-bar"><select id="bulkGroupSelect">\${invoiceGroups.sort((a,b)=>a.order-b.order).map(g=>\`<option>\${esc(g.name)}</option>\`).join('')}</select><button class="btn" onclick="applyGroupToSelected()">Assignar grup (\${selectedLineIds.size})</button><button class="btn" onclick="selectedLineIds.size?clearSelection():selectAllLines()">\${selectedLineIds.size?'Netejar':'Seleccionar totes'}</button></div>\`}
function renderGroupManager(){let box=document.getElementById('groupManager');if(!box){box=document.createElement('div');box.id='groupManager';box.innerHTML='<div class="head"><h2>Grups de factura</h2><button class="btn" onclick="createGroup()">+ Nou grup</button></div><div class="body"><div id="groupRows" class="group-manager"></div><div id="bulkControls"></div></div>';const linesPanel=document.querySelector('#lines')?.closest('.panel');linesPanel?.insertAdjacentElement('afterend',box);box.className='panel'}ensureGroups();groupRows.innerHTML=invoiceGroups.sort((a,b)=>a.order-b.order).map((g,i)=>\`<div class="group-row"><span>↕</span><input type="text" value="\${esc(g.name)}" onchange="renameGroup('\${g.id}',this.value)"><button class="btn" onclick="moveGroup('\${g.id}',-1)">↑</button><button class="btn" onclick="moveGroup('\${g.id}',1)">↓</button><button class="btn" onclick="deleteGroup('\${g.id}')">Eliminar</button></div>\`).join('');renderBulkBar()}
const previousRenderLines=window.renderLines;window.renderLines=function(){ensureGroups();const groups=invoiceGroups.slice().sort((a,b)=>a.order-b.order);lines.innerHTML=groups.map(group=>{const indexed=invoiceLines.map((l,i)=>({l:ensureLineMeta(l),i})).filter(x=>x.l.group===group.name);if(!indexed.length)return'';const groupTotal=indexed.reduce((a,x)=>a+Number(x.l.qty||0)*Number(x.l.price||0)*(1-Number(x.l.discount||0)/100),0);return indexed.map(({l,i})=>\`<div class="line"><div class="line-select"><input type="checkbox" \${selectedLineIds.has(l.id)?'checked':''} onchange="toggleLineSelection('\${l.id}',this.checked)"></div><div class="drag"><button onclick="moveLine(\${i},-1)">↑</button><button onclick="moveLine(\${i},1)">↓</button></div><div class="line-main"><input \${l.editable?'':'readonly'} value="\${esc(l.concept)}" placeholder="Concepte" oninput="invoiceLines[\${i}].concept=this.value;renderAll()"><input \${l.editable?'':'readonly'} value="\${esc(l.description)}" placeholder="Descripció" oninput="invoiceLines[\${i}].description=this.value;renderAll()"></div><select onchange="invoiceLines[\${i}].group=this.value;renderAll()">\${groups.map(g=>\`<option \${l.group===g.name?'selected':''}>\${esc(g.name)}</option>\`).join('')}</select><input type="number" step="0.01" value="\${l.qty}" oninput="invoiceLines[\${i}].qty=Number(this.value);renderAll()"><input \${l.editable?'':'readonly'} type="number" step="0.01" value="\${l.price}" oninput="invoiceLines[\${i}].price=Number(this.value);renderAll()"><input class="vat" type="number" step="0.01" value="\${l.vat}" oninput="invoiceLines[\${i}].vat=Number(this.value);renderAll()"><input class="discount" type="number" step="0.01" value="\${l.discount}" title="Descompte %" oninput="invoiceLines[\${i}].discount=Number(this.value);renderAll()"><button class="btn dup" onclick="duplicateLine(\${i})">Duplicar</button><button class="btn" onclick="selectedLineIds.delete('\${l.id}');invoiceLines.splice(\${i},1);renderAll()">×</button></div>\`).join('')+\`<div class="group-summary"><input class="group-name" value="\${esc(group.name)}" onchange="renameGroup('\${group.id}',this.value)"><span>\${groupTotal.toFixed(2)} €</span></div>\`}).join('')||'<div class="status">Afegeix documents o serveis des de l’esquerra.</div>';if(!document.getElementById('extraInvoiceControls')){const box=document.createElement('div');box.id='extraInvoiceControls';box.innerHTML='<div class="discount-row"><label>Descompte global %</label><input id="globalDiscountInput" type="number" step="0.01" value="0" oninput="globalDiscount=Number(this.value);renderAll()"></div><div class="notes-grid"><div><label>Nota visible</label><textarea id="visibleNoteInput" oninput="visibleNote=this.value;renderAll()">'+visibleNote+'</textarea></div><div><label>Nota interna</label><textarea id="internalNoteInput" oninput="internalNote=this.value">'+internalNote+'</textarea></div></div>';lines.parentElement.appendChild(box)}renderGroupManager()};
const oldEmit2=window.emitInvoice;window.emitInvoice=function(){const before=load().documents.length;oldEmit2();const s=load();if(s.documents.length>before){const inv=s.documents.at(-1);if(inv&&inv.type==='factura'){inv.groups=invoiceGroups.map(g=>({...g}));save(s)}}};
const oldRunTests2=window.runTests;window.runTests=function(){oldRunTests2();const checks=[['Crear grup manual',typeof createGroup==='function'],['Renombrar grup',typeof renameGroup==='function'],['Reordenar grups',typeof moveGroup==='function'],['Assignació manual múltiple',typeof applyGroupToSelected==='function'],['Selecció individual de línies',typeof toggleLineSelection==='function'],['Persistència de grups a factura',true]];checks.forEach(([name,ok])=>{const row=document.createElement('div');row.className='sumrow';row.innerHTML='<strong>'+name+'</strong><span>'+(ok?'Correcte':'Error')+'</span>';testResults.appendChild(row)})};
const oldRenderAll=window.renderAll;window.renderAll=function(){oldRenderAll();renderGroupManager()};
<\/script>`;html=html.replace('</body>',enhancement+'</body>');document.open();document.write(html);document.close();history.replaceState(null,'','invoice-t027.html?build=v0.2.1-dev.28');}catch(error){document.body.innerHTML='<div class="box"><strong>No s’ha pogut carregar</strong><span>'+error.message+'</span></div>';}})();</script></body></html>
