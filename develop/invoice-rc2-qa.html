<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><meta http-equiv="Cache-Control" content="no-store"><title>Punto y Coma · Invoice RC2 QA</title><style>:root{--b:#6b1730;--bg:#faf8f3;--ink:#282125;--muted:#776d71;--line:#ded6d1;--soft:#f2ece7;--ok:#2f6f4e;--err:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;background:var(--b);color:#fff;padding:14px}.toprow{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:500 17px Georgia,serif;letter-spacing:.08em}.btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 14px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px}.card{padding:14px}.card small{display:block;color:var(--muted);margin-bottom:5px}.card strong{font-size:24px}.panel{overflow:hidden;margin-bottom:14px}.head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font:500 19px Georgia,serif}.body{padding:12px}.test{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:start;padding:9px 0;border-bottom:1px solid #eee7e2}.test:last-child{border-bottom:0}.test .meta{color:var(--muted);font-size:12px}.pass{color:var(--ok)}.fail{color:var(--err)}.pending{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:10px;border-radius:10px;font-size:12px}.banner{padding:14px;border-radius:14px;margin-bottom:14px;font-weight:800}.banner.ok{background:#e4f2ea;color:var(--ok)}.banner.fail{background:#fff0f2;color:var(--err)}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.toprow{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><header class="top"><div class="toprow"><div class="brand">PUNTO Y COMA · INVOICE RC2 QA</div><button id="run" class="btn">Executar proves</button></div></header><main class="wrap"><div id="banner" class="banner">Preparat per executar.</div><section class="summary"><div class="card"><small>Total</small><strong id="total">0</strong></div><div class="card"><small>Correctes</small><strong id="passed">0</strong></div><div class="card"><small>Errors</small><strong id="failed">0</strong></div><div class="card"><small>Temps</small><strong id="duration">0 ms</strong></div></section><div id="groups"></div></main><script src="invoice-engine-v001.js?v=qa1"></script><script src="invoice-store-v001.js?v=qa1"></script><script src="invoice-renderer-v001.js?v=qa1"></script><script>(()=>{'use strict';const tests=[];const group=(name,fn)=>fn(name);const test=(groupName,name,fn)=>tests.push({group:groupName,name,fn});const eq=(actual,expected,msg='')=>{if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(msg||`Esperat ${JSON.stringify(expected)} però rebut ${JSON.stringify(actual)}`)};const near=(actual,expected,tol=.01)=>{if(Math.abs(actual-expected)>tol)throw new Error(`Esperat ${expected}±${tol}, rebut ${actual}`)};const ok=(value,msg='Condició falsa')=>{if(!value)throw new Error(msg)};group('Engine',g=>{test(g,'parseNumber accepta coma decimal',()=>eq(PYCInvoiceEngine.parseNumber('12,50'),12.5));test(g,'parseNumber accepta punt decimal',()=>eq(PYCInvoiceEngine.parseNumber('12.50'),12.5));test(g,'parseNumber elimina espais',()=>eq(PYCInvoiceEngine.parseNumber('1 234,50'),1234.5));test(g,'línia IVA 21%',()=>{const r=PYCInvoiceEngine.calculateLine({qty:1,price:100,vat:21});eq(r.base,100);eq(r.vat,21);eq(r.total,121)});test(g,'línia IVA 10%',()=>{const r=PYCInvoiceEngine.calculateLine({qty:2,price:50,vat:10});eq(r.total,110)});test(g,'descompte 20%',()=>{const r=PYCInvoiceEngine.calculateLine({qty:1,price:100,discount:20,vat:21});eq(r.base,80);eq(r.total,96.8)});test(g,'quantitat decimal',()=>{const r=PYCInvoiceEngine.calculateLine({qty:'1,5',price:'20',vat:21});eq(r.base,30);eq(r.total,36.3)});test(g,'total múltiples línies',()=>{const r=PYCInvoiceEngine.calculateInvoice([{qty:1,price:100,vat:21},{qty:2,price:50,vat:10}]);eq(r.base,200);eq(r.vat,31);eq(r.total,231)});test(g,'redondeig monetari',()=>{const r=PYCInvoiceEngine.calculateLine({qty:3,price:0.1,vat:21});eq(r.base,0.3);eq(r.vat,0.06);eq(r.total,0.36)})});group('Allocation',g=>{test(g,'100% a un client',()=>{const r=PYCInvoiceEngine.calculateAllocations(121,[{clientId:'a',enabled:true,mode:'percent',value:100}]);eq(r.valid,true);eq(r.assigned,121)});test(g,'50/50',()=>{const r=PYCInvoiceEngine.calculateAllocations(121,[{clientId:'a',enabled:true,mode:'percent',value:50},{clientId:'b',enabled:true,mode:'percent',value:50}]);eq(r.assigned,121);eq(r.valid,true)});test(g,'30/70',()=>{const r=PYCInvoiceEngine.calculateAllocations(200,[{clientId:'a',enabled:true,mode:'percent',value:30},{clientId:'b',enabled:true,mode:'percent',value:70}]);eq(r.rows[0].amount,60);eq(r.rows[1].amount,140)});test(g,'imports fixos',()=>{const r=PYCInvoiceEngine.calculateAllocations(200,[{clientId:'a',enabled:true,mode:'amount',value:80},{clientId:'b',enabled:true,mode:'amount',value:120}]);eq(r.valid,true)});test(g,'repartiment invàlid',()=>{const r=PYCInvoiceEngine.calculateAllocations(200,[{clientId:'a',enabled:true,mode:'percent',value:40}]);eq(r.valid,false);eq(r.delta,120)});test(g,'parts iguals 2 clients',()=>{const r=PYCInvoiceEngine.equalSplit([{clientId:'a',enabled:true},{clientId:'b',enabled:true}]);eq(r[0].value,50);eq(r[1].value,50)});test(g,'parts iguals 3 clients suma 100',()=>{const r=PYCInvoiceEngine.equalSplit([{clientId:'a',enabled:true},{clientId:'b',enabled:true},{clientId:'c',enabled:true}]);near(r.reduce((s,x)=>s+x.value,0),100)});test(g,'client desactivat no rep import',()=>{const r=PYCInvoiceEngine.calculateAllocations(100,[{clientId:'a',enabled:false,mode:'percent',value:100},{clientId:'b',enabled:true,mode:'percent',value:100}]);eq(r.rows[0].amount,0);eq(r.rows[1].amount,100)})});group('Validation',g=>{test(g,'factura correcta',()=>{const r=PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'Servei',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]});eq(r.valid,true)});test(g,'detecta expedient absent',()=>{const r=PYCInvoiceEngine.validateInvoice({caseId:'',lines:[{concept:'Servei',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]});ok(r.errors.includes('missing_case'))});test(g,'detecta concepte absent',()=>{const r=PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]});ok(r.errors.includes('missing_concept'))});test(g,'detecta quantitat invàlida',()=>{const r=PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'Servei',qty:0,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]});ok(r.errors.includes('invalid_quantity'))});test(g,'detecta repartiment invàlid',()=>{const r=PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'Servei',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:50}]});ok(r.errors.includes('invalid_allocation'))})});group('Renderer',g=>{const inv={number:'F-2026-001',caseId:'c1',lines:[{concept:'Assessorament',description:'Test',qty:1,price:100,vat:21}],allocations:[{clientId:'a',mode:'percent',value:100,amount:121}],base:100,vat:21,total:121};const ctx={settings:{name:'Julia María Rico López',tax:'74011732D',address:'Adreça fiscal',email:'info@pyc.legal',iban:'ES00 TEST'},clients:[{id:'a',name:'Client A',tax:'X123',address:'Adreça client',email:'a@test.com'}],matter:{name:'Expedient QA'}};test(g,'inclou nom emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('Julia María Rico López')));test(g,'inclou NIF emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('74011732D')));test(g,'inclou IBAN emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('ES00 TEST')));test(g,'inclou dades client',()=>{const html=PYCInvoiceRenderer.render(inv,ctx,'a');ok(html.includes('Client A'));ok(html.includes('X123'));ok(html.includes('Adreça client'))});test(g,'inclou expedient',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('Expedient QA')));test(g,'inclou total individual',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('121.00 €')));test(g,'fallback emissor complet',()=>{const d=PYCInvoiceRenderer.issuerData({});ok(d.name);ok(d.tax);ok(d.address);ok(d.email);ok(d.iban)})});group('Mobile input model',g=>{test(g,'seqüència 12345 no perd valor',()=>{let v='';for(const c of '12345')v+=c;eq(PYCInvoiceEngine.parseNumber(v),12345)});test(g,'seqüència 12,50',()=>eq(PYCInvoiceEngine.parseNumber('12,50'),12.5));test(g,'seqüència 12.50',()=>eq(PYCInvoiceEngine.parseNumber('12.50'),12.5));test(g,'esborrat parcial no trenca',()=>eq(PYCInvoiceEngine.parseNumber(''),0));test(g,'enganxar valor amb espais',()=>eq(PYCInvoiceEngine.parseNumber(' 1 250,75 '),1250.75))});async function run(){const started=performance.now(),results=[];for(const t of tests){try{await t.fn();results.push({...t,ok:true})}catch(error){results.push({...t,ok:false,error:String(error.message||error)})}}const duration=Math.round(performance.now()-started),passed=results.filter(r=>r.ok).length,failed=results.length-passed;document.getElementById('total').textContent=results.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('duration').textContent=duration+' ms';const banner=document.getElementById('banner');banner.className='banner '+(failed?'fail':'ok');banner.textContent=failed?`${passed}/${results.length} proves correctes. RC2 NO preparada.`:`${passed}/${results.length} proves correctes. RC2 READY.`;const byGroup={};results.forEach(r=>(byGroup[r.group]??=[]).push(r));document.getElementById('groups').innerHTML=Object.entries(byGroup).map(([name,items])=>`<section class="panel"><div class="head"><h2>${name}</h2><strong>${items.filter(x=>x.ok).length}/${items.length}</strong></div><div class="body">${items.map(r=>`<div class="test"><div class="${r.ok?'pass':'fail'}">${r.ok?'✓':'✕'}</div><div><strong>${r.name}</strong>${r.error?`<pre>${r.error}</pre>`:''}</div><div class="meta">${r.ok?'PASS':'FAIL'}</div></div>`).join('')}</div></section>`).join('')}document.title=`Invoice RC2 QA · ${passed}/${results.length}`;return{results,passed,failed,duration}}document.getElementById('run').onclick=run;window.PYCInvoiceQA={run,tests};run()})();</script></body></html>
