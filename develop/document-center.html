<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Document Center</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.back{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:860px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type{border:1px solid var(--l);background:#fff;border-radius:14px;padding:15px;text-align:left}.type.active{border-color:var(--b);box-shadow:0 0 0 2px rgba(107,23,48,.1)}.type strong{display:block}.type small{display:block;color:var(--m);margin-top:4px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.summary{background:var(--soft);border-radius:12px;padding:14px}.summary-row{display:flex;justify-content:space-between;padding:6px 0}.summary-row.total{font-weight:800;border-top:1px solid var(--l);margin-top:5px;padding-top:10px}.row{padding:13px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:3px}.empty{padding:22px;text-align:center;color:var(--m)}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}@media(min-width:760px){.types{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="top"><div class="topline"><div class="brand">PUNTO Y COMA<small>DOCUMENT CENTER</small></div><button class="back" onclick="location.href='case-center.html?build=v0.2.1-dev.13'">Tornar</button></div><div class="badges"><span class="badge">v0.2.1-dev.13</span><span class="badge">T-013</span><span class="badge">Schema v2</span><span class="badge">Document engine</span></div></header><main class="wrap"><section class="panel"><div class="head"><div><div id="caseCode" style="font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.1em">Sense expedient</div><h2 id="caseName">Nou document</h2></div></div><div class="body"><div class="types" id="types"></div></div></section><section class="panel"><div class="head"><h2>Dades del document</h2></div><div class="body"><div class="field"><label>Títol</label><input id="title"></div><div class="field"><label>Destinatari</label><select id="client"></select></div><div id="economic"><div class="grid"><div class="field"><label>Base</label><input id="base" type="number" step="0.01" value="0" oninput="renderTotals()"></div><div class="field"><label>IVA %</label><input id="vatRate" type="number" step="0.01" value="21" oninput="renderTotals()"></div><div class="field"><label>IRPF %</label><input id="irpfRate" type="number" step="0.01" value="0" oninput="renderTotals()"></div></div><div id="totals" class="summary"></div></div><div class="field"><label>Contingut / observacions</label><textarea id="content"></textarea></div><button class="btn primary full" onclick="saveDocument()">Crear document</button></div></section><section class="panel"><div class="head"><h2>Documents de l’expedient</h2></div><div id="documentList" class="body"></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-013</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Executant proves...</div><div id="testResults"></div></div></section></main><script>
const VERSION='v0.2.1-dev.13',SUITE='T-013',KEY='pyc_office_v2';
const TYPES={factura:{label:'Factura',economic:true,numbered:true},provisio:{label:'Provisió de fons',economic:true},pressupost:{label:'Pressupost',economic:true},full_encarrec:{label:"Full d’encàrrec"},informatiu:{label:'Document informatiu'},lliure:{label:'Document lliure'}};
let selectedType='factura';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({version:2,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[],cases:[],documents:[],activity:[]});
function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}
function currentCase(s=load()){const id=localStorage.getItem('pyc_current_case');return s.cases.find(c=>c.id===id)||s.cases[0]||null}
function round(n){return Math.round((Number(n||0)+Number.EPSILON)*100)/100}
function totals(b=base.value,v=vatRate.value,i=irpfRate.value){const x=round(b),vat=round(x*Number(v||0)/100),irpf=round(x*Number(i||0)/100);return{base:x,vat,irpf,total:round(x+vat-irpf)}}
function number(prefix,seq){return `${prefix}${String(seq).padStart(3,'0')}`}
function renderTypes(){types.innerHTML=Object.entries(TYPES).map(([id,t])=>`<button class="type ${id===selectedType?'active':''}" onclick="selectType('${id}')"><strong>${t.label}</strong><small>${t.economic?'Document econòmic':'Document general'}</small></button>`).join('')}
function selectType(id){selectedType=id;title.value=TYPES[id].label;economic.style.display=TYPES[id].economic?'block':'none';renderTypes();renderTotals()}
function renderTotals(){const t=totals();document.getElementById('totals').innerHTML=`<div class="summary-row"><span>Base</span><strong>${t.base.toFixed(2)} €</strong></div><div class="summary-row"><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div><div class="summary-row"><span>IRPF</span><strong>−${t.irpf.toFixed(2)} €</strong></div><div class="summary-row total"><span>Total</span><strong>${t.total.toFixed(2)} €</strong></div>`}
function render(){const s=load(),c=currentCase(s);caseCode.textContent=c?.code||'Sense expedient';caseName.textContent=c?`Nou document · ${c.name}`:'Nou document';const ids=(c?.participants||[]).map(p=>p.clientId),clients=s.clients.filter(x=>ids.includes(x.id));client.innerHTML='<option value="">Expedient / diversos</option>'+clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const docs=s.documents.filter(d=>d.caseId===c?.id);documentList.innerHTML=docs.length?docs.map(d=>`<div class="row"><div><strong>${esc(d.title)}</strong><small>${esc(TYPES[d.type]?.label||d.type)} · ${esc(d.status||'esborrany')}</small></div><span>${esc(d.number||'')}</span></div>`).join(''):'<div class="empty">Encara no hi ha documents.</div>';renderTypes();renderTotals()}
function saveDocument(){const s=load(),c=currentCase(s);if(!c)return alert('No hi ha cap expedient seleccionat.');if(!title.value.trim())return alert('El títol és obligatori.');const cfg=TYPES[selectedType],t=cfg.economic?totals():{base:0,vat:0,irpf:0,total:0};const seq=Number(s.settings?.nextInvoiceNumber||1);const doc={id:uid(),caseId:c.id,clientId:client.value,type:selectedType,title:title.value.trim(),content:content.value.trim(),status:'esborrany',number:cfg.numbered?number(s.settings?.invoicePrefix||'F-2026-',seq):'',...t,date:new Date().toISOString().slice(0,10)};s.documents.push(doc);if(cfg.numbered)s.settings={...s.settings,nextInvoiceNumber:seq+1};s.activity=s.activity||[];s.activity.push({id:uid(),caseId:c.id,title:'Document creat',body:doc.title,date:doc.date});save(s);content.value='';alert(`${cfg.label} creat${doc.number?` · ${doc.number}`:''}.`)}
function runTests(){const original=localStorage.getItem(KEY),current=localStorage.getItem('pyc_current_case'),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'},{id:'b',name:'Marc'}];s.cases=[{id:'e',name:'Divorci',participants:[{clientId:'a'},{clientId:'b'}]}];localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('pyc_current_case','e');ok('Build identificada',VERSION==='v0.2.1-dev.13'&&SUITE==='T-013');const t=totals(1000,21,15);ok('Càlcul base',t.base===1000);ok('Càlcul IVA',t.vat===210);ok('Càlcul IRPF',t.irpf===150);ok('Càlcul total',t.total===1060);ok('Numeració factura',number('F-2026-',1)==='F-2026-001');const types=Object.keys(TYPES);ok('Sis tipus de document',types.length===6);types.forEach((type,index)=>{const cfg=TYPES[type],seq=Number(s.settings.nextInvoiceNumber||1),doc={id:`d${index}`,caseId:'e',type,title:cfg.label,status:'esborrany',number:cfg.numbered?number(s.settings.invoicePrefix,seq):''};s.documents.push(doc);if(cfg.numbered)s.settings.nextInvoiceNumber=seq+1;s.activity.push({id:`a${index}`,caseId:'e',title:'Document creat',body:doc.title})});ok('Crear tots els tipus',s.documents.length===6);ok('Vincular a expedient',s.documents.every(d=>d.caseId==='e'));ok('Registrar cronologia',s.activity.length===6);ok('Incrementar numeració',s.settings.nextInvoiceNumber===2)}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);if(current===null)localStorage.removeItem('pyc_current_case');else localStorage.setItem('pyc_current_case',current)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="row"><div><strong>${esc(t.name)}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const failed=tests.filter(t=>!t.ok).length;testStatus.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(failed?'bad':'ok')}
selectType('factura');render();runTests();
</script></body></html>
