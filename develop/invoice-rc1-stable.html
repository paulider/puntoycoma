<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Punto y Coma · Factura RC1 estable</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--soft:#f2ece7;--ok:#2f6f4e;--danger:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:28px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font:500 16px Georgia,serif;letter-spacing:.08em}.btn{border:1px solid var(--l);background:#fff;color:var(--i);border-radius:10px;min-height:42px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}.btn.danger{color:var(--danger);background:#fff0f2;border-color:#e6b6bf}.wrap{max-width:1180px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:14px}.head{padding:14px 15px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:10px}.head h2{margin:0;font:500 19px Georgia,serif}.body{padding:15px}.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:#fff;font-size:16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.group{border:1px solid #eee7e2;border-radius:12px;overflow:hidden;margin-bottom:12px}.group-title{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--soft)}.line{display:grid;grid-template-columns:28px minmax(160px,1fr) 120px 70px 86px 70px 70px 42px 42px;gap:7px;align-items:center;padding:10px;border-top:1px solid #eee7e2}.line input,.line select{width:100%;min-width:0;padding:8px;border:1px solid var(--l);border-radius:8px}.line-main{display:grid;gap:5px}.line-main small{color:var(--m)}.summary>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee7e2}.summary .grand{margin-top:8px;padding:13px;border:0;border-radius:10px;background:var(--soft);color:var(--b);font-size:19px}.status{padding:11px;border-radius:11px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.group-editor{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 40px;gap:7px;margin-bottom:8px}.group-editor input{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.empty{padding:20px;text-align:center;color:var(--m)}@media(max-width:900px){.layout{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.line{grid-template-columns:28px minmax(0,1fr) 44px 44px}.line-main{grid-column:2/5}.line [data-field="groupKey"]{grid-column:1/5}.line [data-field="qty"]{grid-column:1/3}.line [data-field="price"]{grid-column:3/5}.line [data-field="vat"]{grid-column:1/3}.line [data-field="discount"]{grid-column:3/5}}@media(max-width:560px){.wrap{padding:10px}.head{align-items:flex-start;flex-direction:column}.toolbar{width:100%;display:grid;grid-template-columns:1fr 1fr}.toolbar .btn{width:100%}.line{grid-template-columns:26px minmax(0,1fr) 40px 40px;padding:10px 8px}.group-editor{grid-template-columns:minmax(0,1fr) 38px 38px 38px}}</style></head><body><header class="top"><div class="toprow"><button id="back" class="btn ghost">← Tornar</button><div class="brand">PUNTO Y COMA · RC1.3</div><button id="saveTop" class="btn ghost">Desar</button></div></header><main class="wrap"><div class="layout"><section><div class="panel"><div class="head"><h2>Factura</h2><div class="toolbar"><button id="newInvoice" class="btn">Nova factura</button><button id="saveInvoice" class="btn primary">Desar factura</button></div></div><div class="body"><div class="grid3"><div class="field"><label>Expedient</label><select id="caseSelect"></select></div><div class="field"><label>Estat</label><select id="statusSelect"><option value="esborrany">Esborrany</option><option value="emesa">Emesa</option><option value="pagada">Pagada</option><option value="anul·lada">Anul·lada</option></select></div><div class="field"><label>Idioma del document</label><select id="languageSelect"><option value="ca">Català</option><option value="es">Castellano</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="pt">Português</option></select></div></div><div id="status" class="status">Editor carregat.</div></div></div><div class="panel"><div class="head"><h2>Línies</h2><div class="toolbar"><button id="addManual" class="btn">+ Línia</button><button id="addService" class="btn">+ Servei</button><button id="addDocument" class="btn">+ Document</button></div></div><div class="body"><div id="lines"></div></div></div></section><aside><div class="panel"><div class="head"><h2>Grups</h2><button id="addGroup" class="btn">+ Grup</button></div><div class="body"><div id="groups"></div></div></div><div class="panel"><div class="head"><h2>Resum</h2></div><div class="body"><div id="summary" class="summary"></div></div></div></aside></div></main><script>(()=>{'use strict';const KEY='pyc_office_v2',DRAFT='pyc_invoice_advanced_i18n_draft_v1';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={fees:{ca:'Honoraris',es:'Honorarios',en:'Fees',fr:'Honoraires',de:'Honorare',ru:'Гонорары',pt:'Honorários'},expenses:{ca:'Despeses',es:'Gastos',en:'Expenses',fr:'Frais',de:'Auslagen',ru:'Расходы',pt:'Despesas'},disbursements:{ca:'Suplerts',es:'Suplidos',en:'Disbursements',fr:'Débours',de:'Fremdgelder',ru:'Возмещаемые расходы',pt:'Suprimentos'},discounts:{ca:'Descomptes',es:'Descuentos',en:'Discounts',fr:'Remises',de:'Rabatte',ru:'Скидки',pt:'Descontos'}};const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{cases:[],documents:[],serviceCatalog:[],settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1}}}catch{return{cases:[],documents:[],serviceCatalog:[],settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1}}}};const save=s=>localStorage.setItem(KEY,JSON.stringify(s));let draft={invoiceId:null,caseId:'',status:'esborrany',language:'ca',groups:[{id:'g-fees',key:'fees',kind:'builtin',order:0},{id:'g-expenses',key:'expenses',kind:'builtin',order:1},{id:'g-disbursements',key:'disbursements',kind:'builtin',order:2},{id:'g-discounts',key:'discounts',kind:'builtin',order:3}],lines:[]};try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(d)draft={...draft,...d}}catch{};if(!draft.lines?.length)draft.lines=[{id:uid(),concept:'',description:'',groupKey:'fees',qty:1,price:0,vat:21,discount:0,sourceType:'manual'}];const sortedGroups=()=>draft.groups.slice().sort((a,b)=>a.order-b.order),groupLabel=g=>g.kind==='builtin'?(labels[g.key]?.[draft.language]||g.key):(g.labels?.[draft.language]||g.labels?.ca||g.name||g.key),persist=()=>localStorage.setItem(DRAFT,JSON.stringify(draft));function totals(){const lines=draft.lines.map(l=>{const gross=round(l.qty*l.price),base=round(gross-(gross*l.discount/100)),vat=round(base*l.vat/100);return{...l,base,vat,total:round(base+vat)}});return{lines,base:round(lines.reduce((a,l)=>a+l.base,0)),vat:round(lines.reduce((a,l)=>a+l.vat,0)),total:round(lines.reduce((a,l)=>a+l.total,0))}}function render(){const s=load();if(!draft.caseId)draft.caseId=s.cases[0]?.id||'';$('caseSelect').innerHTML=s.cases.length?s.cases.map(c=>`<option value="${c.id}" ${c.id===draft.caseId?'selected':''}>${esc(c.name||c.code||'Expedient')}</option>`).join(''):'<option value="">Sense expedients</option>';$('statusSelect').value=draft.status;$('languageSelect').value=draft.language;$('lines').innerHTML=sortedGroups().map(g=>{const rows=draft.lines.filter(l=>l.groupKey===g.key);if(!rows.length)return'';return`<section class="group"><div class="group-title"><strong>${esc(groupLabel(g))}</strong><span>${rows.reduce((a,l)=>a+l.qty*l.price,0).toFixed(2)} €</span></div>${rows.map(lineHtml).join('')}</section>`}).join('')||'<div class="empty">Sense línies.</div>';$('groups').innerHTML=sortedGroups().map(g=>`<div class="group-editor"><input data-group-name="${g.id}" value="${esc(groupLabel(g))}" ${g.kind==='builtin'?'readonly':''}><button data-group-up="${g.id}">↑</button><button data-group-down="${g.id}">↓</button><button data-group-delete="${g.id}" ${g.kind==='builtin'?'disabled':''}>×</button></div>`).join('');const t=totals();$('summary').innerHTML=`<div><span>Base</span><strong>${t.base.toFixed(2)} €</strong></div><div><span>IVA</span><strong>${t.vat.toFixed(2)} €</strong></div><div class="grand"><span>Total</span><strong>${t.total.toFixed(2)} €</strong></div>`;persist()}function lineHtml(l){return`<div class="line" data-id="${l.id}"><input type="checkbox" data-select="${l.id}"><div class="line-main"><input data-field="concept" value="${esc(l.concept)}" placeholder="Concepte"><input data-field="description" value="${esc(l.description)}" placeholder="Descripció"><small>${esc(l.sourceType||'manual')}</small></div><select data-field="groupKey">${sortedGroups().map(g=>`<option value="${g.key}" ${g.key===l.groupKey?'selected':''}>${esc(groupLabel(g))}</option>`).join('')}</select><input data-field="qty" type="number" step="0.01" value="${Number(l.qty||1)}"><input data-field="price" type="number" step="0.01" value="${Number(l.price||0)}"><input data-field="vat" type="number" step="0.01" value="${Number(l.vat??21)}"><input data-field="discount" type="number" step="0.01" value="${Number(l.discount||0)}"><button data-dup="${l.id}">⧉</button><button data-del="${l.id}">×</button></div>`}function addLine(data={}){draft.lines.push({id:uid(),concept:data.concept||'',description:data.description||'',groupKey:data.groupKey||'fees',qty:Number(data.qty??1),price:Number(data.price??0),vat:Number(data.vat??21),discount:Number(data.discount??0),sourceType:data.sourceType||'manual',sourceId:data.sourceId||null});render()}function updateLine(id,field,value){const l=draft.lines.find(x=>x.id===id);if(!l)return;l[field]=['qty','price','vat','discount'].includes(field)?Number(value):value;render()}function saveInvoice(){const s=load(),t=totals();if(!draft.caseId)return $('status').textContent='Cal seleccionar un expedient.';if(t.lines.some(l=>!l.concept||l.qty<=0||l.price<0))return $('status').textContent='Revisa les línies.';let inv=draft.invoiceId?s.documents.find(d=>d.id===draft.invoiceId):null;if(!inv){const n=Number(s.settings?.nextInvoiceNumber||1);inv={id:uid(),type:'factura',number:`${s.settings?.invoicePrefix||'F-2026-'}${String(n).padStart(3,'0')}`};s.settings=s.settings||{};s.settings.nextInvoiceNumber=n+1;s.documents=s.documents||[];s.documents.push(inv)}Object.assign(inv,{caseId:draft.caseId,status:draft.status,language:draft.language,groups:draft.groups,lines:draft.lines,base:t.base,vat:t.vat,total:t.total,amountDue:draft.status==='pagada'?0:t.total,updatedAt:new Date().toISOString()});save(s);draft.invoiceId=inv.id;persist();$('status').className='status ok';$('status').textContent=`Desada ${inv.number} · ${t.total.toFixed(2)} €`}document.addEventListener('input',e=>{const line=e.target.closest('.line');if(line&&e.target.dataset.field)updateLine(line.dataset.id,e.target.dataset.field,e.target.value);if(e.target.dataset.groupName){const g=draft.groups.find(x=>x.id===e.target.dataset.groupName);if(g&&g.kind==='custom'){g.labels=g.labels||{};g.labels[draft.language]=e.target.value;persist()}}});document.addEventListener('change',e=>{if(e.target.id==='caseSelect'){draft.caseId=e.target.value;persist()}if(e.target.id==='statusSelect'){draft.status=e.target.value;persist()}if(e.target.id==='languageSelect'){draft.language=e.target.value;render()}});document.addEventListener('click',e=>{const d=e.target.dataset;if(d.del){draft.lines=draft.lines.filter(l=>l.id!==d.del);if(!draft.lines.length)addLine();else render()}if(d.dup){const l=draft.lines.find(x=>x.id===d.dup);if(l)addLine({...l})}if(d.groupUp||d.groupDown){const id=d.groupUp||d.groupDown,dir=d.groupUp?-1:1,a=sortedGroups(),i=a.findIndex(g=>g.id===id),j=i+dir;if(i>=0&&j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];a.forEach((g,k)=>g.order=k);draft.groups=a;render()}}if(d.groupDelete){const g=draft.groups.find(x=>x.id===d.groupDelete);if(g&&!draft.lines.some(l=>l.groupKey===g.key)){draft.groups=draft.groups.filter(x=>x.id!==g.id);render()}}});$('addManual').onclick=()=>addLine();$('addService').onclick=()=>{const s=load(),items=(s.serviceCatalog||[]).filter(x=>x.active!==false);if(!items.length)return addLine({concept:'Servei',sourceType:'service'});const idx=Number(prompt(items.map((x,i)=>`${i+1}. ${x.name}`).join('\n'),'1'))-1,item=items[idx];if(item)addLine({concept:item.name,description:item.description,price:item.unitPrice,vat:item.vatRate,groupKey:item.groupKey||'fees',sourceType:'service',sourceId:item.id})};$('addDocument').onclick=()=>{const s=load(),items=(s.documents||[]).filter(x=>x.caseId===draft.caseId&&x.type!=='factura');if(!items.length)return addLine({concept:'Document',sourceType:'document'});const idx=Number(prompt(items.map((x,i)=>`${i+1}. ${x.name||x.title||x.type}`).join('\n'),'1'))-1,item=items[idx];if(item)addLine({concept:item.name||item.title||item.type,description:item.description,price:item.price||0,vat:item.vatRate??21,groupKey:item.groupKey||'fees',sourceType:'document',sourceId:item.id})};$('addGroup').onclick=()=>{const name=(prompt('Nom del grup')||'').trim();if(!name)return;draft.groups.push({id:uid(),key:`custom-${uid()}`,kind:'custom',order:draft.groups.length,labels:{[draft.language]:name}});render()};$('saveInvoice').onclick=saveInvoice;$('saveTop').onclick=saveInvoice;$('newInvoice').onclick=()=>{draft.invoiceId=null;draft.lines=[{id:uid(),concept:'',description:'',groupKey:'fees',qty:1,price:0,vat:21,discount:0,sourceType:'manual'}];draft.status='esborrany';render()};$('back').onclick=()=>location.href='rc1-app-fixed.html?return=invoice';render()})();</script></body></html>
