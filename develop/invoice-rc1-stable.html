e),discount=num(l.discount),vatRate=num(l.vat),base=round(qty*price*(1-discount/100)),vat=round(base*vatRate/100);return{...l,qty,price,discount,vatRate,base,vat,total:round(base+vat)}});return{lines,base:round(lines.reduce((a,l)=>a+l.base,0)),vat:round(lines.reduce((a,l)=>a+l.vat,0)),total:round(lines.reduce((a,l)=>a+l.total,0))}}function participants(state,matter){const ids=[];if(matter?.clientId)ids.push(matter.clientId);(matter?.participants||[]).forEach(p=>ids.push(typeof p==='string'?p:(p.clientId||p.id)));return [...new Set(ids.filter(Boolean))].map(id=>state.clients?.find(c=>c.id===id)).filter(Boolean)}function syncAllocations(){const s=load(),matter=s.cases?.find(c=>c.id===draft.caseId),clients=participants(s,matter),old=new Map((draft.allocations||[]).map(a=>[a.clientId,a]));draft.allocations=clients.map((c,i)=>old.get(c.id)||{clientId:c.id,enabled:i===0,mode:'percent',value:i===0?100:0});persist()}function allocationRows(){const s=load(),t=totals(),enabled=draft.allocations.filter(a=>a.enabled);let fixed=0,percent=0;enabled.forEach(a=>a.mode==='amount'?fixed+=num(a.value):percent+=num(a.value));return draft.allocations.map(a=>{const c=s.clients?.find(x=>x.id===a.clientId)||{},amount=a.enabled?(a.mode==='amount'?num(a.value):round(t.total*num(a.value)/100)):0;return{...a,client:c,amount}})}function validateAllocation(){const t=totals(),rows=allocationRows(),sum=round(rows.reduce((a,r)=>a+r.amount,0)),delta=round(t.total-sum),ok=rows.some(r=>r.enabled)&&Math.abs(delta)<=.01;$('allocationStatus').className='status '+(ok?'ok':'error');$('allocationStatus').textContent=ok?`Repartiment correcte: ${sum.toFixed(2)} €`:`Falten/sobren ${delta.toFixed(2)} €. El repartiment ha de coincidir amb ${t.total.toFixed(2)} €.`;return{ok,rows,sum,delta}}function setStatus(text,type=''){$('status').className='status'+(type?' '+type:'');$('status').textContent=text}function identityText(o){return [o.name||o.legalName||'',o.tax||o.nif||o.vatNumber||'',o.address||'',o.email||''].
