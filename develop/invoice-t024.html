<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Carregant facturació...</title><style>body{margin:0;background:#f7f4ee;color:#282125;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.box{text-align:center;padding:28px}.box strong{display:block;font:500 24px Georgia,serif;margin-bottom:10px}.box span{color:#776d71}</style></head><body><div class="box"><strong>PUNTO Y COMA</strong><span>Carregant v0.2.1-dev.25...</span></div><script>(async()=>{try{const response=await fetch('invoice-t022.html?source=v0.2.1-dev.23&cache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!response.ok)throw new Error('HTTP '+response.status);let html=await response.text();html=html.replaceAll('v0.2.1-dev.23','v0.2.1-dev.25').replaceAll('T-022','T-024').replace('Professional composer','Concept + description');const enhancement=`<style>
.line{grid-template-columns:36px minmax(0,1fr) 70px 95px 66px 36px}.line-main{display:grid;gap:6px}.line-main input:first-child{font-weight:700}.line-main input:last-child{font-size:12px;color:var(--m)}
@media(max-width:650px){.line{grid-template-columns:30px minmax(0,1fr) 58px 75px 32px}.line .vat{display:none}}
</style><script>
window.addDocument=function(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d)return;invoiceLines.push({id:uid(),kind:'document',sourceDocumentId:d.id,concept:d.title||d.type||'Document',description:d.invoiceDescription||d.description||'Document vinculat a l’expedient',qty:1,price:Number(d.billableAmount??d.base??0),vat:21,irpf:0});renderAll()};
window.addService=function(id){const s=load(),x=s.serviceCatalog.find(v=>v.id===id);if(!x)return;invoiceLines.push({id:uid(),kind:'service',catalogItemId:x.id,concept:x.name||'Servei',description:x.description||'Servei professional',qty:1,price:Number(x.unitPrice||0),vat:Number(x.vatRate??21),irpf:Number(x.irpfRate??0)});renderAll()};
window.addManualLine=function(){invoiceLines.push({id:uid(),kind:'manual',concept:'Concepte manual',description:'',qty:1,price:0,vat:21,irpf:0});renderAll()};
window.renderLines=function(){lines.innerHTML=invoiceLines.map((l,i)=>{if(!l.concept){l.concept=l.description||'Concepte';l.description=l.kind==='document'?'Document vinculat a l’expedient':l.kind==='service'?'Servei professional':''}return \`<div class="line"><div class="drag"><button onclick="moveLine(\${i},-1)">↑</button><button onclick="moveLine(\${i},1)">↓</button></div><div class="line-main"><input value="\${esc(l.concept)}" placeholder="Concepte" oninput="invoiceLines[\${i}].concept=this.value;renderAll()"><input value="\${esc(l.description)}" placeholder="Descripció" oninput="invoiceLines[\${i}].description=this.value;renderAll()"></div><input type="number" step="0.01" value="\${l.qty}" oninput="invoiceLines[\${i}].qty=Number(this.value);renderAll()"><input type="number" step="0.01" value="\${l.price}" oninput="invoiceLines[\${i}].price=Number(this.value);renderAll()"><input class="vat" type="number" step="0.01" value="\${l.vat}" oninput="invoiceLines[\${i}].vat=Number(this.value);renderAll()"><button class="btn" onclick="invoiceLines.splice(\${i},1);renderAll()">×</button></div>\`}).join('')||'<div class="status">Afegeix documents o serveis des de l’esquerra.</div>'};
window.renderPreview=function(){const s=load(),c=currentCase(s),cl=s.clients.find(x=>x.id===recipientSelect.value),t=calc(),number=\`\${s.settings.invoicePrefix||'F-2026-'}\${String(s.settings.nextInvoiceNumber||1).padStart(3,'0')}\`;invoicePreview.innerHTML=\`<div class="inv-top"><div class="logo">PUNTO Y COMA<small>LEGAL</small></div><div class="title">FACTURA<small>N.º \${esc(number)}</small></div></div><div class="meta"><div><h4>DE</h4><strong>\${esc(s.settings.name||'Julia Rico')}</strong><div>\${esc(s.settings.phone||'')}</div><div>\${esc(s.settings.email||'')}</div><div>\${esc(s.settings.web||'')}</div></div><div><h4>PER A</h4><strong>\${esc(cl?.name||'Client')}</strong><div>\${esc(c?.name||'')}</div><div>\${new Date().toLocaleDateString('ca-ES')}</div><div>\${esc(paymentMethod.value)}</div></div></div><div class="table"><div class="thead"><div>CONCEPTE</div><div>DESCRIPCIÓ</div><div>CANT.</div><div>PREU UNIT.</div><div>IMPORT</div></div>\${t.rows.map(l=>\`<div class="trow"><div><strong>\${esc(l.concept||l.description||'Concepte')}</strong></div><div>\${esc(l.description||'')}</div><div>\${l.qty}</div><div>\${l.price.toFixed(2)} €</div><div>\${l.subtotal.toFixed(2)} €</div></div>\`).join('')}</div><div class="totals"><div class="sumrow"><span>Base imposable</span><strong>\${t.base.toFixed(2)} €</strong></div><div class="sumrow"><span>IVA</span><strong>\${t.vat.toFixed(2)} €</strong></div>\${t.applied?\`<div class="sumrow"><span>Provisió aplicada</span><strong>−\${t.applied.toFixed(2)} €</strong></div>\`:''}<div class="sumrow total"><span>TOTAL PENDENT</span><strong>\${t.due.toFixed(2)} €</strong></div></div><div class="note"><strong>NOTA</strong><div>Gràcies per confiar en els nostres serveis. Quedem a la seva disposició per a qualsevol consulta.</div></div><div class="footer"><strong>PUNTO Y COMA LEGAL</strong><div>\${esc(s.settings.email||'')} · \${esc(s.settings.phone||'')}</div><div>\${esc(s.settings.web||'')}</div></div>\`};
const originalRunTests=window.runTests;window.runTests=function(){originalRunTests();const rows=[...document.querySelectorAll('#testResults .sumrow')];const conceptOk=invoiceLines.length===0||invoiceLines.every(l=>Boolean(l.concept||l.description));const extra=document.createElement('div');extra.className='sumrow';extra.innerHTML='<strong>Concepte i descripció separats</strong><span>'+(conceptOk?'Correcte':'Error')+'</span>';testResults.appendChild(extra);if(!conceptOk){testStatus.textContent='v0.2.1-dev.25 · T-024: 1 prova ha fallat.';testStatus.className='status bad'}};
<\/script>`;html=html.replace('</body>',enhancement+'</body>');document.open();document.write(html);document.close();history.replaceState(null,'','invoice-t024.html?build=v0.2.1-dev.25');}catch(error){document.body.innerHTML='<div class="box"><strong>No s’ha pogut carregar</strong><span>'+error.message+'</span></div>';}})();</script></body></html>
