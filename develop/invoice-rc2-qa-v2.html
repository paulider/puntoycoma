<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Invoice RC2 QA v2</title><style>:root{--b:#6b1730;--bg:#faf8f3;--line:#ded6d1;--ok:#2f6f4e;--err:#a22c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282125}.top{background:var(--b);color:#fff;padding:14px}.bar{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{min-height:44px;border:0;border-radius:10px;background:#fff;padding:10px 14px;font-weight:700}.wrap{max-width:1000px;margin:auto;padding:14px}.banner,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:14px}.banner{padding:14px;margin-bottom:12px;font-weight:700}.banner.ok{background:#e4f2ea;color:var(--ok)}.banner.err{background:#fff0f2;color:var(--err)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:12px}.stat small{display:block;color:#776d71}.stat strong{font-size:22px}.panel{margin-bottom:12px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.test{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid #eee7e2}.pass{color:var(--ok)}.fail{color:var(--err)}pre{white-space:pre-wrap;background:#f2ece7;padding:8px;border-radius:8px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><header class="top"><div class="bar"><strong>PUNTO Y COMA · INVOICE RC2 QA v2</strong><button id="run" class="btn">Executar proves</button></div></header><main class="wrap"><div id="banner" class="banner">Carregant mòduls…</div><div class="stats"><div class="stat"><small>Total</small><strong id="total">0</strong></div><div class="stat"><small>Correctes</small><strong id="passed">0</strong></div><div class="stat"><small>Errors</small><strong id="failed">0</strong></div><div class="stat"><small>Temps</small><strong id="duration">0 ms</strong></div></div><div id="groups"></div></main><script>window.addEventListener('error',e=>{const b=document.getElementById('banner');b.className='banner err';b.textContent='Error de càrrega: '+(e.message||'desconegut')});</script><script src="invoice-engine-v001.js?v=qa2"></script><script src="invoice-renderer-v001.js?v=qa2"></script><script>(()=>{'use strict';const banner=document.getElementById('banner'),button=document.getElementById('run');if(!window.PYCInvoiceEngine||!window.PYCInvoiceRenderer){banner.className='banner err';banner.textContent='No s’han carregat InvoiceEngine o InvoiceRenderer.';return}const tests=[],add=(g,n,f)=>tests.push({g,n,f});const eq=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(`Esperat ${JSON.stringify(b)}, rebut ${JSON.stringify(a)}`)};const ok=(v,m='Condició falsa')=>{if(!v)throw new Error(m)};add('Engine','Coma decimal',()=>eq(PYCInvoiceEngine.parseNumber('12,50'),12.5));add('Engine','Punt decimal',()=>eq(PYCInvoiceEngine.parseNumber('12.50'),12.5));add('Engine','IVA 21%',()=>{const r=PYCInvoiceEngine.calculateLine({qty:1,price:100,vat:21});eq(r.total,121)});add('Engine','Descompte 20%',()=>{const r=PYCInvoiceEngine.calculateLine({qty:1,price:100,discount:20,vat:21});eq(r.total,96.8)});add('Engine','Múltiples línies',()=>{const r=PYCInvoiceEngine.calculateInvoice([{qty:1,price:100,vat:21},{qty:2,price:50,vat:10}]);eq(r.total,231)});add('Repartiment','100% un client',()=>ok(PYCInvoiceEngine.calculateAllocations(121,[{clientId:'a',enabled:true,mode:'percent',value:100}]).valid));add('Repartiment','50/50',()=>ok(PYCInvoiceEngine.calculateAllocations(121,[{clientId:'a',enabled:true,mode:'percent',value:50},{clientId:'b',enabled:true,mode:'percent',value:50}]).valid));add('Repartiment','30/70',()=>{const r=PYCInvoiceEngine.calculateAllocations(200,[{clientId:'a',enabled:true,mode:'percent',value:30},{clientId:'b',enabled:true,mode:'percent',value:70}]);eq(r.rows.map(x=>x.amount),[60,140])});add('Repartiment','Imports fixos',()=>ok(PYCInvoiceEngine.calculateAllocations(200,[{clientId:'a',enabled:true,mode:'amount',value:80},{clientId:'b',enabled:true,mode:'amount',value:120}]).valid));add('Repartiment','Parts iguals 3 clients',()=>{const r=PYCInvoiceEngine.equalSplit([{clientId:'a',enabled:true},{clientId:'b',enabled:true},{clientId:'c',enabled:true}]);eq(Math.round(r.reduce((s,x)=>s+x.value,0)*100)/100,100)});add('Validació','Factura correcta',()=>ok(PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'Servei',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]}).valid));add('Validació','Detecta concepte buit',()=>ok(PYCInvoiceEngine.validateInvoice({caseId:'c1',lines:[{concept:'',qty:1,price:100,vat:21}],allocations:[{clientId:'a',enabled:true,mode:'percent',value:100}]}).errors.includes('missing_concept')));const inv={number:'F-2026-001',lines:[{concept:'Assessorament',description:'QA',qty:1,price:100,vat:21}],allocations:[{clientId:'a',mode:'percent',value:100,amount:121}],base:100,vat:21,total:121};const ctx={settings:{name:'Julia María Rico López',tax:'74011732D',address:'Adreça fiscal',email:'info@pyc.legal',iban:'ES00 TEST'},clients:[{id:'a',name:'Client A',tax:'X123',address:'Adreça client'}],matter:{name:'Expedient QA'}};add('PDF','Nom emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('Julia María Rico López')));add('PDF','NIF emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('74011732D')));add('PDF','IBAN emissor',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('ES00 TEST')));add('PDF','Dades client',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('Client A')));add('PDF','Expedient',()=>ok(PYCInvoiceRenderer.render(inv,ctx,'a').includes('Expedient QA')));add('Mòbil','Seqüència 12345',()=>{let v='';for(const c of '12345')v+=c;eq(PYCInvoiceEngine.parseNumber(v),12345)});add('Mòbil','Seqüència 12,50',()=>eq(PYCInvoiceEngine.parseNumber('12,50'),12.5));async function run(){button.disabled=true;banner.className='banner';banner.textContent='Executant proves…';const start=performance.now(),results=[];for(const t of tests){try{await t.f();results.push({...t,pass:true})}catch(e){results.push({...t,pass:false,error:e.message||String(e)})}}const ms=Math.round(performance.now()-start),passed=results.filter(r=>r.pass).length,failed=results.length-passed;document.getElementById('total').textContent=results.length;document.getElementById('passed').textContent=passed;document.getElementById('failed').textContent=failed;document.getElementById('duration').textContent=ms+' ms';banner.className='banner '+(failed?'err':'ok');banner.textContent=failed?`${passed}/${results.length} correctes · RC2 NO preparada`:`${passed}/${results.length} correctes · RC2 READY`;const grouped={};results.forEach(r=>(grouped[r.g]??=[]).push(r));document.getElementById('groups').innerHTML=Object.entries(grouped).map(([g,items])=>`<section class="panel"><div class="head"><strong>${g}</strong><span>${items.filter(x=>x.pass).length}/${items.length}</span></div>${items.map(r=>`<div class="test"><span class="${r.pass?'pass':'fail'}">${r.pass?'✓':'✕'}</span><div><strong>${r.n}</strong>${r.error?`<pre>${r.error}</pre>`:''}</div><small>${r.pass?'PASS':'FAIL'}</small></div>`).join('')}</section>`).join('');button.disabled=false;return{passed,failed,results}}button.addEventListener('click',run);window.PYCInvoiceQA={run,tests};banner.textContent='Mòduls carregats. Executant proves…';run()})();</script></body></html>
