<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Motor documental</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:920px;margin:auto;padding:18px}.panel,.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.panel{overflow:hidden;margin-bottom:14px}.card{padding:15px}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}.metric{font:600 25px Georgia,serif;margin-top:5px}.row{padding:12px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:4px;line-height:1.35}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.full{width:100%}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.5}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:130px}.split{display:grid;gap:14px}.preview{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;white-space:pre-wrap;min-height:180px}.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:var(--soft);white-space:nowrap}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.split{grid-template-columns:1fr 1fr}.nav{left:50%;transform:translateX(-50%);max-width:720px;border:1px solid var(--l);border-radius:16px 16px 0 0}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>DOCUMENT ENGINE</small></div><div class="badges"><span class="badge">v0.2.1-dev.20</span><span class="badge">T-019</span><span class="badge">Schema v3</span><span class="badge">Versioned documents</span></div></header><main class="wrap"><section class="panel"><div class="head"><div><div id="caseCode" class="label">Sense expedient</div><h2 id="caseName">Motor documental</h2></div><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body"><div class="grid"><div class="card"><div class="label">Plantilles</div><div id="mTemplates" class="metric">0</div></div><div class="card"><div class="label">Documents</div><div id="mDocuments" class="metric">0</div></div><div class="card"><div class="label">Versions</div><div id="mVersions" class="metric">0</div></div><div class="card"><div class="label">Pendents signatura</div><div id="mSignatures" class="metric">0</div></div></div></div></section><section class="panel"><div class="head"><h2>Crear plantilla</h2></div><div class="body"><div class="field"><label>Nom</label><input id="templateName" placeholder="Ex. Full d'encàrrec"></div><div class="field"><label>Tipus</label><select id="templateType"><option value="full_encarrec">Full d'encàrrec</option><option value="informatiu">Informatiu</option><option value="lliure">Lliure</option></select></div><div class="field"><label>Contingut amb variables</label><textarea id="templateContent">Benvolgut/da {{client}},

En relació amb l'expedient {{expedient}}, confirmem l'encàrrec professional.

Atentament,
{{despatx}}</textarea></div><button class="btn primary full" onclick="createTemplateUI()">Desar plantilla</button></div></section><section class="panel"><div class="head"><h2>Crear document</h2></div><div class="body split"><div><div class="field"><label>Plantilla</label><select id="documentTemplate" onchange="renderPreview()"></select></div><div class="field"><label>Títol</label><input id="documentTitle" value="Full d'encàrrec"></div><div class="field"><label>Client</label><input id="varClient" value="Anna Garcia" oninput="renderPreview()"></div><div class="field"><label>Expedient</label><input id="varCase" value="Divorci Garcia - Pérez" oninput="renderPreview()"></div><div class="field"><label>Despatx</label><input id="varOffice" value="Punto y Coma" oninput="renderPreview()"></div><div class="field"><label><input id="signatureRequired" type="checkbox" checked> Requereix signatura</label></div><button class="btn primary full" onclick="createDocumentUI()">Crear document</button></div><div><div class="label" style="margin-bottom:8px">Previsualització</div><div id="preview" class="preview"></div></div></div></section><section class="panel"><div class="head"><h2>Documents versionats</h2></div><div id="documentList" class="body"></div></section><section class="panel"><div class="head"><h2>Diagnòstic · T-019</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></section></main><nav class="nav"><button onclick="location.href='case-center-v19.html?build=v0.2.1-dev.20'">Expedient</button><button class="active">Documents</button><button onclick="location.href='quality-center.html?build=v0.2.1-dev.20'">Qualitat</button></nav><script>const VERSION='v0.2.1-dev.20',SUITE='T-019',KEY='pyc_office_v2';const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(){return{version:3,settings:{name:'Punto y Coma'},clients:[],cases:[],documents:[],activity:[],events:[],tasks:[],serviceCatalog:[],billableItems:[],provisions:[],payments:[],migrations:[],documentTemplates:[]}}function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}function currentCase(s=load()){return s.cases.find(c=>c.id===localStorage.getItem('pyc_current_case'))||s.cases[0]||null}function renderTemplate(t,v){let out=String(t?.content||'');(t?.variables||['client','expedient','despatx']).forEach(k=>out=out.replace(new RegExp(`{{\\s*${k}\\s*}}`,'g'),String(v[k]??'')));return out}function createTemplateUI(){const s=load(),name=templateName.value.trim();if(!name)return alert('Cal indicar un nom.');const vars=[...new Set([...templateContent.value.matchAll(/{{\s*([\w_]+)\s*}}/g)].map(m=>m[1]))];s.documentTemplates=s.documentTemplates||[];s.documentTemplates.push({id:uid(),name,documentType:templateType.value,language:'ca',content:templateContent.value,variables:vars,active:true});save(s);renderPreview()}function renderPreview(){const s=load(),t=s.documentTemplates.find(x=>x.id===documentTemplate.value);preview.textContent=t?renderTemplate(t,{client:varClient.value,expedient:varCase.value,despatx:varOffice.value}):'Crea o selecciona una plantilla.'}function createDocumentUI(){const s=load(),c=currentCase(s),t=s.documentTemplates.find(x=>x.id===documentTemplate.value);if(!c||!t||!documentTitle.value.trim())return alert('Falten dades.');const content=renderTemplate(t,{client:varClient.value,expedient:varCase.value,despatx:varOffice.value}),now=new Date().toISOString(),version={id:uid(),number:1,content,createdAt:now,note:'Versió inicial'};const d={id:uid(),caseId:c.id,type:t.documentType,title:documentTitle.value.trim(),templateId:t.id,status:'esborrany',currentVersionId:version.id,versions:[version],signature:{required:signatureRequired.checked,status:signatureRequired.checked?'pendent':'no_requerida',signedAt:'',signerIds:[]},facturable:false,createdAt:now,updatedAt:now};s.documents.push(d);s.activity.push({id:uid(),caseId:c.id,title:'Document creat',body:d.title,date:now.slice(0,10)});save(s)}function addVersion(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d||['signat','arxivat'].includes(d.status))return alert('Aquest document no es pot editar.');const current=d.versions.find(v=>v.id===d.currentVersionId),content=prompt('Nou contingut',current?.content||'');if(content===null)return;const v={id:uid(),number:d.versions.length+1,content,createdAt:new Date().toISOString(),note:'Nova versió'};d.versions.push(v);d.currentVersionId=v.id;d.status='esborrany';d.updatedAt=new Date().toISOString();save(s)}function nextState(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d)return;const map={esborrany:'en_revisio',en_revisio:'aprovat',aprovat:d.signature.required?'signat':'arxivat',signat:'arxivat'};const next=map[d.status];if(!next)return alert('No hi ha cap transició disponible.');if(next==='signat'&&d.signature.required&&d.signature.status!=='completada')return alert('Completa primer la signatura.');d.status=next;save(s)}function completeSignatureUI(id){const s=load(),d=s.documents.find(x=>x.id===id);if(!d?.signature?.required)return alert('No requereix signatura.');d.signature.status='completada';d.signature.signedAt=new Date().toISOString();d.signature.signerIds=['demo-signer'];save(s)}function render(){const s=load(),c=currentCase(s),docs=s.documents.filter(d=>d.caseId===c?.id&&Array.isArray(d.versions));caseCode.textContent=c?.code||'Sense expedient';caseName.textContent=c?.name||'Motor documental';mTemplates.textContent=(s.documentTemplates||[]).length;mDocuments.textContent=docs.length;mVersions.textContent=docs.reduce((n,d)=>n+d.versions.length,0);mSignatures.textContent=docs.filter(d=>d.signature?.required&&d.signature.status!=='completada').length;documentTemplate.innerHTML=(s.documentTemplates||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')||'<option value="">Sense plantilles</option>';documentList.innerHTML=docs.length?docs.map(d=>`<div class="row"><div><strong>${esc(d.title)}</strong><small>${esc(d.status)} · ${d.versions.length} versió/ns · signatura ${esc(d.signature?.status||'no_requerida')}</small><small><button class="btn" onclick="addVersion('${d.id}')">Nova versió</button> <button class="btn" onclick="completeSignatureUI('${d.id}')">Signar</button> <button class="btn" onclick="nextState('${d.id}')">Avançar estat</button></small></div><span class="pill">v${d.versions.at(-1).number}</span></div>`).join(''):'<div class="status">Encara no hi ha documents versionats.</div>';renderPreview()}function loadDemo(){const s=load();s.clients=s.clients.filter(c=>!['doc-a','doc-b'].includes(c.id));s.cases=s.cases.filter(c=>c.id!=='doc-case');s.documents=s.documents.filter(d=>d.caseId!=='doc-case');s.documentTemplates=(s.documentTemplates||[]).filter(t=>t.id!=='tpl-demo');s.clients.push({id:'doc-a',name:'Anna Garcia'},{id:'doc-b',name:'Marc Pérez'});s.cases.push({id:'doc-case',code:'EXP-2026-018',name:'Divorci Garcia - Pérez',participants:[{clientId:'doc-a'},{clientId:'doc-b'}]});s.documentTemplates.push({id:'tpl-demo',name:'Full d’encàrrec base',documentType:'full_encarrec',language:'ca',content:'Benvolgut/da {{client}},\n\nExpedient: {{expedient}}\n\nDespatx: {{despatx}}',variables:['client','expedient','despatx'],active:true});localStorage.setItem('pyc_current_case','doc-case');save(s)}function runTests(){const original=localStorage.getItem(KEY),current=localStorage.getItem('pyc_current_case'),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'}]}];s.documentTemplates=[{id:'t',name:'Plantilla',documentType:'lliure',content:'Hola {{client}} · {{expedient}}',variables:['client','expedient']}];localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('pyc_current_case','e');ok('Build identificada',VERSION==='v0.2.1-dev.20'&&SUITE==='T-019');const rendered=renderTemplate(s.documentTemplates[0],{client:'Anna',expedient:'Cas'});ok('Variables resoltes',rendered==='Hola Anna · Cas');const v1={id:'v1',number:1,content:rendered};const d={id:'d',caseId:'e',type:'lliure',title:'Document',status:'esborrany',currentVersionId:'v1',versions:[v1],signature:{required:true,status:'pendent'}};s.documents.push(d);ok('Crear document versionat',s.documents[0].versions.length===1);s.documents[0].versions.push({id:'v2',number:2,content:'Nova versió'});s.documents[0].currentVersionId='v2';ok('Afegir versió',s.documents[0].versions.length===2&&s.documents[0].currentVersionId==='v2');s.documents[0].status='en_revisio';ok('Passar a revisió',s.documents[0].status==='en_revisio');s.documents[0].status='aprovat';s.documents[0].signature.status='completada';s.documents[0].status='signat';ok('Completar signatura',s.documents[0].signature.status==='completada'&&s.documents[0].status==='signat');const before=s.documents[0].versions.length;const locked=['signat','arxivat'].includes(s.documents[0].status);ok('Bloquejar document signat',locked&&s.documents[0].versions.length===before);s.documents[0].status='arxivat';ok('Arxivar document',s.documents[0].status==='arxivat')}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);if(current===null)localStorage.removeItem('pyc_current_case');else localStorage.setItem('pyc_current_case',current)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="row"><div><strong>${t.name}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const f=tests.filter(t=>!t.ok).length;testStatus.textContent=f?`${VERSION} · ${SUITE}: ${f} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(f?'bad':'ok')}render();runTests();</script></body></html>
