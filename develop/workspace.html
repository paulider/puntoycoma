<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b1730"><title>Punto y Coma · Workspace integrat</title><style>:root{--b:#6b1730;--p:#faf8f3;--i:#282125;--m:#776d71;--l:#ded6d1;--ok:#2f6f4e;--bad:#a22c3d;--soft:#f2ece7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}.top{background:var(--b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px}.brand{font:500 18px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px sans-serif;letter-spacing:.18em;opacity:.72;margin-top:7px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700}.wrap{max-width:920px;margin:auto;padding:18px}.panel,.card{background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 8px 24px rgba(60,30,40,.04)}.panel{overflow:hidden;margin-bottom:14px}.card{padding:15px}.head{padding:15px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0;font:500 20px Georgia,serif}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}.metric{font:600 25px Georgia,serif;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--l);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:700;color:var(--m)}.tab.active{background:var(--b);color:#fff;border-color:var(--b)}.view{display:none}.view.active{display:block}.row{padding:12px 0;border-bottom:1px solid #eee7e2;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border-bottom:0}.row strong{display:block}.row small{display:block;color:var(--m);margin-top:3px}.empty{padding:22px;text-align:center;color:var(--m)}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.status{padding:12px;border-radius:12px;background:var(--soft);font-size:13px}.status.ok{background:#e4f2ea;color:var(--ok)}.status.bad{background:#f8e7ea;color:var(--bad)}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:var(--m);padding:9px 2px;font-size:11px}.nav button.active{color:var(--b);font-weight:800}.modal{position:fixed;inset:0;background:rgba(25,14,19,.55);display:flex;align-items:flex-end;z-index:50}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--p);border-radius:22px 22px 0 0}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(250,248,243,.97)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff}.field textarea{min-height:90px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;justify-content:center;padding:20px}.sheet{max-width:680px;border-radius:22px}.nav{left:50%;transform:translateX(-50%);max-width:720px;border:1px solid var(--l);border-radius:16px 16px 0 0}}</style></head><body><header class="top"><div class="brand">PUNTO Y COMA<small>INTEGRATED CASE WORKSPACE</small></div><div class="badges"><span class="badge">v0.2.1-dev.18</span><span class="badge">T-017</span><span class="badge">Schema v3</span><span class="badge">Integrated modules</span></div></header><main class="wrap"><section class="panel"><div class="head"><div><div id="caseCode" class="label">Sense expedient</div><h2 id="caseName">Workspace integrat</h2></div><button class="btn primary" onclick="loadDemo()">Carregar demo</button></div><div class="body"><div class="grid"><div class="card"><div class="label">Documents</div><div id="mDocs" class="metric">0</div></div><div class="card"><div class="label">Factures</div><div id="mInvoices" class="metric">0</div></div><div class="card"><div class="label">Provisions</div><div id="mProvisions" class="metric">0 €</div></div><div class="card"><div class="label">Pendent cobrament</div><div id="mDue" class="metric">0 €</div></div></div></div></section><section class="panel"><div class="body"><div class="tabs"><button class="tab active" data-tab="overview" onclick="showTab('overview')">Resum</button><button class="tab" data-tab="documents" onclick="showTab('documents')">Documents</button><button class="tab" data-tab="invoices" onclick="showTab('invoices')">Factures</button><button class="tab" data-tab="provisions" onclick="showTab('provisions')">Provisions</button><button class="tab" data-tab="payments" onclick="showTab('payments')">Cobraments</button><button class="tab" data-tab="quality" onclick="showTab('quality')">Tests</button></div></div></section><section id="overviewView" class="view active"><div class="panel"><div class="head"><h2>Activitat recent</h2></div><div id="activityList" class="body"></div></div></section><section id="documentsView" class="view"><div class="panel"><div class="head"><h2>Documents</h2><button class="btn primary" onclick="openDocumentForm()">Nou document</button></div><div id="documentList" class="body"></div></div></section><section id="invoicesView" class="view"><div class="panel"><div class="head"><h2>Factures</h2><button class="btn primary" onclick="openInvoiceForm()">Nova factura</button></div><div id="invoiceList" class="body"></div></div></section><section id="provisionsView" class="view"><div class="panel"><div class="head"><h2>Provisions</h2><button class="btn primary" onclick="openProvisionForm()">Nova provisió</button></div><div id="provisionList" class="body"></div></div></section><section id="paymentsView" class="view"><div class="panel"><div class="head"><h2>Cobraments</h2><button class="btn primary" onclick="openPaymentForm()">Registrar cobrament</button></div><div id="paymentList" class="body"></div></div></section><section id="qualityView" class="view"><div class="panel"><div class="head"><h2>Diagnòstic · T-017</h2><button class="btn" onclick="runTests()">Executar</button></div><div class="body"><div id="testStatus" class="status">Preparant proves...</div><div id="testResults"></div></div></div></section></main><nav class="nav"><button class="active" onclick="location.href='index.html?build=v0.2.1-dev.18'">Inici</button><button onclick="location.href='case-center.html?build=v0.2.1-dev.18'">Expedient</button><button onclick="location.href='audit.html?build=v0.2.1-dev.18'">Auditoria</button><button onclick="location.href='quality-center.html?build=v0.2.1-dev.18'">Qualitat</button></nav><div id="modal"></div><script>
const VERSION='v0.2.1-dev.18',SUITE='T-017',KEY='pyc_office_v2';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const round=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(){return{version:3,settings:{invoicePrefix:'F-2026-',nextInvoiceNumber:1},clients:[],cases:[],documents:[],activity:[],events:[],tasks:[],serviceCatalog:[],billableItems:[],provisions:[],payments:[],migrations:[]}}
function load(){try{return{...empty(),...(JSON.parse(localStorage.getItem(KEY)||'null')||{})}}catch{return empty()}}function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}function currentCase(s=load()){return s.cases.find(c=>c.id===localStorage.getItem('pyc_current_case'))||s.cases[0]||null}
function showTab(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(name+'View').classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}
function render(){const s=load(),c=currentCase(s);caseCode.textContent=c?.code||'Sense expedient';caseName.textContent=c?.name||'Workspace integrat';const docs=s.documents.filter(d=>d.caseId===c?.id),invoices=docs.filter(d=>d.type==='factura'),provisions=s.provisions.filter(p=>p.caseId===c?.id),payments=s.payments.filter(p=>p.caseId===c?.id);mDocs.textContent=docs.length;mInvoices.textContent=invoices.length;mProvisions.textContent=round(provisions.reduce((a,p)=>a+(p.availableAmount||0),0)).toFixed(2)+' €';mDue.textContent=round(invoices.reduce((a,i)=>a+(i.amountDue??i.total??0),0)).toFixed(2)+' €';documentList.innerHTML=docs.filter(d=>d.type!=='factura').length?docs.filter(d=>d.type!=='factura').map(d=>row(d.title||d.type,(d.status||'actiu')+' · '+(d.date||''))).join(''):'<div class="empty">No hi ha documents.</div>';invoiceList.innerHTML=invoices.length?invoices.map(i=>row(i.number||'Sense número',(i.status||'esborrany')+' · '+Number(i.total||0).toFixed(2)+' €')).join(''):'<div class="empty">No hi ha factures.</div>';provisionList.innerHTML=provisions.length?provisions.map(p=>row(p.title||'Provisió',(p.status||'pendent')+' · saldo '+Number(p.availableAmount||0).toFixed(2)+' €')).join(''):'<div class="empty">No hi ha provisions.</div>';paymentList.innerHTML=payments.length?payments.map(p=>row((p.type||'cobrament')+' · '+Number(p.amount||0).toFixed(2)+' €',p.date||'')).join(''):'<div class="empty">No hi ha cobraments.</div>';const acts=s.activity.filter(a=>a.caseId===c?.id).slice().reverse();activityList.innerHTML=acts.length?acts.map(a=>row(a.title,a.date||'')).join(''):'<div class="empty">No hi ha activitat.</div>'}
function row(a,b){return `<div class="row"><div><strong>${esc(a)}</strong><small>${esc(b)}</small></div><span>›</span></div>`}function closeModal(){modal.innerHTML=''}function form(title,body,saveCall){modal.innerHTML=`<div class="modal"><div class="sheet"><div class="sheet-head"><h3>${title}</h3><button class="btn" onclick="closeModal()">Tancar</button></div><div class="body">${body}<button class="btn primary" style="width:100%" onclick="${saveCall}">Desar</button></div></div></div>`}
function openDocumentForm(){form('Nou document','<div class="field"><label>Títol</label><input id="fDocTitle"></div><div class="field"><label>Tipus</label><select id="fDocType"><option value="informatiu">Informatiu</option><option value="full_encarrec">Full d’encàrrec</option><option value="pressupost">Pressupost</option></select></div>','saveDocument()')}function saveDocument(){const s=load(),c=currentCase(s);if(!c||!fDocTitle.value.trim())return alert('Falten dades.');const d={id:uid(),caseId:c.id,type:fDocType.value,title:fDocTitle.value.trim(),status:'actiu',date:new Date().toISOString().slice(0,10)};s.documents.push(d);s.activity.push({id:uid(),caseId:c.id,title:'Document creat',date:d.date});save(s);closeModal()}
function openInvoiceForm(){form('Nova factura','<div class="field"><label>Concepte</label><input id="fInvTitle" value="Honoraris professionals"></div><div class="field"><label>Base</label><input id="fInvBase" type="number" step="0.01"></div>','saveInvoice()')}function saveInvoice(){const s=load(),c=currentCase(s),base=round(fInvBase.value);if(!c||base<=0)return alert('Import no vàlid.');const vat=round(base*.21),total=round(base+vat),seq=Number(s.settings.nextInvoiceNumber||1),number=`${s.settings.invoicePrefix}${String(seq).padStart(3,'0')}`;const i={id:uid(),caseId:c.id,type:'factura',title:fInvTitle.value.trim()||'Factura',number,status:'emesa',base,vat,total,amountDue:total,paidAmount:0,lines:[{id:uid(),kind:'service',description:fInvTitle.value.trim()||'Honoraris',quantity:1,unitPrice:base,subtotal:base,vatRate:21,irpfRate:0}]};s.settings.nextInvoiceNumber=seq+1;s.documents.push(i);s.activity.push({id:uid(),caseId:c.id,title:'Factura emesa',body:number,date:new Date().toISOString().slice(0,10)});save(s);closeModal()}
function openProvisionForm(){form('Nova provisió','<div class="field"><label>Import</label><input id="fProvAmount" type="number" step="0.01"></div>','saveProvision()')}function saveProvision(){const s=load(),c=currentCase(s),amount=round(fProvAmount.value);if(!c||amount<=0)return alert('Import no vàlid.');s.provisions.push({id:uid(),caseId:c.id,title:'Provisió de fons',requestedAmount:amount,paidAmount:amount,appliedAmount:0,availableAmount:amount,status:'pagada'});s.activity.push({id:uid(),caseId:c.id,title:'Provisió registrada',date:new Date().toISOString().slice(0,10)});save(s);closeModal()}
function openPaymentForm(){const s=load(),c=currentCase(s),invoices=s.documents.filter(d=>d.caseId===c?.id&&d.type==='factura'&&(d.amountDue||0)>0);if(!invoices.length)return alert('No hi ha factures pendents.');form('Registrar cobrament',`<div class="field"><label>Factura</label><select id="fPayInvoice">${invoices.map(i=>`<option value="${i.id}">${i.number} · ${Number(i.amountDue).toFixed(2)} €</option>`).join('')}</select></div><div class="field"><label>Import</label><input id="fPayAmount" type="number" step="0.01"></div>`,'savePayment()')}function savePayment(){const s=load(),inv=s.documents.find(d=>d.id===fPayInvoice.value),amount=round(fPayAmount.value);if(!inv||amount<=0||amount>inv.amountDue)return alert('Import no vàlid.');inv.paidAmount=round((inv.paidAmount||0)+amount);inv.amountDue=round(inv.total-inv.paidAmount-(inv.provisionApplied||0));inv.status=inv.amountDue===0?'cobrada':'parcialment_cobrada';s.payments.push({id:uid(),caseId:inv.caseId,invoiceId:inv.id,type:'cobrament',amount,date:new Date().toISOString().slice(0,10)});s.activity.push({id:uid(),caseId:inv.caseId,title:'Cobrament registrat',date:new Date().toISOString().slice(0,10)});save(s);closeModal()}
function loadDemo(){const s=load();s.clients=s.clients.filter(c=>!['w-a','w-b'].includes(c.id));s.cases=s.cases.filter(c=>c.id!=='w-case');s.documents=s.documents.filter(d=>d.caseId!=='w-case');s.provisions=s.provisions.filter(p=>p.caseId!=='w-case');s.payments=s.payments.filter(p=>p.caseId!=='w-case');s.activity=s.activity.filter(a=>a.caseId!=='w-case');s.clients.push({id:'w-a',name:'Anna Garcia'},{id:'w-b',name:'Marc Pérez'});s.cases.push({id:'w-case',code:'EXP-2026-018',name:'Divorci Garcia - Pérez',status:'obert',participants:[{clientId:'w-a'},{clientId:'w-b'}]});localStorage.setItem('pyc_current_case','w-case');save(s)}
function runTests(){const original=localStorage.getItem(KEY),current=localStorage.getItem('pyc_current_case'),tests=[],ok=(n,c)=>tests.push({name:n,ok:Boolean(c)});try{let s=empty();s.clients=[{id:'a',name:'Anna'}];s.cases=[{id:'e',name:'Cas',participants:[{clientId:'a'}]}];localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('pyc_current_case','e');ok('Build sincronitzada',VERSION==='v0.2.1-dev.18'&&SUITE==='T-017');ok('Schema v3',load().version===3);s=load();s.documents.push({id:'d',caseId:'e',type:'informatiu',title:'Document'});ok('Documents integrats',s.documents.filter(d=>d.caseId==='e').length===1);s.provisions.push({id:'p',caseId:'e',availableAmount:300});ok('Provisions integrades',s.provisions.filter(p=>p.caseId==='e').length===1);s.documents.push({id:'i',caseId:'e',type:'factura',total:121,amountDue:121,status:'emesa'});ok('Factures integrades',s.documents.filter(d=>d.type==='factura').length===1);s.payments.push({id:'pay',caseId:'e',invoiceId:'i',amount:21});ok('Cobraments integrats',s.payments.length===1);ok('Relacions consistents',s.payments[0].invoiceId==='i'&&s.documents.some(d=>d.id==='i'))}catch(e){tests.push({name:'Execució',ok:false,error:e.message})}finally{if(original===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,original);if(current===null)localStorage.removeItem('pyc_current_case');else localStorage.setItem('pyc_current_case',current)}ok('Restaurar dades',localStorage.getItem(KEY)===original);render();testResults.innerHTML=tests.map(t=>`<div class="row"><div><strong>${t.name}</strong>${t.error?`<small>${esc(t.error)}</small>`:''}</div><span>${t.ok?'Correcte':'Error'}</span></div>`).join('');const failed=tests.filter(t=>!t.ok).length;testStatus.textContent=failed?`${VERSION} · ${SUITE}: ${failed} proves han fallat.`:`${VERSION} · ${SUITE}: totes les ${tests.length} proves han passat.`;testStatus.className='status '+(failed?'bad':'ok')}
render();runTests();</script></body></html>
